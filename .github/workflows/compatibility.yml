name: Desktop compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-binding-diagnostics:
    strategy:
      fail-fast: false
      matrix:
        qt: ['PySide6>=6.11,<6.12', 'PySide6>=6.12,<6.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Isolated Qt binding lifetime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0
          python -m venv .venv-qt-probe
          .venv-qt-probe/bin/python -m pip install '${{ matrix.qt }}'
          .venv-qt-probe/bin/python -B direct/verify_qt_binding_lifetime.py
  ubuntu-first-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONFAULTHANDLER: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v6
      - name: Ubuntu first-launch prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep xclip wl-clipboard libsecret-tools
          sudo apt-get install -y xvfb python3-venv python3-tk build-essential git xdg-utils libusb-1.0-0 libudev1 libegl1 libgl1 libnss3 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-randr0 libxcb-sync1 libxcb-shm0 libxcb-xfixes0 libxcb-render0 libxcb-util1
          sudo apt-get install -y libnspr4 libgbm1 libxcb1 libxcb-dri3-0 libx11-6 libx11-xcb1 libxext6 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxrender1 libxtst6 libxkbfile1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6
          # Use Bootstrap's host detection for the 24.04/26.04 t64 names.
          read -r -a qt_runtime_packages <<< "$(/usr/bin/python3 -c 'from direct.ubuntu.preflight import normalize_packages; print(" ".join(normalize_packages(["libasound2", "libglib2.0-0"])))')"
          sudo apt-get install -y "${qt_runtime_packages[@]}"
      - name: Empty native runtime and full default board store
        run: |
          bash direct/ubuntu/build_launcher.sh
          # Real installers run only in the disposable application copy.
          # CPU admission is overridden only in that copy for smaller runners.
          # The system Python covers 3.12 on 24.04 and 3.14 on 26.04.
          xvfb-run -a /usr/bin/python3 -B direct/verify_ubuntu_first_run.py --execute --allow-small-runner --timeout 2400
      - name: Ubuntu first-launch evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: first-launch-${{ matrix.os }}
          path: |
            temp/audit/ubuntu-first-run/*/*.json
            temp/audit/ubuntu-first-run/*/*.log
            temp/audit/ubuntu-first-run/*/*.png
            temp/audit/ubuntu-first-run/*/runtime-captures/*.png
            temp/audit/ubuntu-first-run/*/app/logs/offline-builders-*/*.log
            temp/audit/ubuntu-first-run/*/app/temp/audit/first-compile/application-compile.log
          if-no-files-found: ignore
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep xclip wl-clipboard libsecret-tools
          sudo apt-get install -y xvfb python3-tk build-essential git xdg-utils libusb-1.0-0 libudev1 libegl1 libgl1 libnss3 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-randr0 libxcb-sync1 libxcb-shm0 libxcb-xfixes0 libxcb-render0 libxcb-util1
          sudo apt-get install -y libnspr4 libgbm1 libxcb1 libxcb-dri3-0 libx11-6 libx11-xcb1 libxext6 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxrender1 libxtst6 libxkbfile1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6
          read -r -a qt_runtime_packages <<< "$(/usr/bin/python3 -c 'from direct.ubuntu.preflight import normalize_packages; print(" ".join(normalize_packages(["libasound2", "libglib2.0-0"])))')"
          sudo apt-get install -y "${qt_runtime_packages[@]}"
      - name: Linux runtime and verification
        if: runner.os == 'Linux'
        run: |
          bash -n direct/ubuntu/run.sh
          bash -n direct/ubuntu/build_launcher.sh
          bash -n direct/runThisOnUbuntu.sh
          bash direct/ubuntu/build_launcher.sh
          ./MCU_Flasher --help
          # Verification may run on a runner below the desktop's CPU minimum.
          python -m venv .venv-linux
          .venv-linux/bin/python -m pip install -r direct/ubuntu/requirements.txt
          # Report the actual native plugin dependency instead of Qt's generic
          # xcb-cursor message when any X11 library is absent on a clean runner.
          .venv-linux/bin/python - <<'PY'
          import subprocess
          from pathlib import Path
          import PySide6
          plugin = Path(PySide6.__file__).parent / 'Qt/plugins/platforms/libqxcb.so'
          result = subprocess.run(['ldd', str(plugin)], capture_output=True, text=True, check=True)
          missing = [line.strip() for line in result.stdout.splitlines() if 'not found' in line]
          if missing:
              raise SystemExit('Missing Qt X11 dependencies: ' + '; '.join(missing))
          print('Native Qt X11 plugin dependencies are available')
          PY
          .venv-linux/bin/python -B direct/verify_platforms.py
          .venv-linux/bin/python -B direct/verify_ubuntu_launcher.py
          .venv-linux/bin/python -B direct/verify_ubuntu_bootstrap.py
          .venv-linux/bin/python -B direct/verify_ubuntu_system_setup.py
          .venv-linux/bin/python -B -W error::DeprecationWarning -W error::SyntaxWarning direct/verify_ubuntu_runtime.py
          .venv-linux/bin/python -B direct/verify_ubuntu_arduino_cli.py
          .venv-linux/bin/python -B direct/verify_ubuntu_opencode_setup.py
          .venv-linux/bin/python -B direct/verify_ubuntu_download_manager.py
          .venv-linux/bin/python -B -W error::DeprecationWarning -W error::SyntaxWarning direct/verify_ubuntu_resets.py
          .venv-linux/bin/python -B -W error::DeprecationWarning -W error::SyntaxWarning direct/verify_ubuntu_pty_lifecycle.py
          .venv-linux/bin/python -B direct/verify_ubuntu_opencode.py
          .venv-linux/bin/python -B -W error::DeprecationWarning -W error::SyntaxWarning direct/verify_ubuntu_ai_panel.py
          xvfb-run -a env QT_QPA_PLATFORM=xcb .venv-linux/bin/python -B -W error::DeprecationWarning -W error::SyntaxWarning direct/verify_ubuntu_ai_panel.py --native-renderer
          xvfb-run -a env QT_QPA_PLATFORM=xcb .venv-linux/bin/python -B -W error::DeprecationWarning -W error::SyntaxWarning direct/verify_ubuntu_ai_panel.py --workspace-renderer
          .venv-linux/bin/python -B direct/verify_ubuntu_ports.py
          xvfb-run -a env QT_QPA_PLATFORM=xcb .venv-linux/bin/python -B direct/verify_ubuntu_event_filters.py --no-finalize
          .venv-linux/bin/python -B direct/verify_offline.py
          .venv-linux/bin/python -B direct/verify_target_resolution.py
          .venv-linux/bin/python -B direct/verify_board_families.py
          .venv-linux/bin/python -B direct/verify_board_search.py --no-finalize
          .venv-linux/bin/python -B direct/verify_projects.py
          .venv-linux/bin/python -B direct/verify_cloud_configuration.py
          .venv-linux/bin/python -B direct/verify_cloud_sketch_service.py
          .venv-linux/bin/python -B direct/verify_cloud_sketch_ui.py --no-finalize
          .venv-linux/bin/python -B direct/verify_owner_ticket_service.py
          .venv-linux/bin/python -B direct/verify_owner_tickets.py --render-dir temp/audit/compatibility/developer --no-finalize
          .venv-linux/bin/python -B direct/verify_application_guard.py
          .venv-linux/bin/python -B direct/verify_actions.py
          .venv-linux/bin/python -B direct/verify_cursor.py
          .venv-linux/bin/python -B direct/verify_preferences.py
          .venv-linux/bin/python -B direct/verify_storage_resources.py
          .venv-linux/bin/python -B direct/verify_storage_io.py
          .venv-linux/bin/python -B direct/verify_slow_storage_flow.py
          .venv-linux/bin/python -B direct/verify_catalog_io.py
          .venv-linux/bin/python -B direct/verify_upload_workers.py
          .venv-linux/bin/python -B direct/verify_build_log_routing.py
          .venv-linux/bin/python -B direct/verify_ubuntu_logging.py
          .venv-linux/bin/python -B direct/verify_serial_reader.py
          # Clipboard ownership needs a native platform through process exit.
          xvfb-run -a env QT_QPA_PLATFORM=xcb .venv-linux/bin/python -B direct/verify_serial_view.py --no-finalize
          .venv-linux/bin/python -B direct/verify_serial_wrap.py --no-finalize
          .venv-linux/bin/python -B direct/verify_serial_delivery.py --no-finalize
          node direct/verify_editor_preferences.js
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_DEBUG_PLUGINS=1 .venv-linux/bin/python -B direct/verify_runtime.py --render-dir temp/audit/compatibility --no-finalize
          .venv-linux/bin/python -B direct/verify_performance.py --no-finalize
          xvfb-run -a env QT_QPA_PLATFORM=xcb .venv-linux/bin/python -B direct/verify_controls.py --render-dir temp/audit/compatibility
          xvfb-run -a env QT_QPA_PLATFORM=xcb .venv-linux/bin/python -B direct/verify_browser_loading.py
          for scale in 1 1.25 1.5 2; do
            xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=$scale .venv-linux/bin/python -B direct/verify_responsive.py --render-dir temp/audit/compatibility/scale-$scale
          done
      - name: Native Ubuntu AVR Compile-button integration
        if: runner.os == 'Linux'
        env:
          PLATFORMIO_CORE_DIR: ${{ github.workspace }}/temp/audit/ci-native-avr-core
          PLATFORMIO_PACKAGES_DIR: ${{ github.workspace }}/temp/audit/ci-native-avr-core/packages
          PLATFORMIO_PLATFORMS_DIR: ${{ github.workspace }}/temp/audit/ci-native-avr-core/platforms
          PLATFORMIO_GLOBALLIB_DIR: ${{ github.workspace }}/temp/audit/ci-native-avr-core/lib
          PLATFORMIO_CACHE_DIR: ${{ github.workspace }}/temp/audit/ci-native-avr-core/.cache
          PLATFORMIO_NO_TELEMETRY: '1'
          PLATFORMIO_DISABLE_UPGRADE_CHECK: '1'
        run: |
          # Provision native packages only in a CI scratch fixture; no hardware.
          .venv-linux/bin/python - <<'PY'
          from pathlib import Path
          project = Path('temp/audit/ci-native-avr-project')
          (project / 'src').mkdir(parents=True, exist_ok=True)
          (project / 'platformio.ini').write_text('[env:probe]\nplatform = atmelavr\nboard = uno\nframework = arduino\n')
          (project / 'src/main.cpp').write_text('#include <Arduino.h>\nvoid setup() {}\nvoid loop() {}\n')
          PY
          .venv-linux/bin/python -B -m platformio run -d temp/audit/ci-native-avr-project -j 2
          .venv-linux/bin/python -B -m platformio pkg install -g -t platformio/tool-avrdude
          .venv-linux/bin/python -B direct/verify_target_resolution.py --compile-installed-avr --avr-core temp/audit/ci-native-avr-core --no-finalize
      - name: Native Ubuntu ESP32 Compile-button integration
        if: runner.os == 'Linux'
        env:
          PLATFORMIO_CORE_DIR: ${{ github.workspace }}/temp/audit/ci-native-esp32/core
          PLATFORMIO_PACKAGES_DIR: ${{ github.workspace }}/temp/audit/ci-native-esp32/core/packages
          PLATFORMIO_PLATFORMS_DIR: ${{ github.workspace }}/temp/audit/ci-native-esp32/core/platforms
          PLATFORMIO_GLOBALLIB_DIR: ${{ github.workspace }}/temp/audit/ci-native-esp32/core/lib
          PLATFORMIO_CACHE_DIR: ${{ github.workspace }}/temp/audit/ci-native-esp32/core/.cache
          MCU_PACKAGE_EVENTS_ROOT: ${{ github.workspace }}/temp/audit/ci-native-esp32/events
          PLATFORMIO_NO_TELEMETRY: '1'
          PLATFORMIO_DISABLE_UPGRADE_CHECK: '1'
        run: |
          .venv-linux/bin/python - <<'PY'
          from pathlib import Path
          project = Path('temp/audit/ci-native-esp32/project')
          (project / 'src').mkdir(parents=True, exist_ok=True)
          (project / 'platformio.ini').write_text('[env:mcu_env]\nplatform = platformio/espressif32\nboard = esp32dev\nframework = arduino\n')
          (project / 'src/main.cpp').write_text('#include <Arduino.h>\nvoid setup() {}\nvoid loop() {}\n')
          PY
          .venv-linux/bin/python -B -m platformio pkg install -d temp/audit/ci-native-esp32/project
          xvfb-run -a env QT_QPA_PLATFORM=xcb .venv-linux/bin/python -B direct/verify_target_resolution.py --compile-native-esp32 temp/audit/ci-native-esp32/core --no-finalize
      - name: Windows runtime and verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv env
          & env/Scripts/python.exe -m pip install 'PySide6>=6.7,<7' 'pyserial>=3.5,<4' 'psutil>=5.9,<8' 'platformio>=6.1,<7' 'requests>=2.31,<3' pywinpty websockets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_platforms.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_offline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_target_resolution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_board_families.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_board_search.py --no-finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_projects.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($check in 'verify_cloud_configuration', 'verify_cloud_sketch_service', 'verify_cloud_sketch_ui', 'verify_owner_ticket_service', 'verify_owner_tickets') {
            & env/Scripts/python.exe -B "direct/$check.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($check in 'verify_application_guard', 'verify_actions', 'verify_cursor', 'verify_preferences', 'verify_storage_resources', 'verify_storage_io', 'verify_slow_storage_flow', 'verify_catalog_io', 'verify_upload_workers', 'verify_build_log_routing', 'verify_serial_reader') {
            & env/Scripts/python.exe -B "direct/$check.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & env/Scripts/python.exe -B direct/verify_serial_wrap.py --no-finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_serial_delivery.py --no-finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_serial_view.py --no-finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node direct/verify_editor_preferences.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_runtime.py --render-dir temp/audit/compatibility --no-finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_terminal.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_performance.py --no-finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_QPA_PLATFORM = 'windows'
          & env/Scripts/python.exe -B direct/verify_controls.py --render-dir temp/audit/compatibility
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_browser_loading.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($scale in '1', '1.25', '1.5', '2') {
            $env:QT_SCALE_FACTOR = $scale
            & env/Scripts/python.exe -B direct/verify_responsive.py --render-dir "temp/audit/compatibility/scale-$scale"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit $LASTEXITCODE
      - name: Desktop previews
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.os }}
          path: |
            temp/audit/compatibility/**/*.png
            temp/audit/target-resolution/*/*.json
            temp/audit/target-resolution/*/*.log
          if-no-files-found: ignore
