name: Desktop compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libegl1 libgl1 libnss3 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-randr0 libxcb-sync1 libxcb-shm0 libxcb-xfixes0 libxcb-render0 libxcb-util1
          if [ "${{ matrix.os }}" = ubuntu-24.04 ]; then
            sudo apt-get install -y libasound2t64
          else
            sudo apt-get install -y libasound2
          fi
      - name: Linux runtime and verification
        if: runner.os == 'Linux'
        run: |
          bash -n direct/ubuntu/run.sh
          bash -n direct/runThisOnUbuntu.sh
          # Verification may run on a runner below the desktop's CPU minimum.
          python -m venv .venv-linux
          .venv-linux/bin/python -m pip install -r direct/ubuntu/requirements.txt
          # Report the actual native plugin dependency instead of Qt's generic
          # xcb-cursor message when any X11 library is absent on a clean runner.
          .venv-linux/bin/python - <<'PY'
          import subprocess
          from pathlib import Path
          import PySide6
          plugin = Path(PySide6.__file__).parent / 'Qt/plugins/platforms/libqxcb.so'
          result = subprocess.run(['ldd', str(plugin)], capture_output=True, text=True, check=True)
          missing = [line.strip() for line in result.stdout.splitlines() if 'not found' in line]
          if missing:
              raise SystemExit('Missing Qt X11 dependencies: ' + '; '.join(missing))
          print('Native Qt X11 plugin dependencies are available')
          PY
          .venv-linux/bin/python -B direct/verify_platforms.py
          .venv-linux/bin/python -B direct/verify_offline.py
          .venv-linux/bin/python -B direct/verify_target_resolution.py
          .venv-linux/bin/python -B direct/verify_board_families.py
          .venv-linux/bin/python -B direct/verify_board_search.py
          .venv-linux/bin/python -B direct/verify_projects.py
          .venv-linux/bin/python -B direct/verify_application_guard.py
          .venv-linux/bin/python -B direct/verify_actions.py
          .venv-linux/bin/python -B direct/verify_cursor.py
          .venv-linux/bin/python -B direct/verify_preferences.py
          .venv-linux/bin/python -B direct/verify_storage_resources.py
          .venv-linux/bin/python -B direct/verify_storage_io.py
          .venv-linux/bin/python -B direct/verify_slow_storage_flow.py
          .venv-linux/bin/python -B direct/verify_catalog_io.py
          .venv-linux/bin/python -B direct/verify_upload_workers.py
          .venv-linux/bin/python -B direct/verify_build_log_routing.py
          .venv-linux/bin/python -B direct/verify_serial_reader.py
          .venv-linux/bin/python -B direct/verify_serial_view.py
          .venv-linux/bin/python -B direct/verify_serial_wrap.py
          .venv-linux/bin/python -B direct/verify_serial_delivery.py
          node direct/verify_editor_preferences.js
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_DEBUG_PLUGINS=1 .venv-linux/bin/python -B direct/verify_runtime.py --render-dir temp/audit/compatibility
          .venv-linux/bin/python -B direct/verify_performance.py
          xvfb-run -a env QT_QPA_PLATFORM=xcb .venv-linux/bin/python -B direct/verify_controls.py --render-dir temp/audit/compatibility
          xvfb-run -a env QT_QPA_PLATFORM=xcb .venv-linux/bin/python -B direct/verify_browser_loading.py
          for scale in 1 1.25 1.5 2; do
            xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=$scale .venv-linux/bin/python -B direct/verify_responsive.py --render-dir temp/audit/compatibility/scale-$scale
          done
      - name: Native Ubuntu AVR Compile-button integration
        if: runner.os == 'Linux'
        env:
          PLATFORMIO_CORE_DIR: ${{ github.workspace }}/temp/audit/ci-native-avr-core
          PLATFORMIO_PACKAGES_DIR: ${{ github.workspace }}/temp/audit/ci-native-avr-core/packages
          PLATFORMIO_PLATFORMS_DIR: ${{ github.workspace }}/temp/audit/ci-native-avr-core/platforms
          PLATFORMIO_GLOBALLIB_DIR: ${{ github.workspace }}/temp/audit/ci-native-avr-core/lib
          PLATFORMIO_CACHE_DIR: ${{ github.workspace }}/temp/audit/ci-native-avr-core/.cache
          PLATFORMIO_NO_TELEMETRY: '1'
          PLATFORMIO_DISABLE_UPGRADE_CHECK: '1'
        run: |
          # Provision native packages only in a CI scratch fixture; no hardware.
          .venv-linux/bin/python - <<'PY'
          from pathlib import Path
          project = Path('temp/audit/ci-native-avr-project')
          (project / 'src').mkdir(parents=True, exist_ok=True)
          (project / 'platformio.ini').write_text('[env:probe]\nplatform = atmelavr\nboard = uno\nframework = arduino\n')
          (project / 'src/main.cpp').write_text('#include <Arduino.h>\nvoid setup() {}\nvoid loop() {}\n')
          PY
          .venv-linux/bin/python -B -m platformio run -d temp/audit/ci-native-avr-project -j 2
          .venv-linux/bin/python -B -m platformio pkg install -g -t platformio/tool-avrdude
          .venv-linux/bin/python -B direct/verify_target_resolution.py --compile-installed-avr --avr-core temp/audit/ci-native-avr-core
      - name: Windows runtime and verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv env
          & env/Scripts/python.exe -m pip install 'PySide6>=6.7,<7' 'pyserial>=3.5,<4' 'psutil>=5.9,<8' 'platformio>=6.1,<7' 'requests>=2.31,<3' pywinpty websockets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_platforms.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_offline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_target_resolution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_board_families.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_board_search.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_projects.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($check in 'verify_application_guard', 'verify_actions', 'verify_cursor', 'verify_preferences', 'verify_storage_resources', 'verify_storage_io', 'verify_slow_storage_flow', 'verify_catalog_io', 'verify_upload_workers', 'verify_build_log_routing', 'verify_serial_reader', 'verify_serial_view', 'verify_serial_wrap', 'verify_serial_delivery') {
            & env/Scripts/python.exe -B "direct/$check.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node direct/verify_editor_preferences.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_runtime.py --render-dir temp/audit/compatibility
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_terminal.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_performance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_QPA_PLATFORM = 'windows'
          & env/Scripts/python.exe -B direct/verify_controls.py --render-dir temp/audit/compatibility
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -B direct/verify_browser_loading.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($scale in '1', '1.25', '1.5', '2') {
            $env:QT_SCALE_FACTOR = $scale
            & env/Scripts/python.exe -B direct/verify_responsive.py --render-dir "temp/audit/compatibility/scale-$scale"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit $LASTEXITCODE
      - name: Desktop previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            temp/audit/compatibility/**/*.png
            temp/audit/target-resolution/*/*.json
            temp/audit/target-resolution/*/*.log
          if-no-files-found: ignore
