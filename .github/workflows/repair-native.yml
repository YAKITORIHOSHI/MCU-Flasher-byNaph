name: Native repair checks

on:
  push:
    paths:
      - .github/workflows/repair-native.yml
      - main/qt/combo_popup.py
      - main/qt/log_follow.py
      - main/qt/toolbar.py
      - main/qt/main_window.py
      - main/qt/settings_dialog.py
      - main/qt/package_browser.py
      - src/qscintilla_viewer.py
      - src/modules/sample_symbols.py
      - src/modules/bootstrap.py
      - src/modules/bootstrap_qt.py
      - src/modules/app_update.py
      - direct/verify_combo_popups.py
      - direct/verify_controls.py
      - direct/verify_library_samples.py
      - direct/verify_responsive.py
      - direct/verify_monitor_matrix.py
  workflow_dispatch:
    inputs:
      focused:
        description: Run popup, Settings, sample and update checks; reuse prior layout qualification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      QT_QPA_PLATFORM: windows
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Private fixture runtime
        shell: pwsh
        run: |
          python -m venv env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -m pip install 'PySide6>=6.12,<7' 'PyQt5>=5.15.11,<6' 'QScintilla>=2.14.1,<3' 'requests>=2.31,<3' 'psutil>=5.9,<8' 'pyserial>=3.5,<4' 'platformio>=6.1,<7' websockets pywinpty
          exit $LASTEXITCODE
      - name: Independent native windows and compact splitters
        shell: pwsh
        run: |
          @'
          import json, os, pathlib, subprocess, sys
          output = pathlib.Path('temp/audit/native-repair')
          output.mkdir(parents=True, exist_ok=True)
          results = []
          cases = []
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          focused = str(event.get('inputs', {}).get('focused', False)).lower() == 'true'
          for scale in ('1', '1.25', '1.5', '1.75', '2'):
              cases += [
                  (f'popups-{scale}', scale, ['direct/verify_combo_popups.py', '--render-dir', str(output / ('popups-' + scale))]),
                  (f'controls-{scale}', scale, ['direct/verify_controls.py']),
                  (f'samples-{scale}', scale, ['direct/verify_library_samples.py', '--scale', scale, '--render-dir', str(output / ('samples-' + scale))]),
              ]
          for scale in (() if focused else ('1', '1.25', '1.5', '1.75', '2')):
              cases += [
                  (f'rows-{scale}', scale, ['direct/verify_responsive.py', '--only', 'control_rows_and_serial_reflow']),
                  (f'labels-{scale}', scale, ['direct/verify_responsive.py', '--only', 'selecting_a_tool_tab']),
                  (f'combined-{scale}', scale, ['direct/verify_responsive.py', '--only', 'control_rows_and_serial_reflow', '--only', 'selecting_a_tool_tab']),
              ]
          if not focused:
              cases += [('full-responsive-1.25', '1.25', ['direct/verify_responsive.py', '--render-dir', str(output / 'responsive-1.25')]),
                    ('compact-matrix', '1', ['direct/verify_monitor_matrix.py', '--only', '1024x768@100', '--only', '1280x720@150']),
                    ('terminal', '1', ['direct/verify_terminal.py']),
                    ('performance', '1', ['direct/verify_performance.py'])]
          cases += [('bootstrap-updates', '1', ['direct/verify_bootstrap_updates.py']),
                    ('source-updates', '1', ['direct/verify_app_update.py'])]
          for name, scale, arguments in cases:
              log = output / (name + '.log')
              with log.open('w', encoding='utf-8') as stream:
                  try:
                      code = subprocess.run([sys.executable, '-B', *arguments], env=dict(os.environ, QT_SCALE_FACTOR=scale),
                                            stdout=stream, stderr=subprocess.STDOUT, timeout=240).returncode
                  except subprocess.TimeoutExpired:
                      code = 124
              results.append(dict(name=name, code=code))
              print(f'{name}: {code}', flush=True)
              if code:
                  print(log.read_text(encoding='utf-8', errors='replace')[-6000:], flush=True)
          (output / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
          raise SystemExit(any(row['code'] for row in results))
          '@ | & env/Scripts/python.exe -B -
          exit $LASTEXITCODE
      - name: Compare fractional-scale scroll behavior with previous release
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os, pathlib, subprocess
          from direct.run_verifiers import export_baseline, run_one
          output = pathlib.Path('temp/audit/native-repair')
          output.mkdir(parents=True, exist_ok=True)
          reference = '3ee262375e619ab4f26dc255bf5c8cc6f42b9cc4'
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', reference], check=True)
          source = output / 'baseline-source'
          source.mkdir(exist_ok=True)
          export_baseline(reference, source)
          results = []
          for scale in ('1.75', '2'):
              os.environ['QT_SCALE_FACTOR'] = scale
              result = run_one('verify_controls', source.resolve(), 240, output / ('baseline-controls-' + scale + '.log'), True)
              result['failures'] = sorted(result['failures'])
              results.append(dict(scale=scale, **result))
          (output / 'baseline-controls.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results, indent=2))
          '@ | & env/Scripts/python.exe -B -
          exit $LASTEXITCODE
      - name: Native repair evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-repair-windows
          path: temp/audit/native-repair
