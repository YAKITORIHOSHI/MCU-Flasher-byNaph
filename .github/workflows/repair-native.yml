name: Native repair checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: windows
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Private fixture runtime
        shell: pwsh
        run: |
          python -m venv env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -m pip install 'PySide6>=6.12,<7' 'requests>=2.31,<3' 'psutil>=5.9,<8' 'pyserial>=3.5,<4' 'platformio>=6.1,<7' websockets pywinpty
          exit $LASTEXITCODE
      - name: Independent native windows and compact splitters
        shell: pwsh
        run: |
          @'
          import json, os, pathlib, subprocess, sys
          output = pathlib.Path('temp/audit/native-repair')
          output.mkdir(parents=True, exist_ok=True)
          results = []
          cases = []
          for scale in ('1', '1.25', '1.5', '1.75', '2'):
              cases += [
                  (f'rows-{scale}', scale, ['direct/verify_responsive.py', '--only', 'control_rows_and_serial_reflow']),
                  (f'labels-{scale}', scale, ['direct/verify_responsive.py', '--only', 'selecting_a_tool_tab']),
                  (f'combined-{scale}', scale, ['direct/verify_responsive.py', '--only', 'control_rows_and_serial_reflow', '--only', 'selecting_a_tool_tab']),
              ]
          cases += [('compact-matrix', '1', ['direct/verify_monitor_matrix.py', '--only', '1024x768@100', '--only', '1280x720@150']),
                    ('terminal', '1', ['direct/verify_terminal.py']),
                    ('performance', '1', ['direct/verify_performance.py'])]
          for name, scale, arguments in cases:
              log = output / (name + '.log')
              with log.open('w', encoding='utf-8') as stream:
                  try:
                      code = subprocess.run([sys.executable, '-B', *arguments], env=dict(os.environ, QT_SCALE_FACTOR=scale),
                                            stdout=stream, stderr=subprocess.STDOUT, timeout=240).returncode
                  except subprocess.TimeoutExpired:
                      code = 124
              results.append(dict(name=name, code=code))
              print(f'{name}: {code}', flush=True)
              if code:
                  print(log.read_text(encoding='utf-8', errors='replace')[-6000:], flush=True)
          (output / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
          raise SystemExit(any(row['code'] for row in results))
          '@ | & env/Scripts/python.exe -B -
          exit $LASTEXITCODE
      - name: Native repair evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-repair-windows
          path: temp/audit/native-repair
