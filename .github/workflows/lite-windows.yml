name: Lite Windows and Ubuntu

on:
  workflow_dispatch:
  push:
    paths:
      - 'LITE-MODE/**'
      - '!LITE-MODE/*.md'
      - '!LITE-MODE/evidence/**'
      - '!LITE-MODE/UBUNTU'
      - '!LITE-MODE/WINDOWS.exe'
      - '!LITE-MODE/assets/preview*.png'
      - '.github/workflows/lite-windows.yml'

permissions:
  contents: read

concurrency:
  group: lite-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      LITE_VERIFY_NATIVE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Private fixture runtime
        shell: pwsh
        run: |
          python -m venv LITE-MODE/.venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & LITE-MODE/.venv/Scripts/python.exe -m pip install -r LITE-MODE/requirements.txt
          exit $LASTEXITCODE
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set stable
          exit $LASTEXITCODE
      - uses: actions/cache@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            LITE-MODE/target
          key: lite-windows-${{ hashFiles('LITE-MODE/Cargo.lock') }}
      - name: Windows widget input and layout matrix
        shell: pwsh
        run: |
          cargo test --locked --manifest-path LITE-MODE/Cargo.toml -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path LITE-MODE/Cargo.toml --all-targets -j 4 -- -D warnings
          exit $LASTEXITCODE
      - name: Real Windows Developer Access helper at display scales
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.25', '1.5', '1.75', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            & LITE-MODE/.venv/Scripts/python.exe -B LITE-MODE/tools/verify_developer.py --render-dir "LITE-MODE/temp/windows-native/$scale"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Actual Windows Rust renderer on synthetic small desktops
        shell: pwsh
        run: |
          & LITE-MODE/.venv/Scripts/python.exe -B LITE-MODE/tools/verify_layout.py --native --executable LITE-MODE/WINDOWS.exe --render-dir LITE-MODE/temp/windows-renderer
          exit $LASTEXITCODE
      - name: History, search, preparation and worker isolation
        if: always()
        shell: pwsh
        run: |
          $failures = @()
          foreach ($verifier in @('verify', 'verify_history_search', 'verify_preparation')) {
            & LITE-MODE/.venv/Scripts/python.exe -B "LITE-MODE/tools/$verifier.py"
            if ($LASTEXITCODE -ne 0) { $failures += $verifier }
          }
          if ($failures.Count -gt 0) { throw "Failed Lite checks: $($failures -join ', ')" }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lite-windows-native-python-${{ matrix.python }}
          path: |
            LITE-MODE/temp/windows-native
            LITE-MODE/temp/windows-renderer
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            LITE-MODE/target
          key: lite-windows-${{ hashFiles('LITE-MODE/Cargo.lock') }}

  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-26.04
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Private fixture runtime and virtual display
        run: |
          python -m venv LITE-MODE/.venv
          LITE-MODE/.venv/bin/python -m pip install -r LITE-MODE/requirements.txt
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup override set stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            LITE-MODE/target
          key: lite-${{ matrix.os }}-${{ hashFiles('LITE-MODE/Cargo.lock') }}
      - name: Layout, streaming, focus policy and strict Rust checks
        run: |
          cargo check --locked --manifest-path LITE-MODE/Cargo.toml -j 4
          cargo test --locked --manifest-path LITE-MODE/Cargo.toml -j 4
          cargo clippy --locked --manifest-path LITE-MODE/Cargo.toml --all-targets -j 4 -- -D warnings
      - name: Actual Ubuntu Rust renderer on an owned display
        run: LITE-MODE/.venv/bin/python -B LITE-MODE/tools/verify_layout.py --executable LITE-MODE/UBUNTU --render-dir LITE-MODE/temp/ubuntu-renderer
      - name: Worker, cancellation, history and real portal fixtures
        run: |
          for verifier in verify verify_history_search verify_preparation verify_developer; do
            env -u DISPLAY -u WAYLAND_DISPLAY LITE-MODE/.venv/bin/python -B "LITE-MODE/tools/$verifier.py"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lite-${{ matrix.os }}-renderer
          path: LITE-MODE/temp/ubuntu-renderer
          if-no-files-found: warn
