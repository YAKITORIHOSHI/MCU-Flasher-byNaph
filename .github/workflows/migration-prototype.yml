name: Rust migration compatibility prototype

on:
  push:
    paths: ['desktop/**', 'main/core/**', 'main/__init__.py', 'src/editor/**', 'src/assets/**', 'src/fonts/**', 'direct/verify_editor_review_ui.py', '.github/workflows/migration-prototype.yml']
  pull_request:
    paths: ['desktop/**', 'main/core/**', 'main/__init__.py', 'src/editor/**', 'src/assets/**', 'src/fonts/**', 'direct/verify_editor_review_ui.py', '.github/workflows/migration-prototype.yml']
  workflow_dispatch:
    inputs:
      windows_only:
        description: Limit native or backend jobs to Windows
        type: boolean
        default: false
      backend_only:
        description: Run Rust backend fixtures without GUI or editor setup
        type: boolean
        default: false
      platform_contracts_only:
        description: Run new Ubuntu 26 backend and macOS/Windows ARM core contracts only
        type: boolean
        default: false
      native_with_platform_contracts:
        description: Run native GUI and new platform contracts without Python editor checks
        type: boolean
        default: false
      launcher_executables:
        description: Build and verify the native LAUNCHER executables
        type: boolean
        default: false
      browser_performance_only:
        description: Run isolated current-app browser and resource checks only
        type: boolean
        default: false
      browser_regressions_only:
        description: Skip Windows native rendering already verified at the same product source
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migration-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher-executables:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.launcher_executables }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build matching native launcher entries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp/audit/launcher-executables
          python -B direct/build_launcher_folder.py 2>&1 | tee temp/audit/launcher-executables/build.log
      - name: Verify literal arguments and moved-folder dispatch without startup
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'psutil>=5.9,<8'
          python -B direct/verify_launcher_folder.py --native-only 2>&1 | tee temp/audit/launcher-executables/verify.log
      - name: Retain native binaries and verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: launcher-executables-${{ matrix.os }}
          path: |
            LAUNCHER/UBUNTU
            LAUNCHER/UBUNTU_ARM64
            LAUNCHER/FEDORA
            LAUNCHER/FEDORA_ARM64
            LAUNCHER/LINUX_MINT
            LAUNCHER/WINDOWS.exe
            temp/audit/launcher-executables/
          if-no-files-found: warn

  browser-performance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_performance_only }}
    uses: ./.github/workflows/browser-performance.yml
    with:
      windows_only: ${{ inputs.windows_only }}
      regressions_only: ${{ inputs.browser_regressions_only }}

  native-prototype:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.browser_performance_only && (inputs.native_with_platform_contracts || (!inputs.backend_only && !inputs.platform_contracts_only))) }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.windows_only && '["windows-2022"]' || '["ubuntu-24.04","ubuntu-24.04-arm","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '4'
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Native process reference dependency
        run: python -m pip install 'psutil>=5.9,<8'
      - name: Prepare pinned Rust and frontend tools
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          npm install --global pnpm@11.25.0
      - name: Ubuntu webview development prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev xvfb dbus-x11 fonts-dejavu-core
      - name: Parse Windows launcher and verification scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('desktop/scripts/run-prototype.ps1', 'desktop/scripts/verify-local.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Reuse assets and validate frontend
        shell: bash
        run: |
          pnpm --dir desktop/ui install --frozen-lockfile
          pnpm --dir desktop/ui test
          pnpm --dir desktop/ui build
          python -B -W error desktop/scripts/verify-asset-provenance.py
      - name: Rust contracts, project services and native build
        shell: bash
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
          cargo test --manifest-path desktop/Cargo.toml --locked
          cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo build --manifest-path desktop/Cargo.toml --locked -p mcu-host --bins
          cargo build --manifest-path desktop/Cargo.toml --locked -p mcu-desktop-prototype
      - name: Native PTY lifecycle probe
        timeout-minutes: 2
        shell: bash
        run: cargo run --manifest-path desktop/Cargo.toml --locked -p mcu-host --bin pty_probe
      - name: Fixed native compile-process ownership fixture
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/migration/logs
          cargo run --quiet --manifest-path desktop/Cargo.toml --locked -p mcu-host --bin compile_process_probe -- --self-check | tee audit/migration/logs/compile-process.json
      - name: Differential legacy behavior fixtures
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/migration/logs
          python -B -W error desktop/scripts/verify-serial-codec.py
          python -B -W error desktop/scripts/verify-serial-send.py | tee audit/migration/logs/serial-send.json
          python -B -W error desktop/scripts/verify-preferences-merge.py
          python -B -W error desktop/scripts/verify-scaffold.py
          python -B -W error desktop/scripts/verify-resource-budget.py
          python -B -W error desktop/scripts/verify-lock-interop.py
          python -B -W error desktop/scripts/verify-target-transport.py
          python -B -W error desktop/scripts/verify-board-recipe.py | tee audit/migration/logs/board-recipe-rust.json
          python -B -W error desktop/scripts/verify-board-compatibility.py | tee audit/migration/logs/board-compatibility-rust.json
          python -B -W error desktop/scripts/verify-recipe-generation.py | tee audit/migration/logs/recipe-generation-rust.json
          python -I -S -B -W error desktop/scripts/verify-tool-only-entry.py
          python -B -W error desktop/scripts/verify-ownership.py
          python -B -W error desktop/scripts/verify-process-identity.py
          python -B -W error desktop/scripts/verify-file-identity.py | tee audit/migration/logs/file-identity.json
          python -B -W error desktop/scripts/verify-registry.py
      - name: Native widget protocol checks (portable)
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/migration/logs audit/migration/scratch
          cargo test --manifest-path desktop/Cargo.toml --locked -p mcu-native-ui-probe 2>&1 | tee audit/migration/logs/native-ui-protocol.log
          python -B -W error direct/verify_platformio_board_compat.py 2>&1 | tee audit/migration/logs/board-recipe-compat.log
      - name: Native Ubuntu widget controller lifecycle and path checks
        if: runner.os == 'Linux'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python -B -W error desktop/native-ui/verify-cleanup.py 2>&1 | tee audit/migration/logs/native-ui-cleanup.log
          python -B -W error desktop/native-ui/verify-paths.py 2>&1 | tee audit/migration/logs/native-ui-paths.log
          python -B -W error direct/verify_board_compile_campaign.py 2>&1 | tee audit/migration/logs/board-campaign-guards.log
      - name: Native Ubuntu Rust widget and embedded editor verification
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          __GLX_VENDOR_LIBRARY_NAME: mesa
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path desktop/Cargo.toml --locked -p mcu-native-ui-probe
          xvfb-run -a python -B -W error desktop/native-ui/verify-smoke.py --current-display
          xvfb-run -a python -B -W error desktop/native-ui/verify-smoke.py --current-display --workspace
          xvfb-run -a cargo test --manifest-path desktop/Cargo.toml --locked -p mcu-native-ui-probe wide_source_manifest_keeps_native_window_bounded_and_all_tabs -- --ignored
      - name: Native Ubuntu Save and Save All verification
        if: runner.os == 'Linux'
        timeout-minutes: 2
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          __GLX_VENDOR_LIBRARY_NAME: mesa
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        shell: bash
        run: xvfb-run -a python -B -W error desktop/native-ui/verify-smoke.py --current-display --save
      - name: Native Ubuntu webview/editor/PTY verification
        if: runner.os == 'Linux'
        timeout-minutes: 2
        env:
          GDK_BACKEND: x11
        run: |
          xvfb-run -a dbus-run-session -- desktop/target/debug/mcu-desktop-prototype --verify-prototype
      - name: Native Windows webview/editor/PTY verification
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          & desktop/target/debug/mcu-desktop-prototype.exe --verify-prototype
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows Rust controls and embedded editor verification
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          cargo build --manifest-path desktop/Cargo.toml --locked -p mcu-native-ui-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $capture = @(& desktop/target/debug/mcu-native-ui-probe.exe --smoke 2>&1)
          $nativeExit = $LASTEXITCODE
          $capture | Set-Content -Encoding utf8 audit/migration/logs/native-ui-windows-output.log
          $receipts = @($capture | Where-Object { "$_".StartsWith('MCU_NATIVE_PROBE=') })
          if ($receipts.Count -ne 1) { throw 'Expected one native Win32 fixture receipt.' }
          $receipt = "$($receipts[0])".Substring('MCU_NATIVE_PROBE='.Length) | ConvertFrom-Json
          $receipt | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 audit/migration/logs/native-ui-windows.json
          if ($nativeExit -ne 0 -or !$receipt.passed -or $receipt.displayBackend -ne 'Win32') { throw 'Native Win32 widget fixture failed.' }
          if (@($receipt.checks.PSObject.Properties).Count -ne 17 -or @($receipt.checks.PSObject.Properties | Where-Object { !$_.Value }).Count) { throw 'Incomplete native Win32 checks.' }
          $workspaceCapture = @(& desktop/target/debug/mcu-native-ui-probe.exe --workspace-smoke 2>&1)
          $workspaceExit = $LASTEXITCODE
          $workspaceCapture | Set-Content -Encoding utf8 audit/migration/logs/native-workspace-windows-output.log
          $workspaceReceipts = @($workspaceCapture | Where-Object { "$_".StartsWith('MCU_NATIVE_WORKSPACE=') })
          if ($workspaceReceipts.Count -ne 1) { throw 'Expected one native Win32 workspace receipt.' }
          $workspace = "$($workspaceReceipts[0])".Substring('MCU_NATIVE_WORKSPACE='.Length) | ConvertFrom-Json
          $workspace | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 audit/migration/logs/native-workspace-windows.json
          $required = @('undo_redo', 'native_tools', 'native_source_tabs', 'native_project_session', 'native_owned_source_controls', 'no_python_application_service', 'source_bytes_unchanged')
          foreach ($phase in 0..3) {
            foreach ($kind in @('models', 'dirty_selection', 'theme')) { $required += "phase_${phase}_${kind}" }
          }
          if ($workspaceExit -ne 0 -or !$workspace.passed) { throw 'Native Win32 workspace fixture failed.' }
          if (@($workspace.checks.PSObject.Properties).Count -ne 19) { throw 'Incomplete native Win32 workspace checks.' }
          foreach ($name in $required) {
            if ($workspace.checks.$name -ne $true) { throw "Missing native Win32 workspace check: $name" }
          }
      - name: Native Windows Save and Save All verification
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $capture = @(& desktop/target/debug/mcu-native-ui-probe.exe --save-smoke 2>&1)
          $nativeExit = $LASTEXITCODE
          $capture | Set-Content -Encoding utf8 audit/migration/logs/native-save-windows-output.log
          $receipts = @($capture | Where-Object { "$_".StartsWith('MCU_NATIVE_SAVE=') })
          if ($receipts.Count -ne 1) { throw 'Expected one native Win32 Save receipt.' }
          $receipt = "$($receipts[0])".Substring('MCU_NATIVE_SAVE='.Length) | ConvertFrom-Json
          $receipt | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 audit/migration/logs/native-save-windows.json
          if ($nativeExit -ne 0 -or $receipt.passed -isnot [bool] -or !$receipt.passed) { throw 'Native Win32 Save fixture failed.' }
          $required = @('native_save', 'native_save_all', 'late_edit_retained', 'external_change_refused', 'same_models', 'undo_redo_retained', 'selection_retained', 'disk_bytes_verified', 'no_python_application_service')
          foreach ($name in $required) {
            if ($receipt.checks.$name -isnot [bool] -or !$receipt.checks.$name) { throw "Missing native Win32 Save check: $name" }
          }
          if (@($receipt.checks.PSObject.Properties | Where-Object { $_.Value -isnot [bool] -or !$_.Value }).Count) { throw 'Native Win32 Save contains failed checks.' }
      - name: Collect native fixture evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: migration-prototype-${{ matrix.os }}
          path: |
            audit/migration/native-webview.json
            audit/migration/logs/file-identity.json
            audit/migration/logs/serial-send.json
            audit/migration/logs/native-ui-protocol.log
            audit/migration/logs/native-ui-cleanup.log
            audit/migration/logs/native-ui-paths.log
            audit/migration/logs/board-campaign-guards.log
            audit/migration/logs/board-recipe-compat.log
            audit/migration/logs/board-recipe-rust.json
            audit/migration/logs/board-compatibility-rust.json
            audit/migration/logs/recipe-generation-rust.json
            temp/audit/native-compile-inputs/tool-only-entry.json
            audit/migration/logs/compile-process.json
            audit/migration/logs/native-ui-windows.json
            audit/migration/logs/native-ui-windows-output.log
            audit/migration/logs/native-workspace-windows.json
            audit/migration/logs/native-workspace-windows-output.log
            audit/migration/logs/native-save-windows.json
            audit/migration/logs/native-save-windows-output.log
            audit/migration/scratch/native-ui/latest-smoke.json
            audit/migration/scratch/native-ui/latest-output.log
            audit/migration/scratch/native-workspace/latest-smoke.json
            audit/migration/scratch/native-workspace/latest-output.log
            audit/migration/scratch/native-save/latest-smoke.json
            audit/migration/scratch/native-save/latest-output.log
            desktop/ui/public/vendor/manifest.json
          if-no-files-found: warn

  editor-review:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.windows_only && !inputs.backend_only && !inputs.platform_contracts_only && !inputs.native_with_platform_contracts && !inputs.browser_performance_only) }}
    name: Windows editor review (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            qt: 'PySide6>=6.7,<6.12'
          - python: '3.14'
            qt: 'PySide6>=6.12,<7'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: windows
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Private reference runtime
        shell: pwsh
        run: |
          python -m venv env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -m pip install '${{ matrix.qt }}' 'psutil>=5.9,<8' 'requests>=2.31,<3' 'pyserial>=3.5,<4' 'platformio>=6.1,<7' websockets pywinpty
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native editor focus and compact viewport at both scales
        shell: pwsh
        run: |
          foreach ($scale in @('1', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            & env/Scripts/python.exe -B -W error direct/verify_editor_review_ui.py --render-dir "audit/migration/captures/editor-review-$scale"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Focus and viewport captures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: editor-review-windows-python-${{ matrix.python }}
          path: audit/migration/captures/editor-review-*
          if-no-files-found: warn

# These jobs prove only the fixture prototype on their exact runners. Windows
# Server is not Windows 10/11 desktop qualification; no job opens serial ports,
# uploads firmware, mutates cloud records, or replaces the Python release.
# Native widget execution covers Linux GTK and Windows Win32/WebView2 fixture
# adapters. Hosted Windows Server still does not qualify Windows 10/11 desktops,
# physical input/IME, mixed-monitor behavior or complete application parity.

  backend-fixtures:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.backend_only || inputs.platform_contracts_only || inputs.native_with_platform_contracts) && !inputs.browser_performance_only }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_only && '["windows-2022"]' || (inputs.platform_contracts_only || inputs.native_with_platform_contracts) && '["ubuntu-26.04","ubuntu-26.04-arm"]' || '["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '4'
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare pinned Rust
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Record actual backend host and compiler
        shell: bash
        env:
          MCU_RUNNER_LABEL: ${{ matrix.os }}
          MCU_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          mkdir -p audit/migration/logs
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          compiler = subprocess.check_output(["rustc", "-vV"], text=True)
          target = next(line.removeprefix("host: ") for line in compiler.splitlines() if line.startswith("host: "))
          expected_arch = {"X64": "x86_64", "ARM64": "aarch64"}[os.environ["MCU_RUNNER_ARCH"]]
          expected_os = "windows" if platform.system() == "Windows" else "linux"
          release = platform.freedesktop_os_release() if platform.system() == "Linux" else {}
          receipt = {"scope": "native Rust backend fixtures; no GUI or device qualification", "source": os.environ["GITHUB_SHA"],
                     "runnerLabel": os.environ["MCU_RUNNER_LABEL"], "runnerArchitecture": os.environ["MCU_RUNNER_ARCH"],
                     "system": platform.system(), "systemRelease": platform.release(), "machine": platform.machine(),
                     "osRelease": release, "rustcHost": target, "rustc": compiler}
          Path("audit/migration/logs/backend-host.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(receipt))
          assert target.startswith(expected_arch + "-") and expected_os in target, (target, expected_arch, expected_os)
          if os.environ["MCU_RUNNER_LABEL"].startswith("ubuntu-"):
              assert release.get("ID") == "ubuntu", release
              assert release.get("VERSION_ID") == os.environ["MCU_RUNNER_LABEL"].removeprefix("ubuntu-").removesuffix("-arm"), release
          PY
      - name: Rust backend units and strict checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/migration/logs
          cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
          cargo test --manifest-path desktop/Cargo.toml --locked 2>&1 | tee audit/migration/logs/backend-unit.log
          cargo clippy --manifest-path desktop/Cargo.toml --locked -p mcu-contracts -p mcu-core -p mcu-host --all-targets -- -D warnings
          cargo build --manifest-path desktop/Cargo.toml --locked -p mcu-host --bin board_recipe_probe --bin board_compatibility_probe --bin recipe_generation_probe --bin compile_process_probe
      - name: Fixed native compile-process ownership fixture
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path desktop/Cargo.toml --locked -p mcu-host --bin compile_process_probe -- --self-check | tee audit/migration/logs/compile-process.json
      - name: Exact compatibility policy and descriptor fixtures
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python -B -W error desktop/scripts/verify-board-recipe.py | tee audit/migration/logs/board-recipe-rust.json
          python -B -W error desktop/scripts/verify-board-compatibility.py | tee audit/migration/logs/board-compatibility-rust.json
          python -B -W error desktop/scripts/verify-recipe-generation.py | tee audit/migration/logs/recipe-generation-rust.json
          python -I -S -B -W error desktop/scripts/verify-tool-only-entry.py
      - name: Collect compact backend receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: migration-backend-${{ matrix.os }}
          path: |
            audit/migration/logs/backend-unit.log
            audit/migration/logs/backend-host.json
            audit/migration/logs/board-recipe-rust.json
            audit/migration/logs/board-compatibility-rust.json
            audit/migration/logs/recipe-generation-rust.json
            temp/audit/native-compile-inputs/tool-only-entry.json
            audit/migration/logs/compile-process.json
          if-no-files-found: warn

  portable-core-contracts:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.backend_only || inputs.platform_contracts_only || inputs.native_with_platform_contracts) && !inputs.browser_performance_only }}
    name: Native core contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc","python_arch":"arm64","runner_arch":"ARM64"}]' || '[{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc","python_arch":"arm64","runner_arch":"ARM64"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","python_arch":"x64","runner_arch":"X64"},{"os":"macos-15","target":"aarch64-apple-darwin","python_arch":"arm64","runner_arch":"ARM64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '4'
      RUSTUP_TOOLCHAIN: 1.99.1-${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: ${{ matrix.python_arch }}
      - name: Prepare native pinned Rust
        shell: bash
        run: rustup toolchain install '1.99.1-${{ matrix.target }}' --profile minimal --component clippy --no-self-update
      - name: Require the native host and retain its scope
        shell: bash
        env:
          MCU_EXPECTED_TARGET: ${{ matrix.target }}
          MCU_RUNNER_LABEL: ${{ matrix.os }}
          MCU_RUNNER_ARCH: ${{ runner.arch }}
          MCU_EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: |
          set -euo pipefail
          mkdir -p audit/migration/logs
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          compiler = subprocess.check_output(["rustc", "-vV"], text=True)
          target = next(line.removeprefix("host: ") for line in compiler.splitlines() if line.startswith("host: "))
          receipt = {"scope": "native mcu-contracts/mcu-core execution only; no host adapters, GUI, tool runtimes or devices",
                     "source": os.environ["GITHUB_SHA"], "runnerLabel": os.environ["MCU_RUNNER_LABEL"],
                     "runnerArchitecture": os.environ["MCU_RUNNER_ARCH"], "system": platform.system(),
                     "systemRelease": platform.release(), "systemVersion": platform.version(), "machine": platform.machine(),
                     "macVersion": platform.mac_ver()[0], "rustcHost": target, "rustc": compiler}
          Path("audit/migration/logs/portable-core-host.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(receipt))
          assert target == os.environ["MCU_EXPECTED_TARGET"], target
          assert platform.system() == ("Darwin" if target.endswith("-apple-darwin") else "Windows"), platform.system()
          assert os.environ["MCU_RUNNER_ARCH"] == os.environ["MCU_EXPECTED_RUNNER_ARCH"], os.environ["MCU_RUNNER_ARCH"]
          expected_machine = {"ARM64": {"arm64", "aarch64"}, "X64": {"x86_64", "amd64"}}[os.environ["MCU_RUNNER_ARCH"]]
          assert platform.machine().lower() in expected_machine, platform.machine()
          PY
      - name: Execute portable contracts and project core natively
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path desktop/Cargo.toml --locked -p mcu-contracts -p mcu-core 2>&1 | tee audit/migration/logs/portable-core-unit.log
          cargo clippy --manifest-path desktop/Cargo.toml --locked -p mcu-contracts -p mcu-core --all-targets -- -D warnings 2>&1 | tee audit/migration/logs/portable-core-clippy.log
      - name: Collect scoped native contract evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: migration-portable-core-${{ matrix.os }}
          path: |
            audit/migration/logs/portable-core-host.json
            audit/migration/logs/portable-core-unit.log
            audit/migration/logs/portable-core-clippy.log
          if-no-files-found: warn

# Portable core execution intentionally excludes mcu-host on these three hosts.
# Darwin has no native retained-identity/process implementation; the AVR archive
# preparer refuses Darwin and Windows ARM64. A passing core job does not qualify
# those missing services, native application startup, GUI, packaging or USB.
