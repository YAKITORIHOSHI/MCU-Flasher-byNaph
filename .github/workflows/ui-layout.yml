name: Native UI layouts

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run only the two Windows display-layout jobs
        type: boolean
        default: false
      wayland_only:
        description: Run only native Wayland window alignment checks
        type: boolean
        default: false
      layout_group:
        description: UI surfaces to verify
        type: choice
        options: [all, responsive, edgecases, alignment, workspace, resources, auxiliary, portal]
        default: all

permissions:
  contents: read

jobs:
  render:
    if: '!inputs.wayland_only'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.windows_only && '{"include":[{"os":"windows-latest","python":"3.11","qt":"PySide6>=6.7,<6.12"},{"os":"windows-latest","python":"3.14","qt":"PySide6>=6.12,<7"}]}' || '{"include":[{"os":"windows-latest","python":"3.11","qt":"PySide6>=6.7,<6.12"},{"os":"windows-latest","python":"3.14","qt":"PySide6>=6.12,<7"},{"os":"ubuntu-24.04","python":"3.12","qt":"PySide6>=6.12,<7"},{"os":"ubuntu-26.04","python":"3.14","qt":"PySide6>=6.12,<7"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONFAULTHANDLER: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Private Windows fixture runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & env/Scripts/python.exe -m pip install '${{ matrix.qt }}' 'psutil>=5.9,<8' 'requests>=2.31,<3' 'pyserial>=3.5,<4' 'platformio>=6.1,<7' websockets pywinpty
          exit $LASTEXITCODE
      - name: Private Ubuntu fixture runtime
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv-linux
          .venv-linux/bin/python -m pip install '${{ matrix.qt }}' 'psutil>=5.9,<8' 'requests>=2.31,<3' 'pyserial>=3.5,<4' 'platformio>=6.1,<7' websockets
      - name: Native Ubuntu display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libegl1 libgl1 libnss3 libnspr4 libgbm1 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxext6 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxrender1 libxtst6 libxkbfile1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-randr0 libxcb-sync1 libxcb-shm0 libxcb-xfixes0 libxcb-render0 libxcb-util1 libxcb-dri3-0
          read -r -a qt_runtime_packages <<< "$(python -c 'from direct.ubuntu.preflight import normalize_packages; print(" ".join(normalize_packages(["libasound2", "libglib2.0-0"])))')"
          sudo apt-get install -y "${qt_runtime_packages[@]}"
      - name: Windows screens, validation states and display scales
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: env/Scripts/python.exe -B direct/verify_ui_layout.py --render-dir temp/audit/layout-native --group '${{ inputs.layout_group || 'all' }}'
      - name: Ubuntu screens, validation states and display scales
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s '-screen 0 1920x1080x24' .venv-linux/bin/python -B direct/verify_ui_layout.py --render-dir temp/audit/layout-native --group '${{ inputs.layout_group || 'all' }}'
      - name: Native screen captures and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: layouts-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            temp/audit/layout-native
            temp/audit/package-coverage/*.png
            temp/audit/terminal/*.png
            temp/audit/terminal/protocol-report.json
          if-no-files-found: warn

  wayland-alignment:
    # Xcb has no client-side horizontal frame on the hosted display. Keep this
    # native Wayland contract separate, and fail if its required frame is absent.
    if: github.event_name == 'workflow_dispatch' && (inputs.layout_group == 'alignment' || inputs.wayland_only) && !inputs.windows_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-26.04
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONFAULTHANDLER: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Private Ubuntu fixture runtime
        run: |
          python -m venv .venv-linux
          .venv-linux/bin/python -m pip install 'PySide6>=6.12,<7' 'psutil>=5.9,<8' 'requests>=2.31,<3' 'pyserial>=3.5,<4' 'platformio>=6.1,<7' websockets
      - name: Native Wayland display dependencies
        timeout-minutes: 7
        run: |
          set -o pipefail
          fixture="$PWD/temp/audit/window-alignment-wayland"
          mkdir -p "$fixture"
          . /etc/os-release
          case "$VERSION_CODENAME" in noble|resolute) ;; *) exit 1 ;; esac
          # The hosted Azure HTTP mirror delivered this dependency closure at
          # roughly 40 KiB/s. Use Ubuntu's signed HTTPS archives for this fixture
          # only; do not rewrite the runner's configured repositories.
          cat > "$fixture/ubuntu.sources" <<EOF
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: $VERSION_CODENAME-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          apt_options=(-o "Dir::Etc::sourcelist=$fixture/ubuntu.sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
          exec > >(tee "$fixture/dependencies.log") 2>&1
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y --no-install-recommends weston python3-tk libegl1 libgl1 libnss3 libnspr4 libgbm1 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxext6 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxrender1 libxtst6 libxkbfile1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-randr0 libxcb-sync1 libxcb-shm0 libxcb-xfixes0 libxcb-render0 libxcb-util1 libxcb-dri3-0 libwayland-client0 libwayland-cursor0 libwayland-egl1
          read -r -a qt_runtime_packages <<< "$(python -c 'from direct.ubuntu.preflight import normalize_packages; print(" ".join(normalize_packages(["libasound2", "libglib2.0-0"])))')"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y --no-install-recommends "${qt_runtime_packages[@]}"
      - name: Native Wayland frames at five fresh display scales
        run: |
          .venv-linux/bin/python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import tempfile
          import time

          output = Path('temp/audit/window-alignment-wayland').resolve()
          output.mkdir(parents=True, exist_ok=True)
          results = []
          failed = False

          def interrupted(signum, _frame):
              raise RuntimeError(f'Native display fixture interrupted by signal {signum}')

          signal.signal(signal.SIGTERM, interrupted)

          with tempfile.TemporaryDirectory(prefix='weston-runtime-', dir=output) as runtime:
              os.chmod(runtime, 0o700)
              environment = os.environ.copy()
              environment.update(XDG_RUNTIME_DIR=runtime, WAYLAND_DISPLAY='mcu-alignment',
                                 QT_QPA_PLATFORM='wayland')
              # No inherited desktop, Xwayland fallback or disabled CSD can turn
              # this fixture into a zero-margin pass on a different Qt platform.
              for name in ('DISPLAY', 'WAYLAND_SOCKET', 'QT_WAYLAND_DISABLE_WINDOWDECORATION',
                           'QT_WAYLAND_DECORATION', 'QT_SCALE_FACTOR'):
                  environment.pop(name, None)
              command = ['weston', '--backend=headless-backend.so', '--renderer=pixman',
                         '--width=1920', '--height=1080', '--socket=mcu-alignment',
                         '--idle-time=0', '--no-config', f'--log={output / "weston.log"}']
              (output / 'weston-command.json').write_text(json.dumps(command, indent=2) + '\n')
              with (output / 'weston-launch.log').open('w', encoding='utf-8') as log:
                  weston = subprocess.Popen(command, env=environment, stdout=log,
                                            stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      deadline = time.monotonic() + 20
                      socket = Path(runtime) / environment['WAYLAND_DISPLAY']
                      while not socket.is_socket():
                          # WNOWAIT reserves the owned leader PID until group
                          # teardown, including a compositor startup failure.
                          state = os.waitid(os.P_PID, weston.pid,
                                            os.WEXITED | os.WNOHANG | os.WNOWAIT)
                          if state is not None or time.monotonic() >= deadline:
                              raise RuntimeError('Owned Weston did not expose its Wayland socket within 20 seconds')
                          time.sleep(.1)
                      for scale in ('1', '1.25', '1.5', '1.75', '2'):
                          capture = output / ('scale-' + scale.replace('.', '_'))
                          capture.mkdir()
                          child_env = dict(environment, QT_SCALE_FACTOR=scale)
                          started = time.monotonic()
                          invocation = [sys.executable, '-B', 'direct/verify_window_alignment.py',
                                        '--render-dir', str(capture), '--require-wayland',
                                        '--require-horizontal-frame']
                          with (capture / 'stdout.log').open('w', encoding='utf-8') as child_log:
                              child = subprocess.Popen(invocation, env=child_env, stdout=child_log,
                                                       stderr=subprocess.STDOUT, start_new_session=True)
                              try:
                                  code = child.wait(timeout=120)
                              except subprocess.TimeoutExpired:
                                  code = 124
                              finally:
                                  # Kill only this fresh fixture's owned session
                                  # before reaping its leader and releasing the PID.
                                  if child.returncode is None:
                                      os.killpg(child.pid, signal.SIGKILL)
                                      child.wait(timeout=5)
                          result = dict(scale=scale, returncode=code,
                                        elapsed_seconds=round(time.monotonic() - started, 3))
                          results.append(result)
                          print(json.dumps(result), flush=True)
                          if code:
                              failed = True
                              print((capture / 'stdout.log').read_text(encoding='utf-8')[-16000:], flush=True)
                  except Exception as error:
                      failed = True
                      results.append(dict(controller_error=str(error)))
                      print(f'Wayland fixture failed: {error}', flush=True)
                  finally:
                      # The leader has not been polled/reaped, so this process
                      # group remains pinned to the owned compositor session.
                      for sig in (signal.SIGTERM, signal.SIGKILL):
                          try:
                              os.killpg(weston.pid, sig)
                          except ProcessLookupError:
                              pass
                          if sig == signal.SIGTERM:
                              time.sleep(.5)
                      weston.wait(timeout=5)

          (output / 'results.json').write_text(json.dumps(results, indent=2) + '\n', encoding='utf-8')
          raise SystemExit(1 if failed else 0)
          PY
      - name: Native Wayland screen captures and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: window-alignment-wayland-${{ matrix.os }}-python-${{ matrix.python }}
          path: temp/audit/window-alignment-wayland
          if-no-files-found: warn
