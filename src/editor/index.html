<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>MCU Flasher — Embedded Code Editor</title>
  <style>
    @font-face {
      font-family: 'Montserrat';
      src: url('../fonts/Montserrat/static/Montserrat-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Montserrat';
      src: url('../fonts/Montserrat/static/Montserrat-Italic.ttf') format('truetype');
      font-weight: 400;
      font-style: italic;
    }
    @font-face {
      font-family: 'Montserrat';
      src: url('../fonts/Montserrat/static/Montserrat-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Montserrat';
      src: url('../fonts/Montserrat/static/Montserrat-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Montserrat';
      src: url('../fonts/Montserrat/static/Montserrat-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    :root, body.theme-default {
      --bg-darkest: #151922;
      --bg-dark: #0f121a;
      --bg-tab-hover: #171c28;
      --border: #222938;
      --border-tab: #1c212e;
      --text: #e0e6ed;
      --text-dim: #7f8c8d;
      --accent: #00d2ff;
      --dirty-dot: #ff9f00;
      --hover-bg: #161d27;
      --hover-code-bg: #0f121a;
      --hover-border: #2a3545;
      --hover-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      --hover-kind: #00d2ff;
      --hover-proto: #5ccc6e;
      --hover-type: #e5c07b;
      --hover-param: #98c379;
      --hover-link: #00d2ff;
    }

    body.theme-light {
      --bg-darkest: #ffffff;
      --bg-dark: #f0f2f5;
      --bg-tab-hover: #e4e7eb;
      --border: #d0d7de;
      --border-tab: #d8dee4;
      --text: #24292f;
      --text-dim: #57606a;
      --accent: #0969da;
      --dirty-dot: #bc4c00;
      --hover-bg: #ffffff;
      --hover-code-bg: #f6f8fa;
      --hover-border: #d0d7de;
      --hover-shadow: 0 10px 28px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);
      --hover-kind: #0969da;
      --hover-proto: #116329;
      --hover-type: #953800;
      --hover-param: #0550ae;
      --hover-link: #0969da;
    }

    body.theme-solarized-dark {
      --bg-darkest: #002b36;
      --bg-dark: #00212b;
      --bg-tab-hover: #073642;
      --border: #073642;
      --border-tab: #094250;
      --text: #ffffff;
      --text-dim: #8fa1b3;
      --accent: #39c5bb;
      --dirty-dot: #b58900;
      --hover-bg: #002b36;
      --hover-code-bg: #00212b;
      --hover-border: #094250;
      --hover-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
      --hover-kind: #39c5bb;
      --hover-proto: #859900;
      --hover-type: #b58900;
      --hover-param: #2aa198;
      --hover-link: #268bd2;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-darkest);
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #tab-bar {
      display: flex;
      align-items: center;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
      height: 35px;
      box-sizing: border-box;
    }

    #detached-action-bar {
      display: none;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 5px 8px;
      box-sizing: border-box;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    #detached-action-bar.visible {
      display: flex;
    }

    #detached-action-bar .toolbar-label {
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 700;
      margin-right: 3px;
    }

    #detached-action-bar .toolbar-divider {
      width: 2px;
      height: 22px;
      margin: 0 5px;
      flex: 0 0 auto;
      background: var(--border);
    }

    #detached-action-bar button {
      color: #f4f7fb;
      border: 0;
      padding: 5px 10px;
      font: 600 11px 'Montserrat', 'Segoe UI', sans-serif;
      cursor: pointer;
    }

    #detached-action-bar button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      pointer-events: none;
      filter: grayscale(0.5);
    }

    #detached-action-bar button:hover {
      filter: brightness(1.18);
    }

    #detached-action-bar .compile {
      background: #2d7d46;
    }

    #detached-action-bar .upload {
      background: #2077b0;
    }

    #detached-action-bar .stop {
      background: #a03030;
    }

    #detached-action-bar .clean,
    #detached-action-bar .reload {
      background: #3a4555;
    }

    #detached-action-bar .save {
      background: #2d7d46;
    }

    #detached-action-bar .save-all {
      background: #8244a0;
    }

    #detached-action-bar .modify {
      background: #1a7a70;
    }

    #tab-bar::-webkit-scrollbar {
      height: 6px;
    }

    #tab-bar::-webkit-scrollbar-track {
      background: var(--bg-darkest);
    }

    #tab-bar::-webkit-scrollbar-thumb {
      background: #3e4f6d;
      border-radius: 3px;
    }

    #tab-bar::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    /* High-visibility scrollbars for webview & editor */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #0b0e14;
      border-left: 1px solid #1c2333;
    }

    ::-webkit-scrollbar-thumb {
      background: #3e4f6d;
      border-radius: 6px;
      border: 2px solid #0b0e14;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #56cfbf;
    }

    .monaco-editor .scrollbar .slider {
      background: rgba(74, 91, 120, 0.65) !important;
      border-radius: 5px !important;
    }

    .monaco-editor .scrollbar .slider:hover {
      background: rgba(86, 207, 191, 0.85) !important;
    }

    .monaco-editor .scrollbar .slider.active {
      background: rgba(78, 201, 148, 1.0) !important;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      height: 100%;
      background: var(--bg-dark);
      border-right: 1px solid var(--border-tab);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      user-select: none;
      color: var(--text-dim);
      box-sizing: border-box;
      position: relative;
      transition: all 0.2s ease;
    }

    .tab:hover {
      background: var(--bg-tab-hover);
      color: var(--text);
    }

    .tab.active {
      background: var(--bg-darkest);
      color: var(--accent);
      font-weight: 600;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
    }

    .tab .dirty-dot {
      width: 6px;
      height: 6px;
      background: var(--dirty-dot);
      border-radius: 50%;
      display: inline-block;
    }

    #editor-container {
      flex: 1;
      position: relative;
      background: var(--bg-darkest);
    }

    #monaco-anchor {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .monaco-editor .decorationsOverviewRuler {
      display: none !important;
    }

    .monaco-definition-link {
      color: var(--accent) !important;
      cursor: pointer !important;
      text-decoration: underline !important;
      text-decoration-color: var(--accent) !important;
      text-underline-offset: 3px;
    }

    .tab.dragging {
      opacity: 0.5;
    }

    /* Modern VS Code / Antigravity Style Floating Definition & Variable Inspection Window */
    #monaco-custom-hover-card {
      position: fixed;
      z-index: 99999;
      display: none;
      background: var(--hover-bg);
      border: 1px solid var(--hover-border);
      border-radius: 9px;
      box-shadow: var(--hover-shadow);
      padding: 11px 15px;
      max-width: 540px;
      min-width: 290px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text);
      pointer-events: auto;
      user-select: text;
      transition: opacity 0.12s ease, transform 0.12s ease;
      backdrop-filter: blur(14px);
    }

    #monaco-custom-hover-card .hover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--hover-border);
      flex-wrap: wrap;
    }

    #monaco-custom-hover-card .hover-kind-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
    }

    #monaco-custom-hover-card .hover-kind-variable {
      color: #00d2ff;
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.32);
    }
    #monaco-custom-hover-card .hover-kind-constant {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    #monaco-custom-hover-card .hover-kind-parameter {
      color: #c084fc;
      background: rgba(192, 132, 252, 0.14);
      border: 1px solid rgba(192, 132, 252, 0.35);
    }
    #monaco-custom-hover-card .hover-kind-function {
      color: #4ade80;
      background: rgba(74, 222, 128, 0.13);
      border: 1px solid rgba(74, 222, 128, 0.32);
    }
    #monaco-custom-hover-card .hover-kind-macro {
      color: #fb7185;
      background: rgba(251, 113, 133, 0.13);
      border: 1px solid rgba(251, 113, 133, 0.32);
    }
    #monaco-custom-hover-card .hover-kind-type,
    #monaco-custom-hover-card .hover-kind-class,
    #monaco-custom-hover-card .hover-kind-struct {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.13);
      border: 1px solid rgba(56, 189, 248, 0.32);
    }

    #monaco-custom-hover-card .hover-meta-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    #monaco-custom-hover-card .hover-scope-pill {
      font-size: 10.5px;
      color: var(--text-dim);
      background: var(--hover-code-bg);
      border: 1px solid var(--hover-border);
      padding: 1px 7px;
      border-radius: 4px;
      font-family: 'Consolas', monospace;
    }

    #monaco-custom-hover-card .hover-loc {
      color: var(--text-dim);
      font-size: 10.5px;
      font-family: 'Consolas', monospace;
      background: var(--hover-code-bg);
      border: 1px solid var(--hover-border);
      padding: 1px 7px;
      border-radius: 4px;
    }

    #monaco-custom-hover-card .hover-proto {
      background: var(--hover-code-bg);
      border: 1px solid var(--hover-border);
      padding: 7px 11px;
      border-radius: 6px;
      margin: 6px 0;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: 'Consolas', 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    #monaco-custom-hover-card .hover-details-box {
      margin-top: 6px;
      padding: 4px 0;
    }

    #monaco-custom-hover-card .hover-prop-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      font-size: 11px;
    }

    #monaco-custom-hover-card .hover-prop-key {
      color: var(--text-dim);
      font-weight: 600;
      font-size: 11px;
      min-width: 82px;
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
    }

    #monaco-custom-hover-card .hover-prop-val {
      font-family: 'Consolas', monospace;
      color: #7ee787;
      background: var(--hover-code-bg);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--hover-border);
      font-size: 11px;
      max-width: 380px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #monaco-custom-hover-card .hover-type-tag {
      background: var(--hover-code-bg);
      color: var(--hover-type);
      border: 1px solid var(--hover-border);
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-family: 'Consolas', monospace;
    }

    #monaco-custom-hover-card .hover-param-tag {
      background: var(--hover-code-bg);
      color: var(--hover-param);
      border: 1px solid var(--hover-border);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-family: 'Consolas', monospace;
      display: inline-block;
    }

    #monaco-custom-hover-card .hover-footer {
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid var(--hover-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #monaco-custom-hover-card .hover-goto-btn {
      color: var(--hover-link);
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 4px;
      background: var(--hover-code-bg);
      border: 1px solid var(--hover-border);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      user-select: none;
    }

    #monaco-custom-hover-card .hover-goto-btn:hover {
      background: var(--border);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Style Monaco's Native Hover and Quick Input Popups */
    .monaco-editor .monaco-hover {
      background: var(--hover-bg) !important;
      border: 1px solid var(--hover-border) !important;
      border-radius: 8px !important;
      box-shadow: var(--hover-shadow) !important;
      color: var(--text) !important;
    }

    .monaco-editor .monaco-hover-content {
      color: var(--text) !important;
      font-family: 'Consolas', 'Segoe UI', monospace !important;
    }

    .monaco-editor .quick-input-widget {
      background: var(--hover-bg) !important;
      border: 1px solid var(--hover-border) !important;
      border-radius: 8px !important;
      box-shadow: var(--hover-shadow) !important;
      color: var(--text) !important;
    }

    .monaco-editor .parameter-hints-widget {
      background: var(--hover-bg) !important;
      border: 1px solid var(--hover-border) !important;
      border-radius: 6px !important;
      box-shadow: var(--hover-shadow) !important;
      color: var(--text) !important;
    }

    /* GoTo Target Line Flash Animation */
    @keyframes lineFlashTarget {
      0% { background: rgba(0, 210, 255, 0.45); }
      50% { background: rgba(0, 210, 255, 0.25); }
      100% { background: transparent; }
    }

    .monaco-target-line-flash {
      background: rgba(0, 210, 255, 0.35) !important;
      animation: lineFlashTarget 1.2s ease-out forwards;
    }

    /* AI Edits Glow & Diff Highlighting Styles */
    .monaco-editor .ai-edit-added-line,
    .ai-edit-added-line {
      background-color: rgba(46, 160, 67, 0.42) !important;
      border-left: 5px solid #3fb950 !important;
      box-shadow: inset 0 0 12px rgba(46, 160, 67, 0.50) !important;
      animation: greenGlowPulse 0.9s ease-in-out infinite alternate !important;
    }

    .monaco-editor .ai-edit-removed-line,
    .ai-edit-removed-line {
      background-color: rgba(248, 81, 73, 0.42) !important;
      border-left: 5px solid #f85149 !important;
      box-shadow: inset 0 0 12px rgba(248, 81, 73, 0.50) !important;
      animation: redGlowPulse 0.9s ease-in-out infinite alternate !important;
    }

    .monaco-editor .ai-edit-modified-line,
    .ai-edit-modified-line {
      background-color: rgba(56, 139, 253, 0.36) !important;
      border-left: 5px solid #58a6ff !important;
      box-shadow: inset 0 0 12px rgba(56, 139, 253, 0.48) !important;
      animation: blueGlowPulse 0.9s ease-in-out infinite alternate !important;
    }

    .monaco-editor .ai-edit-added-inline,
    .ai-edit-added-inline {
      background-color: rgba(46, 160, 67, 0.45) !important;
      color: #aff5b4 !important;
      border-radius: 3px !important;
    }

    .monaco-editor .ai-edit-removed-inline,
    .ai-edit-removed-inline {
      background-color: rgba(248, 81, 73, 0.45) !important;
      color: #ffdcd7 !important;
      border-radius: 3px !important;
    }

    .monaco-editor .ai-edit-modified-inline,
    .ai-edit-modified-inline {
      background-color: rgba(56, 139, 253, 0.45) !important;
      color: #dbeeff !important;
      border-radius: 3px !important;
    }

    .ai-edit-added-gutter::before {
      content: '+';
      color: #3fb950;
      font-weight: bold;
      font-size: 14px;
      margin-left: 3px;
    }

    .ai-edit-removed-gutter::before {
      content: '-';
      color: #f85149;
      font-weight: bold;
      font-size: 14px;
      margin-left: 3px;
    }

    .ai-edit-modified-gutter::before {
      content: '~';
      color: #58a6ff;
      font-weight: bold;
      font-size: 14px;
      margin-left: 3px;
    }

    @keyframes greenGlowPulse {
      0% {
        background-color: rgba(46, 160, 67, 0.20) !important;
        box-shadow: inset 0 0 6px rgba(46, 160, 67, 0.25) !important;
      }

      100% {
        background-color: rgba(46, 160, 67, 0.40) !important;
        box-shadow: inset 0 0 18px rgba(46, 160, 67, 0.65) !important;
      }
    }

    @keyframes redGlowPulse {
      0% {
        background-color: rgba(248, 81, 73, 0.20) !important;
        box-shadow: inset 0 0 6px rgba(248, 81, 73, 0.25) !important;
      }

      100% {
        background-color: rgba(248, 81, 73, 0.40) !important;
        box-shadow: inset 0 0 18px rgba(248, 81, 73, 0.65) !important;
      }
    }

    @keyframes blueGlowPulse {
      0% {
        background-color: rgba(56, 139, 253, 0.22) !important;
        box-shadow: inset 0 0 6px rgba(56, 139, 253, 0.28) !important;
      }

      100% {
        background-color: rgba(56, 139, 253, 0.46) !important;
        box-shadow: inset 0 0 18px rgba(56, 139, 253, 0.68) !important;
      }
    }

    #ai-diff-banner {
      position: absolute;
      bottom: 16px;
      left: 50%;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(21, 25, 34, 0.95);
      border: 1px solid #2ea043;
      border-radius: 6px;
      padding: 6px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(46, 160, 67, 0.3);
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      font-size: 12px;
      color: #e6edf3;
      backdrop-filter: blur(8px);
      animation: bannerSlideIn 0.3s ease-out;
      transform: translateX(-50%);
      width: max-content;
      max-width: min(calc(100% - 32px), 760px);
      box-sizing: border-box;
    }

    #ai-diff-banner .review-title {
      color: #00d2ff;
      font-weight: 700;
      white-space: nowrap;
    }

    #ai-diff-banner .review-file {
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #f0f6fc;
      font-weight: 600;
    }

    #ai-diff-banner .review-position {
      color: #8b949e;
      white-space: nowrap;
    }

    #ai-diff-banner .review-message {
      color: #f2cc60;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #ai-diff-banner .review-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 2px;
    }

    #ai-diff-banner .diff-badge-add {
      background: rgba(46, 160, 67, 0.25);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.6);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 11px;
    }

    #ai-diff-banner .diff-badge-remove {
      background: rgba(248, 81, 73, 0.25);
      color: #f85149;
      border: 1px solid rgba(248, 81, 73, 0.6);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 11px;
    }

    #ai-diff-banner .diff-badge-modify {
      background: rgba(56, 139, 253, 0.2);
      color: #58a6ff;
      border: 1px solid rgba(56, 139, 253, 0.55);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 11px;
    }

    #ai-diff-banner .review-btn {
      background: #21262d;
      color: #abb2bf;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    #ai-diff-banner .review-btn:hover:not(:disabled) {
      background: #30363d;
      color: #ffffff;

<body>

      <button class="reload" data-action="reload">Reload</button>

    </div>

    <div id="editor-container">

      <div id="ai-diff-banner" role="region" aria-live="polite" aria-label="AI edit review">
        <span id="ai-review-title" class="review-title">🤖 AI Review</span>
        <span id="ai-review-file" class="review-file"></span>
        <span id="ai-review-position" class="review-position"></span>

        <span id="ai-diff-modify-count" class="diff-badge-modify">~0 changed</span>

          <button id="ai-review-accept" class="review-btn accept" type="button">Accept</button>
          <button id="ai-history-undo" class="review-btn undo" type="button" style="display:none">Undo AI</button>
          <button id="ai-history-redo" class="review-btn redo" type="button" style="display:none">Redo AI</button>
          <button id="ai-history-close" class="review-btn close-banner" type="button" style="display:none" aria-label="Close AI history banner" title="Close">✕</button>
        </span>

    <div id="monaco-custom-hover-card" role="tooltip"></div>
  </div>

  <!-- Expose Monaco globally so themes and models can be managed dynamically -->
  <script>
    window.MonacoEnvironment = { globalAPI: true };
  </script>
  <!-- QWebChannel bridge for Qt / PySide6 embedded environment -->
  <script src="qwebchannel.js"></script>
  <script>
    (function () {
      function initQtWebChannel() {
        if (typeof QWebChannel === 'undefined') return;
        if (typeof qt === 'undefined' || !qt.webChannelTransport) return;
        if (window.__webChannelReady) return;
        window.__webChannelReady = true;

        new QWebChannel(qt.webChannelTransport, function (channel) {
          const bridge = channel.objects.editorBridge;
          window.editorBridge = bridge;
          window.pywebview = {
            api: new Proxy(bridge, {
              get(target, prop) {
                if (typeof target[prop] === 'function') {
                  return function (...args) {
                    return new Promise((resolve, reject) => {
                      try {
                        target[prop](...args, function (res) {
                          resolve(res);
                        });
                      } catch (err) {
                        reject(err);
                      }
                    });
                  };
                }
                return target[prop];
              }
            })
          };
          window.dispatchEvent(new Event('pywebviewready'));
          if (typeof window.safeLoadProject === 'function') {
            window.safeLoadProject();
          } else if (typeof window.loadProject === 'function') {
            window.loadProject();
          }
        });
      }
      initQtWebChannel();
      window.__initQtWebChannel = initQtWebChannel;
    })();
  </script>
  <!-- Local, C++-only trimmed Monaco bundle. No CDN / network dependency. -->
  <script src="bundle.js"></script>
  <script>
    if (!window.pywebview && window.parent && window.parent.pywebview) {
      window.pywebview = window.parent.pywebview;
    }
    (function () {
      // The page loads the project once at DOMContentLoaded, while the host
      // may request a refresh at the same time when the project is attached.
      // Coalesce host-triggered reloads so two async loads cannot materialize
      // the same file twice in the tab bar.
      let projectLoadInFlight = null;
      const originalLoadProject = window.loadProject;
      window.safeLoadProject = function () {
        if (projectLoadInFlight) return projectLoadInFlight;
        if (typeof originalLoadProject !== 'function') return Promise.resolve();
        projectLoadInFlight = Promise.resolve(originalLoadProject())
          .finally(() => { projectLoadInFlight = null; });
        return projectLoadInFlight;
      };

      function dedupeProjectTabs() {
        const seen = new Set();
        document.querySelectorAll('#tab-bar .tab').forEach((tab) => {
          const rawKey = tab._filePath || tab.getAttribute('data-file-path') || tab.id;
          const key = String(rawKey || '').replace(/\\/g, '/').toLowerCase();
          if (!key || !seen.has(key)) {
            if (key) seen.add(key);
            return;
          }
          if (tab.classList.contains('active')) {
            const first = document.querySelector('#tab-bar .tab');
            if (first && first !== tab) first.click();
          }
          tab.remove();
        });
      }
      window.dedupeProjectTabs = dedupeProjectTabs;

      const projectTabBar = document.getElementById('tab-bar');
      if (projectTabBar) {
        new MutationObserver(dedupeProjectTabs).observe(projectTabBar, { childList: true });
      }

      // ── Instant Unhide & Resize Observers ──────────────────────────────────
      // When the editor container is unhidden, docked/undocked, or resized,
      // trigger Monaco layout immediately so there is zero render throttling or latency.
      window.forceEditorLayout = function () {
        if (window.editorInstance && typeof window.editorInstance.layout === 'function') {
          window.editorInstance.layout();
        }
      };

      const editorContainerElem = document.getElementById('editor-container') || document.getElementById('monaco-anchor');
      if (window.ResizeObserver && editorContainerElem) {
        const ro = new ResizeObserver(() => {
          if (window.editorInstance && typeof window.editorInstance.layout === 'function') {
            window.editorInstance.layout();
          }
        });
        ro.observe(editorContainerElem);
      }

      window.addEventListener('resize', () => {
        if (window.editorInstance && typeof window.editorInstance.layout === 'function') {
          window.editorInstance.layout();
        }
      }, { passive: true });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && window.editorInstance && typeof window.editorInstance.layout === 'function') {
          window.editorInstance.layout();
        }
      });

      const bar = document.getElementById('detached-action-bar');
      window.setDetachedActionBar = function (visible) {
        bar.classList.toggle('visible', !!visible);
        if (window.editorInstance) window.editorInstance.layout();
      };
      window.setDetachedButtonStates = function (states) {
        if (!bar || !states) return;
        Object.keys(states).forEach(action => {
          const btn = bar.querySelector(`button[data-action="${action}"]`);
          if (btn) {
            btn.disabled = !states[action];
          }
        });
      };
      bar.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button || button.disabled || !window.pywebview || !window.pywebview.api) return;
        try {
          const action = button.dataset.action;
          if (action === 'compile' || action === 'upload') {
            if (typeof window.saveAllFilesSafe === 'function') {
              await window.saveAllFilesSafe();
            }
          }
          await window.pywebview.api.run_action(action);
        } catch (e) {
          console.error("Detached action error:", e);
        }
      });
    })();

    (function () {
      let fileList = [];

      let syncInFlight = null;
      function syncTabPaths() {
        if (syncInFlight) return syncInFlight;
        if (!window.pywebview || !window.pywebview.api ||
            !window.pywebview.api.get_project_files) {
          return Promise.resolve([]);
        }
        syncInFlight = window.pywebview.api.get_project_files()
          .then((files) => {
            fileList = Array.isArray(files) ? files : [];
            window.projectFileList = fileList;
            const tabs = Array.from(document.querySelectorAll('#tab-bar .tab'));
            const validPaths = new Set(fileList.map((file) =>
              String(file.path || '').replace(/\\/g, '/').toLowerCase()
            ));
            const mappedPaths = tabs.map((tab) =>
              String(tab._filePath || '').replace(/\\/g, '/').toLowerCase()
            );
            const needsFullMap = mappedPaths.some((path) => !path || !validPaths.has(path)) ||
              new Set(mappedPaths.filter(Boolean)).size !== mappedPaths.filter(Boolean).length;

            // Bundle tab IDs are sanitized and can collide. The bundle creates
            // tabs in exactly get_project_files() order, so a stateless index
            // map is collision-free during initial/incremental construction.
            // Once every tab has a unique path, preserve it across drag moves.
            if (needsFullMap) {
              tabs.forEach((tab, index) => {
                const file = fileList[index];
                if (!file) return;
                tab._filePath = file.path;
                tab.setAttribute('data-file-path', file.path);
                tab.setAttribute('draggable', 'true');
              });
            } else {
              tabs.forEach((tab) => tab.setAttribute('draggable', 'true'));
            }
            dedupeProjectTabs();
            return fileList;
          })
          .catch((error) => {
            console.error('Could not map editor tabs to project files:', error);
            return [];
          })
          .finally(() => { syncInFlight = null; });
        return syncInFlight;
      }

      window.syncTabPaths = syncTabPaths;
      if (window.pywebview && window.pywebview.api) {
        setTimeout(syncTabPaths, 0);
      } else {
        window.addEventListener('pywebviewready', () => setTimeout(syncTabPaths, 0));
      }

      let tabSyncTimer = null;
      const observer = new MutationObserver(() => {
        clearTimeout(tabSyncTimer);
        tabSyncTimer = setTimeout(syncTabPaths, 0);
      });

      const tabBar = document.getElementById('tab-bar');
      observer.observe(tabBar, { childList: true });

      let dragSrcEl = null;

      tabBar.addEventListener('dragstart', (e) => {
        const tab = e.target.closest('.tab');
        if (!tab) return;
        dragSrcEl = tab;
        e.dataTransfer.effectAllowed = 'move';
        tab.classList.add('dragging');
      });

      tabBar.addEventListener('dragover', (e) => {
        e.preventDefault();
        const tab = e.target.closest('.tab');
        if (!tab || tab === dragSrcEl) return;

        const rect = tab.getBoundingClientRect();
        const midpoint = rect.left + rect.width / 2;
        if (e.clientX < midpoint) {
          tabBar.insertBefore(dragSrcEl, tab);
        } else {
          tabBar.insertBefore(dragSrcEl, tab.nextSibling);
        }
      });

      tabBar.addEventListener('dragend', (e) => {
        const tab = e.target.closest('.tab');
        if (tab) tab.classList.remove('dragging');
        dragSrcEl = null;

        const paths = [];
        for (const child of tabBar.children) {
          if (child._filePath) {
            paths.push(child._filePath);
          }
        }
        if (window.pywebview && window.pywebview.api && window.pywebview.api.save_tab_order) {
          window.pywebview.api.save_tab_order(paths);
        }
      });
    })();

    (function () {
      let monacoFontSize = 14;
      function handleZoom(e) {
        if (e.ctrlKey || e.metaKey) {
          if (e.key === '=' || e.key === '+' || e.keyCode === 187 || e.keyCode === 107) {
            e.preventDefault();
            e.stopPropagation();
            zoomMonaco(1);
          } else if (e.key === '-' || e.keyCode === 189 || e.keyCode === 109) {
            e.preventDefault();
            e.stopPropagation();
            zoomMonaco(-1);
          }
        }
      }

      function zoomMonaco(delta) {
        if (window.editorInstance) {
          monacoFontSize = Math.max(6, Math.min(40, monacoFontSize + delta));
          window.editorInstance.updateOptions({ fontSize: monacoFontSize });
        }
      }

      window.addEventListener('keydown', handleZoom, true);
      document.addEventListener('keydown', handleZoom, true);

      function handleEditorShortcuts(e) {
        if (e.ctrlKey || e.metaKey) {
          const key = e.key.toLowerCase();
          if (key === 'r') {
            e.preventDefault();
            e.stopPropagation();
            const doRun = () => {
              if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.run_action('compile');
              }
            };
            if (typeof window.saveAllFilesSafe === 'function') {
              window.saveAllFilesSafe().then(doRun).catch(doRun);
            } else {
              doRun();
            }
          } else if (key === 'u') {
            e.preventDefault();
            e.stopPropagation();
            const doRun = () => {
              if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.run_action('upload');
              }
            };
            if (typeof window.saveAllFilesSafe === 'function') {
              window.saveAllFilesSafe().then(doRun).catch(doRun);
            } else {
              doRun();
            }
          } else if (key === 's') {
            e.preventDefault();
            e.stopPropagation();
            if (typeof window.saveAllFilesSafe === 'function') {
              window.saveAllFilesSafe();
            } else if (typeof window.saveAllFiles === 'function') {
              window.saveAllFiles();
            } else if (window.pywebview && window.pywebview.api && window.pywebview.api.save_all_files) {
              window.pywebview.api.save_all_files();
            }
          }
        }
      }
      window.addEventListener('keydown', handleEditorShortcuts, true);
      document.addEventListener('keydown', handleEditorShortcuts, true);

      window.saveAllFilesSafe = async function () {
        if (typeof window.saveAllFiles === 'function') {
          try {
            await window.saveAllFiles();
          } catch (e) {
            console.error("saveAllFiles error:", e);
          }
        }
        if (typeof window.saveActiveFile === 'function') {
          try {
            await window.saveActiveFile();
          } catch (e) {
            console.error("saveActiveFile error:", e);
          }
        }
        return true;
      };

      window.setEditorMarkers = function (errorsJsonStr) {
        if (!window.editorInstance) return;
        const model = window.editorInstance.getModel();
        if (!model) return;
        try {
          const errors = JSON.parse(errorsJsonStr);
          const markers = errors.map(err => {
            const lineContent = model.getLineContent(err.line) || "";
            const maxCol = Math.max(1, lineContent.length + 1);
            let startCol = Math.max(1, Math.min(err.col || 1, maxCol));
            let endLine = err.endLine || err.line;
            let endCol = err.endCol;
            if (!endCol) {
              endCol = startCol + 1;
              if (startCol - 1 < lineContent.length) {
                let idx = startCol - 1;
                while (idx < lineContent.length && /\w/.test(lineContent[idx])) {
                  idx++;
                }
                endCol = Math.max(startCol + 1, idx + 1);
              }
            }
            endCol = Math.max(startCol + 1, Math.min(endCol, maxCol + 1));
            return {
              severity: err.severity === 'error' ? monaco.MarkerSeverity.Error : monaco.MarkerSeverity.Warning,
              message: err.message,
              startLineNumber: err.line,
              startColumn: startCol,
              endLineNumber: endLine,
              endColumn: endCol
            };
          });
          monaco.editor.setModelMarkers(model, "owner_python_syntax", markers);
        } catch (e) {
          console.error(e);
        }
      };

      let lastCheckedContent = "";
      let syntaxCheckTimeout = null;

      function runMonacoSyntaxCheck() {
        if (!window.editorInstance || !window.pywebview || !window.pywebview.api || !window.pywebview.api.realtime_check_syntax) {
          return;
        }
        const model = window.editorInstance.getModel();
        if (!model) return;

        const activeTab = document.querySelector('.tab.active');
        const filePath = activeTab ? activeTab._filePath : "";
        if (!filePath) return;

        if (!filePath.endsWith('.ino') && !filePath.endsWith('.cpp') && !filePath.endsWith('.h')) {
          window.setEditorMarkers("[]");
          return;
        }

        const content = model.getValue();
        if (content === lastCheckedContent) return;
        lastCheckedContent = content;

        if (window.pywebview && window.pywebview.api) {
          window.pywebview.api.realtime_check_syntax(filePath, content).then(errorsJsonStr => {
            window.setEditorMarkers(errorsJsonStr);
          }).catch(err => console.error(err));
        } else {
          console.warn("Detached mode: pywebview API not available. Realtime syntax disabled.");
        }
      }

      function scheduleSyntaxCheck() {
        if (syntaxCheckTimeout) {
          clearTimeout(syntaxCheckTimeout);
        }
        syntaxCheckTimeout = setTimeout(runMonacoSyntaxCheck, 300);
      }

      function syncModelLanguageForActiveTab() {
        if (!window.editorInstance || typeof monaco === 'undefined' || !monaco.editor) return;
        const activeTab = document.querySelector('#tab-bar .tab.active');
        const activePath = activeTab ? activeTab._filePath : "";
        if (!activePath) return;

        const model = window.editorInstance.getModel();
        if (!model) return;

        const ext = activePath.split('.').pop().toLowerCase();
        let targetLang = 'cpp';
        if (ext === 'txt') {
          targetLang = 'plaintext';
        } else if (ext === 'md') {
          targetLang = 'markdown';
        } else if (ext === 'json') {
          targetLang = 'json';
        } else if (ext === 'py') {
          targetLang = 'python';
        } else if (ext === 'js') {
          targetLang = 'javascript';
        } else if (ext === 'ini') {
          targetLang = 'ini';
        } else if (['ino', 'cpp', 'c', 'h', 'hpp'].includes(ext)) {
          targetLang = 'cpp';
        } else {
          targetLang = 'plaintext';
        }

        try {
          const currentLang = model.getLanguageId ? model.getLanguageId() : '';
          if (currentLang !== targetLang) {
            monaco.editor.setModelLanguage(model, targetLang);
          }
        } catch (e) { }
      }

      window.syncModelLanguageForActiveTab = syncModelLanguageForActiveTab;

      function checkMonacoSyntaxRealtime() {
        if (!window.editorInstance) {
          setTimeout(checkMonacoSyntaxRealtime, 1000);
          return;
        }

        const model = window.editorInstance.getModel();
        if (!model) {
          setTimeout(checkMonacoSyntaxRealtime, 500);
          return;
        }

        syncModelLanguageForActiveTab();

        if (!window.editorInstance._syntax_listener_added) {
          window.editorInstance._syntax_listener_added = true;

          window.editorInstance.onDidChangeModelContent(() => {
            if (window._applyingAiReviewModelUpdate) return;
            scheduleSyntaxCheck();
            if (window.pywebview && window.pywebview.api) {
              const activeTab = document.querySelector('.tab.active');
              const filePath = activeTab ? activeTab._filePath : "";
              if (filePath && window.pywebview.api.mark_modified) {
                window.pywebview.api.mark_modified(filePath, true);
              }
              if (window.pywebview.api.on_editor_content_change) {
                window.pywebview.api.on_editor_content_change();
              }
            }
          });

          window.editorInstance.onDidChangeModel(() => {
            lastCheckedContent = ""; // Force recheck on tab switch
            syncModelLanguageForActiveTab();
            scheduleSyntaxCheck();
          });

          scheduleSyntaxCheck();
        }

        setTimeout(checkMonacoSyntaxRealtime, 2000);
      }

      const tabBarElem = document.getElementById('tab-bar');
      if (tabBarElem) {
        tabBarElem.addEventListener('click', () => {
          setTimeout(syncModelLanguageForActiveTab, 50);
        });
      }

      // Start polling for editor instance initialization
      setTimeout(checkMonacoSyntaxRealtime, 1000);
    })();

    // ── AI Edit Diff & Glowing Text Highlight Engine ──────────────────────
    // Transactional AI review engine. OpenCode writes to the project first;
    // this layer keeps that write highlighted and reversible until the user
    // explicitly accepts or rejects it.
    (function () {
      const bundledReloadActiveFile = window.reloadActiveFile;
      const decorationsByModel = new Map();
      let currentReview = null;
      let currentReviewModel = null;
      let renderGeneration = 0;
      let resolvingReview = false;
      let workspaceReloadScheduled = false;
      let tabInteractionLocked = false;
      let glyphMarginWasEnabled = null;
      let reloadQueue = Promise.resolve();
      let deferredReviewCancellations = [];
      let historyBusy = false;

      function normalizePath(path) {
        return String(path || '').replace(/\\/g, '/').toLowerCase();
      }

      function bridgeApi() {
        return window.pywebview && window.pywebview.api
          ? window.pywebview.api
          : null;
      }

      function pause(milliseconds) {
        return new Promise((resolve) => setTimeout(resolve, milliseconds));
      }

      function activeEditorPath() {
        const activeTab = document.querySelector('#tab-bar .tab.active');
        return activeTab ? activeTab._filePath || '' : '';
      }

      function tabForPath(path) {
        const wanted = normalizePath(path);
        return Array.from(document.querySelectorAll('#tab-bar .tab'))
          .find((tab) => normalizePath(tab._filePath) === wanted) || null;
      }

      function modelHasUnsavedChanges(path, model) {
        const tab = tabForPath(path);
        const dirtyDot = tab ? tab.querySelector('.dirty-dot') : null;
        return !!(model && dirtyDot && dirtyDot.style.display !== 'none');
      }

      const reviewTabBar = document.getElementById('tab-bar');
      if (reviewTabBar) {
        for (const eventName of ['click', 'dragstart', 'drop']) {
          reviewTabBar.addEventListener(eventName, (event) => {
            if (tabInteractionLocked && event.isTrusted) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      }

      function replaceDecorations(model, decorations) {
        if (!model) return;
        const key = model.uri.toString();
        const previous = decorationsByModel.get(key) || [];
        const next = model.deltaDecorations(previous, decorations || []);
        if (next.length) decorationsByModel.set(key, next);
        else decorationsByModel.delete(key);
      }

      function clearDecorations(model) {
        if (!model) return;
        const key = model.uri.toString();
        const ids = decorationsByModel.get(key) || [];
        if (ids.length) model.deltaDecorations(ids, []);
        decorationsByModel.delete(key);
      }

      window.clearAiDiffHighlights = function () {
        if (typeof monaco !== 'undefined' && monaco.editor) {
          for (const model of monaco.editor.getModels()) clearDecorations(model);
        }
        if (!currentReview) {
          const banner = document.getElementById('ai-diff-banner');
          if (banner) banner.style.display = 'none';
        }
      };

      function setVisible(element, visible) {
        if (element) element.style.display = visible ? '' : 'none';
      }

      let aiHistoryBannerDismissed = false;
      let aiHistoryBannerToken = '';
      let lastAiHistoryState = null;
      let aiHistoryBaselinePath = '';
      let aiHistoryBaselineVersion = null;

      function captureAiHistoryBaseline() {
        const model = window.editorInstance && window.editorInstance.getModel
          ? window.editorInstance.getModel() : null;
        aiHistoryBaselinePath = normalizePath(activeEditorPath());
        aiHistoryBaselineVersion = model && model.getAlternativeVersionId
          ? model.getAlternativeVersionId() : null;
      }

      function editorIsAtAiHistoryBaseline() {
        const model = window.editorInstance && window.editorInstance.getModel
          ? window.editorInstance.getModel() : null;
        if (!model || aiHistoryBaselineVersion === null) return false;
        return normalizePath(activeEditorPath()) === aiHistoryBaselinePath &&
          model.getAlternativeVersionId() === aiHistoryBaselineVersion;
      }

      function dismissAiHistoryBanner() {
        aiHistoryBannerDismissed = true;
        const banner = document.getElementById('ai-diff-banner');
        if (banner && !currentReview) banner.style.display = 'none';
        restoreGlyphMargin();
      }

      function currentAiHistoryToken(state) {
        if (!state) return '';
        return [
          Number(state.undoDepth) || 0,
          Number(state.redoDepth) || 0,
          state.undo && state.undo.path || '',
          state.undo && state.undo.action || '',
          state.redo && state.redo.path || '',
          state.redo && state.redo.action || ''
        ].join('|');
      }

      function setReviewButtonsDisabled(disabled) {
        const accept = document.getElementById('ai-review-accept');
        const reject = document.getElementById('ai-review-reject');
        if (accept) accept.disabled = !!disabled;
        if (reject) reject.disabled = !!disabled;
      }

      function setBannerReviewMode() {
        const title = document.getElementById('ai-review-title');
        if (title) title.textContent = '🤖 AI Review';
        setVisible(document.getElementById('ai-diff-add-count'), true);
        setVisible(document.getElementById('ai-diff-modify-count'), true);
        setVisible(document.getElementById('ai-diff-remove-count'), true);
        setVisible(document.getElementById('ai-review-accept'), true);
        setVisible(document.getElementById('ai-review-reject'), true);
        setVisible(document.getElementById('ai-history-undo'), false);
        setVisible(document.getElementById('ai-history-redo'), false);
        setVisible(document.getElementById('ai-history-close'), false);
      }

      function showReviewBanner(snapshot, message) {
        const banner = document.getElementById('ai-diff-banner');
        if (!banner || !snapshot) return;
        aiHistoryBannerDismissed = false;
        aiHistoryBannerToken = '';
        setBannerReviewMode();
        const diff = snapshot.diff || {};
        const file = document.getElementById('ai-review-file');
        const position = document.getElementById('ai-review-position');
        const addBadge = document.getElementById('ai-diff-add-count');
        const modifyBadge = document.getElementById('ai-diff-modify-count');
        const removeBadge = document.getElementById('ai-diff-remove-count');
        const messageNode = document.getElementById('ai-review-message');
        if (file) {
          file.textContent = snapshot.fileName || String(snapshot.path || '').split(/[\\/]/).pop();
          file.title = snapshot.path || '';
        }
        if (position) {
          const index = Number(snapshot.reviewIndex) || 1;
          const count = Number(snapshot.pendingCount) || 1;
          position.textContent = `${index} of ${count}`;
        }
        if (addBadge) addBadge.textContent = `+${Number(diff.added) || 0} added`;
        if (modifyBadge) modifyBadge.textContent = `~${Number(diff.modified) || 0} changed`;
        if (removeBadge) removeBadge.textContent = `-${Number(diff.removed) || 0} removed`;
        let stateMessage = message || '';
        if (!stateMessage && snapshot.beforeExists === false) stateMessage = 'New file';
        if (!stateMessage && snapshot.afterExists === false) stateMessage = 'File deleted';
        if (messageNode) {
          messageNode.textContent = stateMessage;
          messageNode.title = stateMessage;
          messageNode.style.display = stateMessage ? 'inline' : 'none';
        }
        banner.style.display = 'flex';
      }

      async function refreshAiHistoryBanner(message) {
        if (currentReview || resolvingReview) return null;
        const api = bridgeApi();
        if (!api || !api.get_ai_history_state) return null;
        try {
          const state = await api.get_ai_history_state();
          const banner = document.getElementById('ai-diff-banner');
          if (!banner) return state;
          if (!state || (!state.canUndo && !state.canRedo)) {
            banner.style.display = 'none';
            restoreGlyphMargin();
            return state;
          }

          const title = document.getElementById('ai-review-title');
          const file = document.getElementById('ai-review-file');
          const position = document.getElementById('ai-review-position');
          const messageNode = document.getElementById('ai-review-message');
          const undoButton = document.getElementById('ai-history-undo');
          const redoButton = document.getElementById('ai-history-redo');
          const closeButton = document.getElementById('ai-history-close');
          const activeEntry = state.undo || state.redo || {};
          const historyToken = currentAiHistoryToken(state);
          if (historyToken !== aiHistoryBannerToken) {
            aiHistoryBannerToken = historyToken;
            aiHistoryBannerDismissed = false;
            // The refreshed model state becomes the boundary between normal
            // Monaco typing undo and AI-decision undo. Ctrl+Z only crosses
            // into AI history when the editor is exactly at this boundary.
            setTimeout(captureAiHistoryBaseline, 0);
          }
          lastAiHistoryState = state;

          if (title) title.textContent = '↶ AI History';
          if (file) {
            file.textContent = activeEntry.fileName || 'AI decision';
            file.title = activeEntry.path || '';
          }
          if (position) {
            position.textContent = `${Number(state.undoDepth) || 0} undo / ${Number(state.redoDepth) || 0} redo`;
          }
          setVisible(document.getElementById('ai-diff-add-count'), false);
          setVisible(document.getElementById('ai-diff-modify-count'), false);
          setVisible(document.getElementById('ai-diff-remove-count'), false);
          setVisible(document.getElementById('ai-review-accept'), false);
          setVisible(document.getElementById('ai-review-reject'), false);
          setVisible(undoButton, true);
          setVisible(redoButton, true);
          setVisible(closeButton, true);
          if (undoButton) {
            undoButton.disabled = historyBusy || !state.canUndo;
            undoButton.title = state.undo
              ? `Undo AI ${state.undo.action || 'decision'}: ${state.undo.fileName || ''}`
              : 'No AI decision to undo';
          }
          if (redoButton) {
            redoButton.disabled = historyBusy || !state.canRedo;
            redoButton.title = state.redo
              ? `Redo AI ${state.redo.action || 'decision'}: ${state.redo.fileName || ''}`
              : 'No AI decision to redo';
          }
          if (closeButton) closeButton.disabled = false;
          let stateMessage = message || '';
          if (!stateMessage && state.undo) {
            stateMessage = `Last AI edit ${state.undo.action || 'resolved'} — Undo is available`;
          } else if (!stateMessage && state.redo) {
            stateMessage = 'AI decision undone — Redo is available';
          }
          if (messageNode) {
            messageNode.textContent = stateMessage;
            messageNode.title = stateMessage;
            messageNode.style.display = stateMessage ? 'inline' : 'none';
          }
          banner.style.display = aiHistoryBannerDismissed ? 'none' : 'flex';
          if (aiHistoryBannerDismissed) restoreGlyphMargin();
          return state;
        } catch (error) {
          console.error('Could not refresh AI history:', error);
          return null;
        }
      }

      async function applyAiHistory(direction, force) {
        if (historyBusy || currentReview || resolvingReview) return;
        const api = bridgeApi();
        const method = direction === 'undo'
          ? api && api.undo_ai_edit_decision
          : api && api.redo_ai_edit_decision;
        if (!method) return;
        historyBusy = true;
        await refreshAiHistoryBanner(direction === 'undo' ? 'Undoing AI decision…' : 'Redoing AI decision…');
        try {
          let result = direction === 'undo'
            ? await api.undo_ai_edit_decision(!!force)
            : await api.redo_ai_edit_decision(!!force);
          if (result && result.conflict && !force) {
            const proceed = window.confirm(
              `${result.error || 'The file has newer changes.'}\n\n` +
              `${direction === 'undo' ? 'Undo' : 'Redo'} anyway and replace those changes?`
            );
            if (!proceed) {
              await refreshAiHistoryBanner('AI history action cancelled');
              return;
            }
            result = direction === 'undo'
              ? await api.undo_ai_edit_decision(true)
              : await api.redo_ai_edit_decision(true);
          }
          if (!result || !result.success) {
            await refreshAiHistoryBanner((result && result.error) || 'AI history action failed');
            return;
          }

          window.clearAiDiffHighlights();
          currentReview = null;
          currentReviewModel = null;
          if (result.workspaceShapeChanged) {
            scheduleWorkspaceReload('');
            return;
          }
          if (result.path) {
            const model = await activateAndResolveModel(result.path, 700);
            if (model) await reloadThroughBundle(result.path);
          }
          const verb = direction === 'undo' ? 'Undid' : 'Redid';
          await refreshAiHistoryBanner(`${verb} AI ${result.action || 'decision'}: ${result.fileName || ''}`);
        } catch (error) {
          console.error('AI history action failed:', error);
          await refreshAiHistoryBanner(`AI history action failed: ${error}`);
        } finally {
          historyBusy = false;
          await refreshAiHistoryBanner();
        }
      }

      async function reloadThroughBundleOnce(expectedPath) {
        if (typeof bundledReloadActiveFile !== 'function') return false;
        const expected = normalizePath(expectedPath || activeEditorPath());
        if (expected && normalizePath(activeEditorPath()) !== expected) {
          throw new Error('The target editor tab is not active.');
        }
        let editorWasReadOnly = false;
        if (window.editorInstance && typeof monaco !== 'undefined' && monaco.editor.EditorOption) {
          editorWasReadOnly = !!window.editorInstance.getOption(
            monaco.editor.EditorOption.readOnly
          );
          window.editorInstance.updateOptions({ readOnly: true });
        }
        window._applyingAiReviewModelUpdate = true;
        tabInteractionLocked = true;
        try {
          await bundledReloadActiveFile();
          if (expected && normalizePath(activeEditorPath()) !== expected) {
            throw new Error('The active editor tab changed during reload.');
          }
          return true;
        } finally {
          tabInteractionLocked = false;
          window._applyingAiReviewModelUpdate = false;
          if (window.editorInstance) {
            window.editorInstance.updateOptions({ readOnly: editorWasReadOnly });
          }
        }
      }

      function reloadThroughBundle(expectedPath) {
        const operation = reloadQueue.then(
          () => reloadThroughBundleOnce(expectedPath),
          () => reloadThroughBundleOnce(expectedPath)
        );
        reloadQueue = operation.catch(() => false);
        return operation;
      }

      // Keep normal Reload using the bundle's own clean-state path. That path
      // resets both Monaco's model and the bundle's private dirty-dot state.
      window.reloadActiveFile = async function () {
        try {
          return await reloadThroughBundle(activeEditorPath());
        } catch (error) {
          console.error('reloadActiveFile error:', error);
          return false;
        }
      };

      window.activateProjectFile = function (path) {
        const wanted = normalizePath(path);
        if (!wanted) return false;
        const target = tabForPath(path);
        if (!target) return false;
        if (!target.classList.contains('active')) target.click();
        return true;
      };

      async function activateAndResolveModel(path, timeoutMs) {
        const wanted = normalizePath(path);
        const deadline = Date.now() + (timeoutMs || 1400);
        if (typeof window.syncTabPaths === 'function') {
          try { await window.syncTabPaths(); } catch (error) { }
        }
        while (Date.now() < deadline) {
          window.activateProjectFile(path);
          await pause(25);
          const activeTab = document.querySelector('#tab-bar .tab.active');
          if (activeTab && normalizePath(activeTab._filePath) === wanted &&
              window.editorInstance && window.editorInstance.getModel()) {
            return window.editorInstance.getModel();
          }
          await pause(35);
        }
        return null;
      }

      function revealFirstChange(model, firstLine) {
        if (!model || !window.editorInstance ||
            window.editorInstance.getModel() !== model) return;
        const line = Math.min(
          Math.max(1, Number(firstLine) || 1),
          Math.max(1, model.getLineCount())
        );
        const reveal = () => {
          if (window.editorInstance.getModel() !== model) return;
          window.editorInstance.revealLineInCenter(line);
          window.editorInstance.setPosition({ lineNumber: line, column: 1 });
          window.editorInstance.focus();
        };
        reveal();
        setTimeout(reveal, 90);
      }

      function enableReviewGlyphMargin() {
        if (!window.editorInstance || typeof monaco === 'undefined') return;
        if (glyphMarginWasEnabled === null && monaco.editor.EditorOption) {
          glyphMarginWasEnabled = !!window.editorInstance.getOption(
            monaco.editor.EditorOption.glyphMargin
          );
        }
        window.editorInstance.updateOptions({ glyphMargin: true });
      }

      function restoreGlyphMargin() {
        if (!window.editorInstance || glyphMarginWasEnabled === null) return;
        window.editorInstance.updateOptions({ glyphMargin: glyphMarginWasEnabled });
        glyphMarginWasEnabled = null;
      }

      window.applyStructuredAiDiff = function (diff, model, snapshot) {
        if (!model || !diff || typeof monaco === 'undefined') return;
        enableReviewGlyphMargin();
        const lineCount = Math.max(1, model.getLineCount());
        const decorations = [];
        const changes = Array.isArray(diff.changes) ? diff.changes : [];
        for (const change of changes) {
          let start = Math.min(lineCount, Math.max(1, Number(change.startLine) || 1));
          let end = Math.min(lineCount, Math.max(start, Number(change.endLine) || start));
          const kind = ['added', 'removed', 'modified'].includes(change.type)
            ? change.type : 'modified';
          if (snapshot && snapshot.afterExists === false && kind === 'removed') {
            start = 1;
            end = lineCount;
          }
          const color = kind === 'added' ? '#3fb950'
            : (kind === 'removed' ? '#f85149' : '#58a6ff');
          decorations.push({
            range: new monaco.Range(start, 1, end, model.getLineMaxColumn(end)),
            options: {
              isWholeLine: true,
              className: `ai-edit-${kind}-line`,
              inlineClassName: `ai-edit-${kind}-inline`,
              linesDecorationsClassName: `ai-edit-${kind}-gutter`,
              glyphMarginClassName: `ai-edit-${kind}-gutter`,
              overviewRuler: {
                color,
                position: monaco.editor.OverviewRulerLane.Full
              }
            }
          });
        }
        replaceDecorations(model, decorations);
        showReviewBanner(snapshot || currentReview);
        revealFirstChange(model, diff.firstLine);
      };

      window.applyAiDiffHighlights = function (oldContent, newContent, model, snapshot) {
        if (!model || oldContent === newContent) {
          if (model) clearDecorations(model);
          showReviewBanner(snapshot || currentReview);
          return;
        }
        const oldLines = String(oldContent || '').split(/\r?\n/);
        const newLines = String(newContent || '').split(/\r?\n/);
        let prefix = 0;
        const limit = Math.min(oldLines.length, newLines.length);
        while (prefix < limit && oldLines[prefix] === newLines[prefix]) prefix++;
        const firstLine = Math.min(Math.max(1, prefix + 1), model.getLineCount());
        replaceDecorations(model, [{
          range: new monaco.Range(firstLine, 1, model.getLineCount(), model.getLineMaxColumn(model.getLineCount())),
          options: {
            isWholeLine: true,
            className: 'ai-edit-modified-line',
            inlineClassName: 'ai-edit-modified-inline',
            linesDecorationsClassName: 'ai-edit-modified-gutter',
            glyphMarginClassName: 'ai-edit-modified-gutter'
          }
        }]);
        showReviewBanner(snapshot || currentReview);
        revealFirstChange(model, firstLine);
      };

      function scheduleWorkspaceReload(preferredPath) {
        const dirtyTabs = Array.from(document.querySelectorAll('#tab-bar .tab')).filter((tab) => {
          const dot = tab.querySelector('.dirty-dot');
          return dot && dot.style.display !== 'none';
        });
        if (dirtyTabs.length && !window.confirm(
          `Refreshing the editor will discard unsaved changes in ${dirtyTabs.length} ` +
          `${dirtyTabs.length === 1 ? 'file' : 'files'}. Continue?`
        )) {
          if (currentReview) {
            showReviewBanner(currentReview, 'Workspace refresh paused to preserve unsaved changes');
          }
          return false;
        }
        if (preferredPath) {
          try { sessionStorage.setItem('pending_ai_review_path', preferredPath); } catch (error) { }
        }
        if (workspaceReloadScheduled) return true;
        workspaceReloadScheduled = true;
        setTimeout(() => window.location.reload(), 60);
        return true;
      }

      function reviewIsCurrent(snapshot, generation) {
        return generation === renderGeneration && currentReview && snapshot &&
          currentReview.revision === snapshot.revision &&
          normalizePath(currentReview.path) === normalizePath(snapshot.path);
      }

      window.reloadActiveFileWithDiff = async function (filePath) {
        const api = bridgeApi();
        if (!api || !api.consume_ai_edit_snapshot || !filePath) return;
        if (currentReview &&
            normalizePath(currentReview.path) !== normalizePath(filePath) &&
            !resolvingReview) {
          showReviewBanner(currentReview, 'Another AI-edited file is queued');
          return;
        }
        const generation = ++renderGeneration;
        let snapshot = null;
        setReviewButtonsDisabled(true);
        try {
          while (tabInteractionLocked) await pause(20);
          if (generation !== renderGeneration) return;
          snapshot = await api.consume_ai_edit_snapshot(filePath) || {};
          if (generation !== renderGeneration || !snapshot.path) return;
          currentReview = snapshot;
          currentReviewModel = null;
          showReviewBanner(snapshot);

          let model = await activateAndResolveModel(snapshot.path, 1500);
          if (!reviewIsCurrent(snapshot, generation)) return;

          if (!model && snapshot.afterExists !== false) {
            // A newly-created source is not in the bundle's tab list yet.
            // The Python review survives this reload and will resume below.
            let alreadyReloaded = false;
            try {
              alreadyReloaded = normalizePath(
                sessionStorage.getItem('ai_review_reload_attempted') || ''
              ) === normalizePath(snapshot.path);
              if (!alreadyReloaded) {
                sessionStorage.setItem('ai_review_reload_attempted', snapshot.path);
              }
            } catch (error) { }
            if (alreadyReloaded) {
              showReviewBanner(snapshot, 'File is outside the open editor tabs');
              return;
            }
            scheduleWorkspaceReload(snapshot.path);
            return;
          }

          if (model) {
            try {
              if (normalizePath(sessionStorage.getItem('ai_review_reload_attempted') || '') ===
                  normalizePath(snapshot.path)) {
                sessionStorage.removeItem('ai_review_reload_attempted');
              }
            } catch (error) { }
          }

          if (model && snapshot.afterExists !== false) {
            const currentText = model.getValue();
            if (modelHasUnsavedChanges(snapshot.path, model) &&
                currentText !== String(snapshot.content || '')) {
              currentReviewModel = model;
              showReviewBanner(
                snapshot,
                'Unsaved editor changes conflict; either decision will ask before discarding them'
              );
              return;
            }
            if (currentText !== String(snapshot.content || '')) {
              await reloadThroughBundle(snapshot.path);
              if (!reviewIsCurrent(snapshot, generation)) return;
              model = await activateAndResolveModel(snapshot.path, 500);
            }
          }
          if (!reviewIsCurrent(snapshot, generation)) return;

          currentReviewModel = model;
          if (model) {
            const modelContent = model.getValue();
            window.lastKnownFileContents = window.lastKnownFileContents || {};
            window.lastKnownFileContents[normalizePath(snapshot.path)] = modelContent;
            if (snapshot.diff) {
              window.applyStructuredAiDiff(snapshot.diff, model, snapshot);
            } else {
              window.applyAiDiffHighlights(
                snapshot.beforeContent || '', modelContent, model, snapshot
              );
            }
          } else {
            // Deleted files have no model after a full workspace reload, but
            // remain fully reviewable and reversible from the banner.
            showReviewBanner(snapshot, 'File deleted');
          }
        } catch (error) {
          console.error('reloadActiveFileWithDiff error:', error);
          if (currentReview) showReviewBanner(currentReview, `Review error: ${error}`);
        } finally {
          if (reviewIsCurrent(snapshot, generation) && !resolvingReview) {
            setReviewButtonsDisabled(false);
          }
        }
      };

      async function resolveCurrentReview(accept) {
        if (resolvingReview || !currentReview) return;
        const api = bridgeApi();
        if (!api || (accept && !api.accept_ai_edit) || (!accept && !api.reject_ai_edit)) return;
        const reviewAtClick = currentReview;
        const modelAtClick = currentReviewModel;
        const modelDiverged = !!(
          modelAtClick && modelAtClick.getValue() !== String(reviewAtClick.content || '')
        );
        if (modelDiverged && !window.confirm(
          accept
            ? 'Accept the AI edit and discard the conflicting unsaved editor changes?'
            : 'Reject the AI edit and discard the conflicting unsaved editor changes?'
        )) {
          return;
        }
        renderGeneration += 1;
        resolvingReview = true;
        setReviewButtonsDisabled(true);
        showReviewBanner(currentReview, accept ? 'Accepting…' : 'Restoring original…');
        try {
          const result = accept
            ? await api.accept_ai_edit(reviewAtClick.path, reviewAtClick.revision)
            : await api.reject_ai_edit(reviewAtClick.path, reviewAtClick.revision);
          if (!result || !result.success) {
            const clickedStillCurrent = currentReview &&
              currentReview.revision === reviewAtClick.revision &&
              normalizePath(currentReview.path) === normalizePath(reviewAtClick.path);
            if (!clickedStillCurrent) {
              if (currentReview && currentReview.path) {
                await window.reloadActiveFileWithDiff(currentReview.path);
              } else {
                const reviews = api.get_ai_edit_reviews
                  ? await api.get_ai_edit_reviews() || [] : [];
                if (reviews.length) {
                  await window.reloadActiveFileWithDiff(reviews[0].path);
                } else {
                  const banner = document.getElementById('ai-diff-banner');
                  if (banner) banner.style.display = 'none';
                  restoreGlyphMargin();
                }
              }
              return;
            }
            const latest = result && result.snapshot;
            if (latest && latest.revision !== reviewAtClick.revision) {
              await window.reloadActiveFileWithDiff(latest.path || reviewAtClick.path);
            } else {
              showReviewBanner(reviewAtClick, (result && result.error) || 'Review could not be resolved.');
            }
            return;
          }

          const clickedStillCurrent = currentReview &&
            currentReview.revision === reviewAtClick.revision &&
            normalizePath(currentReview.path) === normalizePath(reviewAtClick.path);
          const workspaceShapeChanged = (
            !accept && Boolean(reviewAtClick.beforeExists) !== Boolean(reviewAtClick.afterExists)
          ) || (accept && reviewAtClick.afterExists === false);
          if (!clickedStillCurrent) {
            // A watcher callback may have installed a newer review while this
            // decision was crossing the Python bridge. The older response must
            // never clear or hide that newer authoritative review.
            const reviews = api.get_ai_edit_reviews
              ? await api.get_ai_edit_reviews() || [] : [];
            const activeRevision = currentReview && currentReview.revision;
            const activePath = currentReview && normalizePath(currentReview.path);
            const nextReview = reviews.find((review) =>
              review.revision === activeRevision && normalizePath(review.path) === activePath
            ) || reviews[0] || null;
            if (workspaceShapeChanged) {
              scheduleWorkspaceReload(nextReview ? nextReview.path : '');
            } else if (nextReview) {
              await window.reloadActiveFileWithDiff(nextReview.path);
            } else {
              currentReview = null;
              currentReviewModel = null;
              const banner = document.getElementById('ai-diff-banner');
              if (banner) banner.style.display = 'none';
              restoreGlyphMargin();
            }
            return;
          }

          window.clearAiDiffHighlights();
          currentReview = null;
          currentReviewModel = null;
          if (workspaceShapeChanged) {
            scheduleWorkspaceReload(result.nextPath || '');
            return;
          }
          if (!accept || modelDiverged) {
            const restoredModel = await activateAndResolveModel(reviewAtClick.path, 600);
            if (restoredModel) await reloadThroughBundle(reviewAtClick.path);
          }
          if (result.nextPath) {
            await window.reloadActiveFileWithDiff(result.nextPath);
          } else {
            const banner = document.getElementById('ai-diff-banner');
            if (banner) banner.style.display = 'none';
            restoreGlyphMargin();
          }
        } catch (error) {
          console.error('AI review decision error:', error);
          const clickedStillCurrent = currentReview &&
            currentReview.revision === reviewAtClick.revision &&
            normalizePath(currentReview.path) === normalizePath(reviewAtClick.path);
          if (clickedStillCurrent) {
            currentReviewModel = modelAtClick;
            showReviewBanner(reviewAtClick, `Decision failed: ${error}`);
          } else {
            // A watcher cancellation may have cleared this review while the
            // Python bridge promise was in flight. Never resurrect that stale
            // review after the bridge reports an exception; resume from the
            // backend's authoritative pending queue instead.
            try {
              const reviews = api.get_ai_edit_reviews
                ? await api.get_ai_edit_reviews() || [] : [];
              currentReview = null;
              currentReviewModel = null;
              if (reviews.length) {
                await window.reloadActiveFileWithDiff(reviews[0].path);
              } else {
                const banner = document.getElementById('ai-diff-banner');
                if (banner) banner.style.display = 'none';
                restoreGlyphMargin();
              }
            } catch (refreshError) {

              currentReviewModel = null;
              const banner = document.getElementById('ai-diff-banner');
              if (banner) banner.style.display = 'none';
              restoreGlyphMargin();
            }
          }
        } finally {
          resolvingReview = false;
          if (deferredReviewCancellations.length) {
            const deferred = deferredReviewCancellations;
            deferredReviewCancellations = [];
            for (const cancellation of deferred) {
              try {
                await recoverCancelledReview(cancellation);
              } catch (recoveryError) {

      async function recoverCancelledReview(cancellation) {
        const path = cancellation.path;
        const afterExists = cancellation.afterExists;
        const cancelledReview = cancellation.review;
        const cancelledModel = cancellation.model;
        const api = bridgeApi();
        const reviews = api && api.get_ai_edit_reviews
          ? await api.get_ai_edit_reviews() || [] : [];
        const nextPath = currentReview && currentReview.path
          ? currentReview.path : (reviews[0] && reviews[0].path) || '';
        const workspaceShapeChanged = !afterExists || !!(
          cancelledReview &&
          Boolean(cancelledReview.afterExists) !== Boolean(afterExists)
        );
        const hasDivergentBuffer = !!(
          cancelledReview && cancelledModel &&
          cancelledModel.getValue() !== String(cancelledReview.content || '')
        );
        if (workspaceShapeChanged && !hasDivergentBuffer) {
          scheduleWorkspaceReload(nextPath);
          return;
        }

        // A net-zero A -> B -> A edit removes the backend review. Reload the
        // clean Monaco model so B cannot remain visible and later be saved as
        // an unreviewed user edit. Preserve a genuinely divergent user buffer.
        if (afterExists && !hasDivergentBuffer && tabForPath(path)) {
          const model = await activateAndResolveModel(path, 500);
          if (model && !modelHasUnsavedChanges(path, model)) {

          if (banner) banner.style.display = 'none';
          restoreGlyphMargin();

          currentReview = null;

        if (!model || !position) return false;
        const lineText = model.getLineContent(position.lineNumber) || '';

        const textBefore = lineText.substring(0, col);

        if (commentIdx !== -1) return true;

        const openBlock = textBefore.lastIndexOf('/*');
        const closeBlock = textBefore.lastIndexOf('*/');

        for (let i = 0; i < lineText.length && i < col; i++) {
