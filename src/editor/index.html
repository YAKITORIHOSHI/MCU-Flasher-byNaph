<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>MCU Flasher — Embedded Code Editor</title>
  <style>
    :root, body.theme-default {
      --bg-darkest: #151922;
      --bg-dark: #0f121a;
      --bg-tab-hover: #171c28;
      --border: #222938;
      --border-tab: #1c212e;
      --text: #abb2bf;
      --text-dim: #7f8c8d;
      --accent: #00d2ff;
      --dirty-dot: #ff9f00;
    }

    body.theme-light {
      --bg-darkest: #ffffff;
      --bg-dark: #f0f2f5;
      --bg-tab-hover: #e4e7eb;
      --border: #d0d7de;
      --border-tab: #d8dee4;
      --text: #24292f;
      --text-dim: #57606a;
      --accent: #0969da;
      --dirty-dot: #bc4c00;
    }

    body.theme-solarized-dark {
      --bg-darkest: #002b36;
      --bg-dark: #00212b;
      --bg-tab-hover: #073642;
      --border: #073642;
      --border-tab: #094250;
      --text: #e0e6ed;
      --text-dim: #8fa1b3;
      --accent: #39c5bb;
      --dirty-dot: #b58900;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-darkest);
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #tab-bar {
      display: flex;
      align-items: center;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
      height: 35px;
      box-sizing: border-box;
    }

    #detached-action-bar {
      display: none;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 5px 8px;
      box-sizing: border-box;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    #detached-action-bar.visible {
      display: flex;
    }

    #detached-action-bar .toolbar-label {
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 700;
      margin-right: 3px;
    }

    #detached-action-bar .toolbar-divider {
      width: 2px;
      height: 22px;
      margin: 0 5px;
      flex: 0 0 auto;
      background: var(--border);
    }

    #detached-action-bar button {
      color: #f4f7fb;
      border: 0;
      padding: 5px 10px;
      font: 600 11px 'Montserrat', 'Segoe UI', sans-serif;
      cursor: pointer;
    }

    #detached-action-bar button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      pointer-events: none;
      filter: grayscale(0.5);
    }

    #detached-action-bar button:hover {
      filter: brightness(1.18);
    }

    #detached-action-bar .compile {
      background: #2d7d46;
    }

    #detached-action-bar .upload {
      background: #2077b0;
    }

    #detached-action-bar .stop {
      background: #a03030;
    }

    #detached-action-bar .clean,
    #detached-action-bar .reload {
      background: #3a4555;
    }

    #detached-action-bar .save {
      background: #2d7d46;
    }

    #detached-action-bar .save-all {
      background: #8244a0;
    }

    #detached-action-bar .modify {
      background: #1a7a70;
    }

    #tab-bar::-webkit-scrollbar {
      height: 3px;
    }

    #tab-bar::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }

    #tab-bar::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      height: 100%;
      background: var(--bg-dark);
      border-right: 1px solid var(--border-tab);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      user-select: none;
      color: var(--text-dim);
      box-sizing: border-box;
      position: relative;
      transition: all 0.2s ease;
    }

    .tab:hover {
      background: var(--bg-tab-hover);
      color: var(--text);
    }

    .tab.active {
      background: var(--bg-darkest);
      color: var(--accent);
      font-weight: 600;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
    }

    .tab .dirty-dot {
      width: 6px;
      height: 6px;
      background: var(--dirty-dot);
      border-radius: 50%;
      display: inline-block;
    }

    #editor-container {
      flex: 1;
      position: relative;
      background: var(--bg-darkest);
    }

    #monaco-anchor {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .monaco-editor .decorationsOverviewRuler {
      display: none !important;
    }

    .monaco-definition-link {
      color: #00d2ff !important;
      cursor: pointer !important;
      text-decoration: underline !important;
      text-decoration-color: #00d2ff !important;
      text-underline-offset: 2px;
    }

    #definition-hover-card {
      display: none;
      position: fixed;
      z-index: 10000;
      max-width: 460px;
      padding: 8px 10px;
      border: 1px solid #00d2ff;
      border-radius: 5px;
      background: #101722;
      color: #dce5ef;
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.38);
      font: 12px/1.45 'Consolas', 'Courier New', monospace;
      pointer-events: none;
      transform: translateY(-100%);
    }

    #definition-hover-card .symbol-kind {
      margin-bottom: 3px;
      color: #00d2ff;
      font: 700 11px 'Montserrat', 'Segoe UI', sans-serif;
      text-transform: uppercase;
    }

    #definition-hover-card .signature,
    #definition-hover-card .symbol-detail {
      margin-top: 3px;
    }

    #definition-hover-card strong {
      color: #7fdbff;
    }

    .tab.dragging {
      opacity: 0.5;
    }

    /* Custom VS Code style floating hover container widget */
    #monaco-custom-hover-card {
      position: fixed;
      z-index: 99999;
      display: none;
      background: #1e2430;
      border: 1px solid #323b4d;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      padding: 10px 14px;
      max-width: 450px;
      font-family: 'Consolas', 'Menlo', 'Courier New', monospace;
      font-size: 12px;
      color: #abb2bf;
      pointer-events: none;
      transition: opacity 0.15s ease-in-out;
    }

    #monaco-custom-hover-card .hover-title {
      color: #61afef;
      font-weight: bold;
      font-size: 13px;
    }

    #monaco-custom-hover-card .hover-kind {
      color: #e06c75;
      font-style: italic;
    }

    #monaco-custom-hover-card .hover-proto {
      color: #98c379;
      background: #161b24;
      padding: 4px 8px;
      border-radius: 4px;
      margin: 6px 0;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #monaco-custom-hover-card .hover-detail {
      margin-top: 4px;
      color: #c8d3df;
      word-break: break-word;
    }

    #monaco-custom-hover-card strong {
      color: #7fdbff;
    }

    #monaco-custom-hover-card .hover-link {
      color: #00d2ff;
      margin-top: 6px;
      font-size: 11px;
      cursor: pointer;
      display: inline-block;
      text-decoration: underline;
    }

    #monaco-custom-hover-card .hover-link:hover {
      color: #66e2ff;
    }

    /* AI Edits Glow & Diff Highlighting Styles */
    .monaco-editor .ai-edit-added-line,
    .ai-edit-added-line {
      background-color: rgba(46, 160, 67, 0.42) !important;
      border-left: 5px solid #3fb950 !important;
      box-shadow: inset 0 0 12px rgba(46, 160, 67, 0.50) !important;
      animation: greenGlowPulse 0.9s ease-in-out infinite alternate !important;
    }

    .monaco-editor .ai-edit-removed-line,
    .ai-edit-removed-line {
      background-color: rgba(248, 81, 73, 0.42) !important;
      border-left: 5px solid #f85149 !important;
      box-shadow: inset 0 0 12px rgba(248, 81, 73, 0.50) !important;
      animation: redGlowPulse 0.9s ease-in-out infinite alternate !important;
    }

    .monaco-editor .ai-edit-modified-line,
    .ai-edit-modified-line {
      background-color: rgba(56, 139, 253, 0.36) !important;
      border-left: 5px solid #58a6ff !important;
      box-shadow: inset 0 0 12px rgba(56, 139, 253, 0.48) !important;
      animation: blueGlowPulse 0.9s ease-in-out infinite alternate !important;
    }

    .monaco-editor .ai-edit-added-inline,
    .ai-edit-added-inline {
      background-color: rgba(46, 160, 67, 0.45) !important;
      color: #aff5b4 !important;
      border-radius: 3px !important;
    }

    .monaco-editor .ai-edit-removed-inline,
    .ai-edit-removed-inline {
      background-color: rgba(248, 81, 73, 0.45) !important;
      color: #ffdcd7 !important;
      border-radius: 3px !important;
    }

    .monaco-editor .ai-edit-modified-inline,
    .ai-edit-modified-inline {
      background-color: rgba(56, 139, 253, 0.45) !important;
      color: #dbeeff !important;
      border-radius: 3px !important;
    }

    .ai-edit-added-gutter::before {
      content: '+';
      color: #3fb950;
      font-weight: bold;
      font-size: 14px;
      margin-left: 3px;
    }

    .ai-edit-removed-gutter::before {
      content: '-';
      color: #f85149;
      font-weight: bold;
      font-size: 14px;
      margin-left: 3px;
    }

    .ai-edit-modified-gutter::before {
      content: '~';
      color: #58a6ff;
      font-weight: bold;
      font-size: 14px;
      margin-left: 3px;
    }

    @keyframes greenGlowPulse {
      0% {
        background-color: rgba(46, 160, 67, 0.20) !important;
        box-shadow: inset 0 0 6px rgba(46, 160, 67, 0.25) !important;
      }

      100% {
        background-color: rgba(46, 160, 67, 0.40) !important;
        box-shadow: inset 0 0 18px rgba(46, 160, 67, 0.65) !important;
      }
    }

    @keyframes redGlowPulse {
      0% {
        background-color: rgba(248, 81, 73, 0.20) !important;
        box-shadow: inset 0 0 6px rgba(248, 81, 73, 0.25) !important;
      }

      100% {
        background-color: rgba(248, 81, 73, 0.40) !important;
        box-shadow: inset 0 0 18px rgba(248, 81, 73, 0.65) !important;
      }
    }

    @keyframes blueGlowPulse {
      0% {
        background-color: rgba(56, 139, 253, 0.22) !important;
        box-shadow: inset 0 0 6px rgba(56, 139, 253, 0.28) !important;
      }

      100% {
        background-color: rgba(56, 139, 253, 0.46) !important;
        box-shadow: inset 0 0 18px rgba(56, 139, 253, 0.68) !important;
      }
    }

    #ai-diff-banner {
      position: absolute;
      bottom: 16px;
      left: 50%;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(21, 25, 34, 0.95);
      border: 1px solid #2ea043;
      border-radius: 6px;
      padding: 6px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(46, 160, 67, 0.3);
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      font-size: 12px;
      color: #e6edf3;
      backdrop-filter: blur(8px);
      animation: bannerSlideIn 0.3s ease-out;
      transform: translateX(-50%);
      width: max-content;
      max-width: min(calc(100% - 32px), 760px);
      box-sizing: border-box;
    }

    #ai-diff-banner .review-title {
      color: #00d2ff;
      font-weight: 700;
      white-space: nowrap;
    }

    #ai-diff-banner .review-file {
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #f0f6fc;
      font-weight: 600;
    }

    #ai-diff-banner .review-position {
      color: #8b949e;
      white-space: nowrap;
    }

    #ai-diff-banner .review-message {
      color: #f2cc60;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #ai-diff-banner .review-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 2px;
    }

    #ai-diff-banner .diff-badge-add {
      background: rgba(46, 160, 67, 0.25);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.6);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 11px;
    }

    #ai-diff-banner .diff-badge-remove {
      background: rgba(248, 81, 73, 0.25);
      color: #f85149;
      border: 1px solid rgba(248, 81, 73, 0.6);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 11px;
    }

    #ai-diff-banner .diff-badge-modify {
      background: rgba(56, 139, 253, 0.2);
      color: #58a6ff;
      border: 1px solid rgba(56, 139, 253, 0.55);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 11px;
    }

    #ai-diff-banner .review-btn {
      background: #21262d;
      color: #abb2bf;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    #ai-diff-banner .review-btn:hover:not(:disabled) {
      background: #30363d;
      color: #ffffff;
      border-color: #00d2ff;
    }

    #ai-diff-banner .review-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    #ai-diff-banner .review-btn.reject {
      color: #ffb4ae;
      border-color: rgba(248, 81, 73, 0.7);
    }

    #ai-diff-banner .review-btn.reject:hover:not(:disabled) {
      background: rgba(248, 81, 73, 0.22);
      border-color: #f85149;
    }

    #ai-diff-banner .review-btn.accept {
      color: #ffffff;
      background: #238636;
      border-color: #2ea043;
      font-weight: 700;
    }

    #ai-diff-banner .review-btn.accept:hover:not(:disabled) {
      background: #2ea043;
      border-color: #3fb950;
    }

    #ai-diff-banner .review-btn.undo {
      color: #ffffff;
      background: #1f6feb;
      border-color: #388bfd;
      font-weight: 700;
    }

    #ai-diff-banner .review-btn.undo:hover:not(:disabled) {
      background: #388bfd;
      border-color: #58a6ff;
    }

    #ai-diff-banner .review-btn.redo {
      color: #d2a8ff;
      border-color: rgba(163, 113, 247, 0.75);
    }

    #ai-diff-banner .review-btn.redo:hover:not(:disabled) {
      background: rgba(163, 113, 247, 0.22);
      border-color: #a371f7;
    }

    @media (max-width: 700px) {
      #ai-diff-banner {
        left: 8px;
        right: 8px;
        bottom: 8px;
        top: auto;
        transform: none;
        animation-name: bannerSlideInMobile;
        width: auto;
        gap: 6px;
        padding: 5px 7px;
        flex-wrap: wrap;
        font-size: 11px;
        max-width: none;
      }

      #ai-diff-banner .review-file,
      #ai-diff-banner .review-message {
        max-width: calc(100vw - 145px);
      }

      #ai-diff-banner .review-actions {
        margin-left: 0;
      }

      #detached-action-bar button {
        padding: 5px 7px;
      }
    }

    @keyframes bannerSlideIn {
      from {
        transform: translate(-50%, 12px);
        opacity: 0;
      }

      to {
        transform: translate(-50%, 0);
        opacity: 1;
      }
    }

    @keyframes bannerSlideInMobile {
      from {
        transform: translateY(12px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div id="app-container">
    <div id="detached-action-bar" aria-label="Detached editor actions">
      <span class="toolbar-label">ACTIONS</span>
      <button class="compile" data-action="compile">Compile</button>
      <button class="upload" data-action="upload">Upload</button>
      <button class="stop" data-action="stop">Stop</button>
      <button class="clean" data-action="clean">Clean</button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button class="save" data-action="save">Save</button>
      <button class="save-all" data-action="save_all">Save All</button>
      <button class="reload" data-action="reload">Reload</button>
      <button class="modify" data-action="modify">Modify</button>
    </div>
    <div id="tab-bar"></div>
    <div id="editor-container">
      <div id="monaco-anchor"></div>
      <div id="ai-diff-banner" role="region" aria-live="polite" aria-label="AI edit review">
        <span id="ai-review-title" class="review-title">🤖 AI Review</span>
        <span id="ai-review-file" class="review-file"></span>
        <span id="ai-review-position" class="review-position"></span>
        <span id="ai-diff-add-count" class="diff-badge-add">+0 added</span>
        <span id="ai-diff-modify-count" class="diff-badge-modify">~0 changed</span>
        <span id="ai-diff-remove-count" class="diff-badge-remove">-0 removed</span>
        <span id="ai-review-message" class="review-message"></span>
        <span class="review-actions">
          <button id="ai-review-reject" class="review-btn reject" type="button">Reject</button>
          <button id="ai-review-accept" class="review-btn accept" type="button">Accept</button>
          <button id="ai-history-undo" class="review-btn undo" type="button" style="display:none">Undo AI</button>
          <button id="ai-history-redo" class="review-btn redo" type="button" style="display:none">Redo AI</button>
          <button id="ai-history-close" class="review-btn close-banner" type="button" style="display:none" aria-label="Close AI history banner" title="Close">✕</button>
        </span>
      </div>
    </div>
    <div id="definition-hover-card" role="tooltip"></div>
  </div>

  <!-- Expose Monaco globally so themes and models can be managed dynamically -->
  <script>
    window.MonacoEnvironment = { globalAPI: true };
  </script>
  <!-- Local, C++-only trimmed Monaco bundle. No CDN / network dependency. -->
  <script src="bundle.js"></script>
  <script>
    (function () {
      // The page loads the project once at DOMContentLoaded, while the host
      // may request a refresh at the same time when the project is attached.
      // Coalesce host-triggered reloads so two async loads cannot materialize
      // the same file twice in the tab bar.
      let projectLoadInFlight = null;
      const originalLoadProject = window.loadProject;
      window.safeLoadProject = function () {
        if (projectLoadInFlight) return projectLoadInFlight;
        if (typeof originalLoadProject !== 'function') return Promise.resolve();
        projectLoadInFlight = Promise.resolve(originalLoadProject())
          .finally(() => { projectLoadInFlight = null; });
        return projectLoadInFlight;
      };

      function dedupeProjectTabs() {
        const seen = new Set();
        document.querySelectorAll('#tab-bar .tab').forEach((tab) => {
          const rawKey = tab._filePath || tab.getAttribute('data-file-path') || tab.id;
          const key = String(rawKey || '').replace(/\\/g, '/').toLowerCase();
          if (!key || !seen.has(key)) {
            if (key) seen.add(key);
            return;
          }
          if (tab.classList.contains('active')) {
            const first = document.querySelector('#tab-bar .tab');
            if (first && first !== tab) first.click();
          }
          tab.remove();
        });
      }

      const projectTabBar = document.getElementById('tab-bar');
      if (projectTabBar) {
        new MutationObserver(dedupeProjectTabs).observe(projectTabBar, { childList: true });
      }

      const bar = document.getElementById('detached-action-bar');
      window.setDetachedActionBar = function (visible) {
        bar.classList.toggle('visible', !!visible);
        if (window.editorInstance) window.editorInstance.layout();
      };
      window.setDetachedButtonStates = function (states) {
        if (!bar || !states) return;
        Object.keys(states).forEach(action => {
          const btn = bar.querySelector(`button[data-action="${action}"]`);
          if (btn) {
            btn.disabled = !states[action];
          }
        });
      };
      bar.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button || button.disabled || !window.pywebview || !window.pywebview.api) return;
        try {
          await window.pywebview.api.run_action(button.dataset.action);
        } catch (e) {
          console.error("Detached action error:", e);
        }
      });
    })();

    (function () {
      let fileList = [];

      let syncInFlight = null;
      function syncTabPaths() {
        if (syncInFlight) return syncInFlight;
        if (!window.pywebview || !window.pywebview.api ||
            !window.pywebview.api.get_project_files) {
          return Promise.resolve([]);
        }
        syncInFlight = window.pywebview.api.get_project_files()
          .then((files) => {
            fileList = Array.isArray(files) ? files : [];
            window.projectFileList = fileList;
            const tabs = Array.from(document.querySelectorAll('#tab-bar .tab'));
            const validPaths = new Set(fileList.map((file) =>
              String(file.path || '').replace(/\\/g, '/').toLowerCase()
            ));
            const mappedPaths = tabs.map((tab) =>
              String(tab._filePath || '').replace(/\\/g, '/').toLowerCase()
            );
            const needsFullMap = mappedPaths.some((path) => !path || !validPaths.has(path)) ||
              new Set(mappedPaths.filter(Boolean)).size !== mappedPaths.filter(Boolean).length;

            // Bundle tab IDs are sanitized and can collide. The bundle creates
            // tabs in exactly get_project_files() order, so a stateless index
            // map is collision-free during initial/incremental construction.
            // Once every tab has a unique path, preserve it across drag moves.
            if (needsFullMap) {
              tabs.forEach((tab, index) => {
                const file = fileList[index];
                if (!file) return;
                tab._filePath = file.path;
                tab.setAttribute('data-file-path', file.path);
                tab.setAttribute('draggable', 'true');
              });
            } else {
              tabs.forEach((tab) => tab.setAttribute('draggable', 'true'));
            }
            dedupeProjectTabs();
            return fileList;
          })
          .catch((error) => {
            console.error('Could not map editor tabs to project files:', error);
            return [];
          })

    (function () {

      window.setEditorMarkers = function (errorsJsonStr) {
        if (!window.editorInstance) return;
        const model = window.editorInstance.getModel();
        if (!model) return;
        try {
          const errors = JSON.parse(errorsJsonStr);
          const markers = errors.map(err => {
            const lineContent = model.getLineContent(err.line) || "";
            let endCol = err.col + 1;
            if (err.col - 1 < lineContent.length) {
              let idx = err.col - 1;
              while (idx < lineContent.length && /\w/.test(lineContent[idx])) {
                idx++;

              endCol = Math.max(err.col + 1, idx + 1);

            return {
              severity: err.severity === 'error' ? monaco.MarkerSeverity.Error : monaco.MarkerSeverity.Warning,

              startColumn: err.col,

          return;

        if (!model) return;

        const activeTab = document.querySelector('.tab.active');
        const filePath = activeTab ? activeTab._filePath : "";
        if (!filePath) return;

        if (!filePath.endsWith('.ino') && !filePath.endsWith('.cpp') && !filePath.endsWith('.h')) {

      function syncModelLanguageForActiveTab() {
        if (!window.editorInstance || typeof monaco === 'undefined' || !monaco.editor) return;
        const activeTab = document.querySelector('#tab-bar .tab.active');
        const activePath = activeTab ? activeTab._filePath : "";
        if (!activePath) return;

        const model = window.editorInstance.getModel();
        if (!model) return;

        const ext = activePath.split('.').pop().toLowerCase();
        let targetLang = 'cpp';
        if (ext === 'txt') {
          targetLang = 'plaintext';
        } else if (ext === 'md') {
          targetLang = 'markdown';
        } else if (ext === 'json') {
          targetLang = 'json';
        } else if (ext === 'py') {
          targetLang = 'python';
        } else if (ext === 'js') {
          targetLang = 'javascript';
        } else if (ext === 'ini') {
          targetLang = 'ini';
        } else if (['ino', 'cpp', 'c', 'h', 'hpp'].includes(ext)) {

    (function () {

      async function refreshAiHistoryBanner(message) {
        if (currentReview || resolvingReview) return null;
        const api = bridgeApi();

        try {

          const redoButton = document.getElementById('ai-history-redo');

          });
        }
        replaceDecorations(model, decorations);
        showReviewBanner(snapshot || currentReview);
        revealFirstChange(model, diff.firstLine);
      };

      window.applyAiDiffHighlights = function (oldContent, newContent, model, snapshot) {
        if (!model || oldContent === newContent) {
          if (model) clearDecorations(model);
          showReviewBanner(snapshot || currentReview);
          return;
        }
        const oldLines = String(oldContent || '').split(/\r?\n/);
        const newLines = String(newContent || '').split(/\r?\n/);
        let prefix = 0;
        const limit = Math.min(oldLines.length, newLines.length);
        while (prefix < limit && oldLines[prefix] === newLines[prefix]) prefix++;
        const firstLine = Math.min(Math.max(1, prefix + 1), model.getLineCount());
        replaceDecorations(model, [{
          range: new monaco.Range(firstLine, 1, model.getLineCount(), model.getLineMaxColumn(model.getLineCount())),
          options: {
            isWholeLine: true,
            className: 'ai-edit-modified-line',
            inlineClassName: 'ai-edit-modified-inline',
            linesDecorationsClassName: 'ai-edit-modified-gutter',
            glyphMarginClassName: 'ai-edit-modified-gutter'
          }
        }]);
        showReviewBanner(snapshot || currentReview);
        revealFirstChange(model, firstLine);
      };

      function scheduleWorkspaceReload(preferredPath) {
        const dirtyTabs = Array.from(document.querySelectorAll('#tab-bar .tab')).filter((tab) => {
          const dot = tab.querySelector('.dirty-dot');
          return dot && dot.style.display !== 'none';
        });
        if (dirtyTabs.length && !window.confirm(
          `Refreshing the editor will discard unsaved changes in ${dirtyTabs.length} ` +
          `${dirtyTabs.length === 1 ? 'file' : 'files'}. Continue?`
        )) {
          if (currentReview) {
            showReviewBanner(currentReview, 'Workspace refresh paused to preserve unsaved changes');
          }
          return false;
        }
        if (preferredPath) {
          try { sessionStorage.setItem('pending_ai_review_path', preferredPath); } catch (error) { }
        }
        if (workspaceReloadScheduled) return true;
        workspaceReloadScheduled = true;
        setTimeout(() => window.location.reload(), 60);
        return true;
      }

      function reviewIsCurrent(snapshot, generation) {
        return generation === renderGeneration && currentReview && snapshot &&
          currentReview.revision === snapshot.revision &&
          normalizePath(currentReview.path) === normalizePath(snapshot.path);
      }

      window.reloadActiveFileWithDiff = async function (filePath) {
        const api = bridgeApi();
        if (!api || !api.consume_ai_edit_snapshot || !filePath) return;
        if (currentReview &&
            normalizePath(currentReview.path) !== normalizePath(filePath) &&
            !resolvingReview) {
          showReviewBanner(currentReview, 'Another AI-edited file is queued');
          return;
        }
        const generation = ++renderGeneration;
        let snapshot = null;
        setReviewButtonsDisabled(true);
        try {
          while (tabInteractionLocked) await pause(20);
          if (generation !== renderGeneration) return;
          snapshot = await api.consume_ai_edit_snapshot(filePath) || {};
          if (generation !== renderGeneration || !snapshot.path) return;
          currentReview = snapshot;
          currentReviewModel = null;
          showReviewBanner(snapshot);

          let model = await activateAndResolveModel(snapshot.path, 1500);
          if (!reviewIsCurrent(snapshot, generation)) return;

          if (!model && snapshot.afterExists !== false) {
            // A newly-created source is not in the bundle's tab list yet.
            // The Python review survives this reload and will resume below.
            let alreadyReloaded = false;
            try {
              alreadyReloaded = normalizePath(
                sessionStorage.getItem('ai_review_reload_attempted') || ''
              ) === normalizePath(snapshot.path);
              if (!alreadyReloaded) {
                sessionStorage.setItem('ai_review_reload_attempted', snapshot.path);
              }
            } catch (error) { }
            if (alreadyReloaded) {
              showReviewBanner(snapshot, 'File is outside the open editor tabs');
              return;
            }
            scheduleWorkspaceReload(snapshot.path);
            return;
          }

          if (model) {
            try {
              if (normalizePath(sessionStorage.getItem('ai_review_reload_attempted') || '') ===
                  normalizePath(snapshot.path)) {
                sessionStorage.removeItem('ai_review_reload_attempted');
              }
            } catch (error) { }
          }

          if (model && snapshot.afterExists !== false) {
            const currentText = model.getValue();
            if (modelHasUnsavedChanges(snapshot.path, model) &&
                currentText !== String(snapshot.content || '')) {
              currentReviewModel = model;
              showReviewBanner(
                snapshot,
                'Unsaved editor changes conflict; either decision will ask before discarding them'
              );
              return;
            }
            if (currentText !== String(snapshot.content || '')) {
              await reloadThroughBundle(snapshot.path);
              if (!reviewIsCurrent(snapshot, generation)) return;
              model = await activateAndResolveModel(snapshot.path, 500);
            }
          }
          if (!reviewIsCurrent(snapshot, generation)) return;

          currentReviewModel = model;
          if (model) {
            const modelContent = model.getValue();
            window.lastKnownFileContents = window.lastKnownFileContents || {};
            window.lastKnownFileContents[normalizePath(snapshot.path)] = modelContent;
            if (snapshot.diff) {
              window.applyStructuredAiDiff(snapshot.diff, model, snapshot);
            } else {
              window.applyAiDiffHighlights(
                snapshot.beforeContent || '', modelContent, model, snapshot
              );
            }
          } else {
            // Deleted files have no model after a full workspace reload, but
            // remain fully reviewable and reversible from the banner.
            showReviewBanner(snapshot, 'File deleted');
          }
        } catch (error) {
          console.error('reloadActiveFileWithDiff error:', error);
          if (currentReview) showReviewBanner(currentReview, `Review error: ${error}`);
        } finally {
          if (reviewIsCurrent(snapshot, generation) && !resolvingReview) {
            setReviewButtonsDisabled(false);
          }
        }
      };

      async function resolveCurrentReview(accept) {
        if (resolvingReview || !currentReview) return;
        const api = bridgeApi();
        if (!api || (accept && !api.accept_ai_edit) || (!accept && !api.reject_ai_edit)) return;
        const reviewAtClick = currentReview;
        const modelAtClick = currentReviewModel;
        const modelDiverged = !!(
          modelAtClick && modelAtClick.getValue() !== String(reviewAtClick.content || '')
        );
        if (modelDiverged && !window.confirm(
          accept
            ? 'Accept the AI edit and discard the conflicting unsaved editor changes?'
            : 'Reject the AI edit and discard the conflicting unsaved editor changes?'
        )) {
          return;
        }
        renderGeneration += 1;
        resolvingReview = true;
        setReviewButtonsDisabled(true);
        showReviewBanner(currentReview, accept ? 'Accepting…' : 'Restoring original…');
        try {
          const result = accept
            ? await api.accept_ai_edit(reviewAtClick.path, reviewAtClick.revision)
            : await api.reject_ai_edit(reviewAtClick.path, reviewAtClick.revision);
          if (!result || !result.success) {
            const clickedStillCurrent = currentReview &&
              currentReview.revision === reviewAtClick.revision &&
              normalizePath(currentReview.path) === normalizePath(reviewAtClick.path);
            if (!clickedStillCurrent) {
              if (currentReview && currentReview.path) {
                await window.reloadActiveFileWithDiff(currentReview.path);
              } else {
                const reviews = api.get_ai_edit_reviews
                  ? await api.get_ai_edit_reviews() || [] : [];
                if (reviews.length) {
                  await window.reloadActiveFileWithDiff(reviews[0].path);
                } else {
                  const banner = document.getElementById('ai-diff-banner');
                  if (banner) banner.style.display = 'none';
                  restoreGlyphMargin();
                }
              }
              return;
            }
            const latest = result && result.snapshot;
            if (latest && latest.revision !== reviewAtClick.revision) {
              await window.reloadActiveFileWithDiff(latest.path || reviewAtClick.path);
            } else {
              showReviewBanner(reviewAtClick, (result && result.error) || 'Review could not be resolved.');
            }
            return;
          }

          const clickedStillCurrent = currentReview &&
            currentReview.revision === reviewAtClick.revision &&
            normalizePath(currentReview.path) === normalizePath(reviewAtClick.path);
          const workspaceShapeChanged = (
            !accept && Boolean(reviewAtClick.beforeExists) !== Boolean(reviewAtClick.afterExists)
          ) || (accept && reviewAtClick.afterExists === false);
          if (!clickedStillCurrent) {
            // A watcher callback may have installed a newer review while this
            // decision was crossing the Python bridge. The older response must
            // never clear or hide that newer authoritative review.
            const reviews = api.get_ai_edit_reviews
              ? await api.get_ai_edit_reviews() || [] : [];
            const activeRevision = currentReview && currentReview.revision;
            const activePath = currentReview && normalizePath(currentReview.path);
            const nextReview = reviews.find((review) =>
              review.revision === activeRevision && normalizePath(review.path) === activePath
            ) || reviews[0] || null;
            if (workspaceShapeChanged) {
              scheduleWorkspaceReload(nextReview ? nextReview.path : '');
            } else if (nextReview) {
              await window.reloadActiveFileWithDiff(nextReview.path);
            } else {
              currentReview = null;
              currentReviewModel = null;
              const banner = document.getElementById('ai-diff-banner');
              if (banner) banner.style.display = 'none';
              restoreGlyphMargin();
            }
            return;
          }

          window.clearAiDiffHighlights();
          currentReview = null;
          currentReviewModel = null;
          if (workspaceShapeChanged) {
            scheduleWorkspaceReload(result.nextPath || '');
            return;
          }
          if (!accept || modelDiverged) {
            const restoredModel = await activateAndResolveModel(reviewAtClick.path, 600);
            if (restoredModel) await reloadThroughBundle(reviewAtClick.path);
          }
          if (result.nextPath) {
            await window.reloadActiveFileWithDiff(result.nextPath);
          } else {
            const banner = document.getElementById('ai-diff-banner');
            if (banner) banner.style.display = 'none';
            restoreGlyphMargin();
          }
        } catch (error) {
          console.error('AI review decision error:', error);
          const clickedStillCurrent = currentReview &&
            currentReview.revision === reviewAtClick.revision &&
            normalizePath(currentReview.path) === normalizePath(reviewAtClick.path);
          if (clickedStillCurrent) {
            currentReviewModel = modelAtClick;
            showReviewBanner(reviewAtClick, `Decision failed: ${error}`);
          } else {
            // A watcher cancellation may have cleared this review while the
            // Python bridge promise was in flight. Never resurrect that stale
            // review after the bridge reports an exception; resume from the
            // backend's authoritative pending queue instead.
            try {
              const reviews = api.get_ai_edit_reviews
                ? await api.get_ai_edit_reviews() || [] : [];
              currentReview = null;
              currentReviewModel = null;
              if (reviews.length) {
                await window.reloadActiveFileWithDiff(reviews[0].path);
              } else {
                const banner = document.getElementById('ai-diff-banner');
                if (banner) banner.style.display = 'none';
                restoreGlyphMargin();
              }
            } catch (refreshError) {
              console.error('AI review recovery error:', refreshError);
              currentReview = null;
              currentReviewModel = null;
              const banner = document.getElementById('ai-diff-banner');
              if (banner) banner.style.display = 'none';
              restoreGlyphMargin();
            }
          }
        } finally {
          resolvingReview = false;
          if (deferredReviewCancellations.length) {
            const deferred = deferredReviewCancellations;
            deferredReviewCancellations = [];
            for (const cancellation of deferred) {
              try {
                await recoverCancelledReview(cancellation);
              } catch (recoveryError) {
                console.error('Deferred AI cancellation recovery error:', recoveryError);
              }
            }
          }
          setReviewButtonsDisabled(!currentReview);
          if (!currentReview) await refreshAiHistoryBanner();
        }
      }

      async function recoverCancelledReview(cancellation) {
        const path = cancellation.path;
        const afterExists = cancellation.afterExists;
        const cancelledReview = cancellation.review;
        const cancelledModel = cancellation.model;
        const api = bridgeApi();
        const reviews = api && api.get_ai_edit_reviews
          ? await api.get_ai_edit_reviews() || [] : [];
        const nextPath = currentReview && currentReview.path
          ? currentReview.path : (reviews[0] && reviews[0].path) || '';
        const workspaceShapeChanged = !afterExists || !!(
          cancelledReview &&
          Boolean(cancelledReview.afterExists) !== Boolean(afterExists)
        );
        const hasDivergentBuffer = !!(
          cancelledReview && cancelledModel &&
          cancelledModel.getValue() !== String(cancelledReview.content || '')
        );
        if (workspaceShapeChanged && !hasDivergentBuffer) {
          scheduleWorkspaceReload(nextPath);
          return;
        }

        // A net-zero A -> B -> A edit removes the backend review. Reload the
        // clean Monaco model so B cannot remain visible and later be saved as
        // an unreviewed user edit. Preserve a genuinely divergent user buffer.
        if (afterExists && !hasDivergentBuffer && tabForPath(path)) {
          const model = await activateAndResolveModel(path, 500);
          if (model && !modelHasUnsavedChanges(path, model)) {
            await reloadThroughBundle(path);
          }
        }

        if (nextPath) {
          await window.reloadActiveFileWithDiff(nextPath);
        } else {
          const banner = document.getElementById('ai-diff-banner');
          if (banner) banner.style.display = 'none';
          restoreGlyphMargin();
        }
      }

      window.onAiReviewCancelled = async function (path, afterExists = true) {
        const cancelledCurrent = currentReview &&
          normalizePath(currentReview.path) === normalizePath(path);
        const cancellation = {
          path,
          afterExists: Boolean(afterExists),
          review: cancelledCurrent ? currentReview : null,
          model: cancelledCurrent ? currentReviewModel : null
        };
        if (cancelledCurrent) {
          renderGeneration += 1;
          if (currentReviewModel) clearDecorations(currentReviewModel);
          currentReview = null;
          currentReviewModel = null;
          const banner = document.getElementById('ai-diff-banner');
          if (banner) banner.style.display = 'none';
        }
        if (resolvingReview) {
          // The decision's finally block performs this recovery after the
          // bridge settles, so a cancelled A -> B -> A edit cannot leave B in
          // Monaco with no review banner.
          deferredReviewCancellations.push(cancellation);
          return;
        }
        await recoverCancelledReview(cancellation);
      };

      window.resetAiReviewForProject = function () {
        renderGeneration += 1;
        workspaceReloadScheduled = false;
        currentReview = null;
        currentReviewModel = null;
        aiHistoryBannerDismissed = false;
        aiHistoryBannerToken = '';
        lastAiHistoryState = null;
        aiHistoryBaselinePath = '';
        aiHistoryBaselineVersion = null;
        window.clearAiDiffHighlights();
        restoreGlyphMargin();
        setReviewButtonsDisabled(true);
        try {
          sessionStorage.removeItem('pending_ai_review_path');
          sessionStorage.removeItem('ai_review_reload_attempted');
        } catch (error) { }
        setTimeout(resumePendingReview, 300);
      };

      async function resumePendingReview() {
        const api = bridgeApi();
        if (!api || !api.get_ai_edit_reviews || !window.editorInstance) {
          setTimeout(resumePendingReview, 250);
          return;
        }
        try {
          if (typeof window.syncTabPaths === 'function') await window.syncTabPaths();
          const reviews = await api.get_ai_edit_reviews() || [];
          if (!reviews.length) {
            if (!currentReview) await refreshAiHistoryBanner();
            return;
          }
          if (currentReview) return;
          let preferred = '';
          try {
            preferred = sessionStorage.getItem('pending_ai_review_path') || '';
            sessionStorage.removeItem('pending_ai_review_path');
          } catch (error) { }
          const target = reviews.find((review) =>
            normalizePath(review.path) === normalizePath(preferred)
          ) || reviews[0];
          if (target && target.path) await window.reloadActiveFileWithDiff(target.path);
        } catch (error) {
          console.error('Could not resume pending AI review:', error);
          setTimeout(resumePendingReview, 500);
        }
      }

      const acceptButton = document.getElementById('ai-review-accept');
      const rejectButton = document.getElementById('ai-review-reject');
      const undoButton = document.getElementById('ai-history-undo');
      const redoButton = document.getElementById('ai-history-redo');
      const closeHistoryButton = document.getElementById('ai-history-close');
      if (acceptButton) acceptButton.addEventListener('click', () => resolveCurrentReview(true));
      if (rejectButton) rejectButton.addEventListener('click', () => resolveCurrentReview(false));
      if (undoButton) undoButton.addEventListener('click', () => applyAiHistory('undo', false));
      if (redoButton) redoButton.addEventListener('click', () => applyAiHistory('redo', false));
      if (closeHistoryButton) closeHistoryButton.addEventListener('click', () => dismissAiHistoryBanner());

      // Ctrl+Z/Ctrl+Y behave like an IDE timeline. Monaco keeps priority while
      // the current model has user typing to undo/redo. Once the model returns
      // to the exact post-AI-decision baseline, the same shortcuts continue
      // into the RAM-resident AI decision history. Ctrl+Alt+Z/Y remain explicit
      // shortcuts that always target AI history.
      window.addEventListener('keydown', (event) => {
        if (!event.ctrlKey || event.shiftKey) return;
        const key = String(event.key || '').toLowerCase();
        if (key !== 'z' && key !== 'y') return;

        if (event.altKey) {
          event.preventDefault();
          applyAiHistory(key === 'z' ? 'undo' : 'redo', false);
          return;
        }

        if (currentReview || resolvingReview || historyBusy || !lastAiHistoryState) return;
        if (!editorIsAtAiHistoryBaseline()) return;
        const canApply = key === 'z'
          ? !!lastAiHistoryState.canUndo
          : !!lastAiHistoryState.canRedo;
        if (!canApply) return;
        event.preventDefault();
        event.stopPropagation();
        applyAiHistory(key === 'z' ? 'undo' : 'redo', false);
      }, true);

      if (window.pywebview && window.pywebview.api) {
        setTimeout(resumePendingReview, 700);
      } else {
        window.addEventListener('pywebviewready', () => setTimeout(resumePendingReview, 700));
      }
    })();

    // ── Direct Event-Based Go To Definition Handler & Hover Provider ──────────
    (function () {
      // Navigation is based on the source models already loaded in Monaco.
      // It must remain available while editing, even before the first compile.
      window.setProjectCompiledState = function () { };

      function isPositionInStringOrComment(model, position) {
        if (!model || !position) return false;
        const lineText = model.getLineContent(position.lineNumber) || '';
        const col = position.column - 1; // 0-indexed
        const textBefore = lineText.substring(0, col);

        // Check single line comment
        const commentIdx = textBefore.indexOf('//');
        if (commentIdx !== -1) return true;

        // Check block comment start before position and not closed before position
        const openBlock = textBefore.lastIndexOf('/*');
        const closeBlock = textBefore.lastIndexOf('*/');
        if (openBlock !== -1 && openBlock > closeBlock) return true;

        // Count unescaped string quote delimiters up to column
        let inDouble = false;
        let inSingle = false;
        let inBacktick = false;
        for (let i = 0; i < lineText.length && i < col; i++) {
          const ch = lineText[i];
          const prev = i > 0 ? lineText[i - 1] : '';
          if (ch === '"' && prev !== '\\' && !inSingle && !inBacktick) {
            inDouble = !inDouble;
          } else if (ch === "'" && prev !== '\\' && !inDouble && !inBacktick) {
            inSingle = !inSingle;
          } else if (ch === '`' && prev !== '\\' && !inDouble && !inSingle) {
            inBacktick = !inBacktick;
          }
        }
        return inDouble || inSingle || inBacktick;
      }

      async function jumpToDefinitionAtPosition(targetPos, explicitWord) {
        if (!window.editorInstance) return false;
        const editor = window.editorInstance;
        const model = editor.getModel();
        if (!model) return false;

        let targetWord = explicitWord;
        let pos = targetPos;

        if (!targetWord) {
          pos = targetPos || editor.getPosition();
          if (!pos) return false;
          if (isPositionInStringOrComment(model, pos)) return false;
          const wordInfo = model.getWordAtPosition(pos);
          if (!wordInfo || !wordInfo.word) return false;
          targetWord = wordInfo.word;
        } else if (pos && isPositionInStringOrComment(model, pos)) {
          return false;
        }

          'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'default',
          'return', 'break', 'continue', 'struct', 'class', 'enum', 'union',
          'public', 'private', 'protected', 'void', 'int', 'float', 'double',
          'char', 'bool', 'const', 'static', 'unsigned', 'signed', 'true',
          'false', 'null', 'nullptr', 'include', 'define', 'ifdef', 'ifndef',

          'with', 'as', 'size_t', 'uint8_t', 'uint16_t', 'uint32_t', 'int8_t',
          'int16_t', 'int32_t', 'String'
        ]);

        if (sym && sym.line) {

          const lineText = targetModel.getLineContent(sym.line) || '';
