        'read': { kind: 'function', returnType: 'int', params: [], prototype: 'int read()' },
        'write': { kind: 'function', returnType: 'size_t', params: ['uint8_t val'], prototype: 'size_t write(uint8_t val)' },
        'available': { kind: 'function', returnType: 'int', params: [], prototype: 'int available()' }
      };

      async function findProjectSymbol(word, activeModel) {
        const files = window.projectFileList || [];
        const api = window.pywebview && window.pywebview.api;
        if (!word || !api || !files.length) return null;

        const activeTab = document.querySelector('#tab-bar .tab.active');
        const activePath = activeTab && activeTab._filePath;
        const orderedFiles = files.slice().sort((a, b) => {
          return a.path === activePath ? -1 : b.path === activePath ? 1 : 0;
        });
        const escapedWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const typePattern = '((?:(?:const|static|volatile|extern|inline|constexpr|unsigned|signed|long|short)\\s+)*[a-zA-Z_]\\w*(?:::[a-zA-Z_]\\w*)?(?:\\s*[*&])*)';
        const functionPattern = new RegExp('(?:^|\\s)' + typePattern + '\\s+' + escapedWord + '\\s*\\(([^)]*)\\)', 'i');
        const variablePattern = new RegExp('(?:^|\\s)' + typePattern + '\\s+' + escapedWord + '\\s*(=|;|,|\\[)', 'i');
        const macroPattern = new RegExp('#\\s*define\\s+' + escapedWord + '\\b', 'i');
        let fallback = null;

        for (const file of orderedFiles) {
          let content = '';
          if (file.path === activePath && activeModel) {
            content = activeModel.getValue();
          } else {
            try {
              const result = await api.read_file(file.path);
              content = result && result.content || '';
            } catch (error) {
              continue;
            }
          }

          const lines = content.split(/\r?\n/);
          for (let index = 0; index < lines.length; index++) {
            const line = lines[index].trim();
            if (!line || line.startsWith('//')) continue;
            if (macroPattern.test(line)) {
              return { path: file.path, line: index + 1, kind: 'macro', isDefinition: true };
            }

            const functionMatch = line.match(functionPattern);
            if (functionMatch) {
              const isDefinition = line.includes('{') ||
                (index + 1 < lines.length && lines[index + 1].trim().startsWith('{'));
              const symbol = {
                path: file.path,
                line: index + 1,
                kind: 'function',
                returnType: functionMatch[1].trim(),
                params: functionMatch[2].trim(),
                isDefinition
              };
              if (isDefinition) return symbol;
              if (!fallback) fallback = symbol;
            }

            const variableMatch = line.match(variablePattern);
            if (!fallback && variableMatch) {
              fallback = {
                path: file.path,
                line: index + 1,
                kind: 'variable',
                returnType: variableMatch[1].trim(),
                isDefinition: false
              };
            }
          }
        }

        return fallback;
      }

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>'"]/g, char => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[char]));
      }

      function formatTypedName(value) {
        const text = escapeHtml(value).trim();
        const match = text.match(/^(.+?)(\s+([A-Za-z_]\w*(?:\s*=.*)?))$/);
        return match ? '<strong>' + match[1] + '</strong>' + match[2] : text;
      }

      function getHoveredDeclaration(word, model, position) {
        if (!model || !position) return null;
        if (isPositionInStringOrComment(model, position)) return null;
        const line = model.getLineContent(position.lineNumber) || '';
        const wordIdx = line.indexOf(word);
        const eqIdx = line.indexOf('=');
        // Word comes AFTER '=' on line: it is an assigned value (e.g. dir = "STABLE"), NOT the declared variable name!
        if (eqIdx !== -1 && wordIdx > eqIdx) {
          return null;
        }
        const escapedWord = word.replace(/[.*+?^\${}()|[\]\\]/g, '\\$&');
        const typePattern = '((?:(?:const|static|volatile|extern|inline|constexpr|unsigned|signed|long|short)\\s+)*[a-zA-Z_]\\w*(?:::[a-zA-Z_]\\w*)?(?:\\s*[*&])*)';
        const functionMatch = line.match(new RegExp('(?:^|\\s)' + typePattern + '\\s+' + escapedWord + '\\s*\\(([^)]*)\\)', 'i'));
        if (functionMatch) {
          const isDefinition = line.includes('{') ||
            (position.lineNumber < model.getLineCount() && model.getLineContent(position.lineNumber + 1).trim().startsWith('{'));
          return {
            kind: 'function', returnType: functionMatch[1].trim(),
            params: functionMatch[2].trim(), isDefinition
          };
        }
        const variableMatch = line.match(new RegExp('(?:^|;\\s*|\\{\\s*|(?:^|\\s)(?:const|static|volatile|extern|inline|constexpr|unsigned|signed|long|short|int|float|double|char|bool|void|auto|String|[a-zA-Z_]\\w*)\\s+)' + typePattern + '\\s+' + escapedWord + '\\b\\s*(=|;|,|\\[)', 'i'));
        return variableMatch ? { kind: 'variable', returnType: variableMatch[1].trim(), isDefinition: true } : null;
      }

      function showDefinitionCard(anchorElement, word, symbol, declaration, model, position) {
        const card = document.getElementById('definition-hover-card');
        if (!card || !anchorElement || !symbol) return;
        const info = declaration || symbol;
        const label = info.kind === 'function'
          ? (info.isDefinition ? 'Function definition' : 'Function declaration')
          : info.kind === 'variable' ? 'Variable declaration' : 'Macro declaration';
        const signature = info.kind === 'function'
          ? '<strong>' + escapeHtml(info.returnType) + '</strong> ' + escapeHtml(word) +
          '(' + formatTypedName(info.params) + ')' + (info.isDefinition ? ' {}' : ';')
          : '<strong>' + escapeHtml(info.returnType || '') + '</strong> ' + escapeHtml(word);
        const line = model.getLineContent(position.lineNumber) || '';
        const callMatch = !declaration && line.match(new RegExp(
          word.replace(/[.*+?^\${}()|[\]\\]/g, '\\$&') + '\\s*\\(([^)]*)\\)'
        ));
        const callValues = callMatch && callMatch[1].trim();
        let details = '';
        if (info.kind === 'function' && callValues) {
          details =
            '<div class="symbol-detail"><strong>Parameter/s:</strong> ' + escapeHtml(word) +
            '(' + escapeHtml(callValues) + ') &rarr; ' + escapeHtml(callValues) + '</div>' +
            '<div class="symbol-detail"><strong>Argument/s:</strong> ' + escapeHtml(word) +
            '(' + formatTypedName(info.params) + ') &rarr; ' + formatTypedName(info.params) + '</div>';
        } else if (info.kind === 'function') {
          details = '<div class="symbol-detail"><strong>Argument/s:</strong> ' + escapeHtml(word) +
            '(' + formatTypedName(info.params) + ') &rarr; ' + formatTypedName(info.params) + '</div>';
        }
        card.innerHTML = '<div class="symbol-kind">' + label + '</div><div class="signature">' +
          signature + '</div>' + details;
        const rect = anchorElement.getBoundingClientRect();
        card.style.left = Math.max(8, rect.left) + 'px';
        card.style.top = Math.max(8, rect.top - 7) + 'px';
        card.style.display = 'block';
      }

      function hideDefinitionCard() {
        const card = document.getElementById('definition-hover-card');
        if (card) card.style.display = 'none';
      }

      function parseSymbolDetails(word, currentModel, position) {
        if (!word || typeof word !== 'string') return null;

        const keywords = new Set([
          'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'default',
          'return', 'break', 'continue', 'struct', 'class', 'enum', 'union',
          'public', 'private', 'protected', 'void', 'int', 'float', 'double',
          'char', 'bool', 'const', 'static', 'unsigned', 'signed', 'true',
          'false', 'null', 'nullptr', 'include', 'define', 'ifdef', 'ifndef',
          'endif', 'import', 'from', 'def', 'pass', 'try', 'except', 'finally',
          'with', 'as', 'lambda', 'global', 'nonlocal', 'yield', 'raise'
        ]);
        if (keywords.has(word)) return null;

        // 1. Check BUILTIN_ARDUINO registry first
        if (BUILTIN_ARDUINO[word]) {
          const b = BUILTIN_ARDUINO[word];
          return {
            kind: b.kind || 'function',
            name: word,
            returnType: b.returnType || '',
            params: b.params || [],
            prototype: b.prototype || `${word}()`
          };
        }

        // 2. Scan open Monaco models
        const models = (typeof monaco !== 'undefined' && monaco.editor) ? monaco.editor.getModels() : (currentModel ? [currentModel] : []);
        if (currentModel) {
          models.sort((a, b) => (a === currentModel ? -1 : b === currentModel ? 1 : 0));
        }

        const escapedWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const typePattern = '((?:(?:const|static|volatile|extern|inline|constexpr|virtual|unsigned|signed|long|short|void|int|float|double|char|bool|uint8_t|uint16_t|uint32_t|int8_t|int16_t|int32_t|size_t|auto|String|[a-zA-Z_]\\w*)\\s+)+[*&]*)';
        const funcRegex = new RegExp('(?:^|\\s)' + typePattern + '\\s+(?:[a-zA-Z_]\\w*::)?' + escapedWord + '\\s*\\(([^)]*)\\)', 'i');
        const macroRegex = new RegExp('#\\s*define\\s+' + escapedWord + '(?:\\(([^)]*)\\))?\\s*(.*)', 'i');
        const varRegex = new RegExp('(?:^|\\s)' + typePattern + '\\s+' + escapedWord + '\\s*(?:=\\s*[^;,]+|\\[[^\\]]*\\]|;|,)', 'i');
        const typeRegex = new RegExp('(class|struct|enum|union)\\s+' + escapedWord, 'i');

        // Python specific symbol matchers
        const pyFuncRegex = new RegExp('(?:^|\\s)(?:async\\s+)?def\\s+' + escapedWord + '\\s*\\(([^)]*)\\)(?:\\s*->\\s*([^{\\n:]+))?', 'i');
        const pyClassRegex = new RegExp('(?:^|\\s)class\\s+' + escapedWord + '(?:\\(([^)]*)\\))?', 'i');
        const pyVarRegex = new RegExp('(?:^|\\s)' + escapedWord + '\\s*(?::\\s*([a-zA-Z_]\\w*))?\\s*=', 'i');

        let fallbackSym = null;

        for (const m of models) {
          const count = m.getLineCount();
          for (let l = 1; l <= count; l++) {
            const line = m.getLineContent(l).trim();
            if (!line || line.startsWith('//')) continue;

            const mPyFunc = line.match(pyFuncRegex);
            if (mPyFunc) {
              const paramStr = mPyFunc[1] ? mPyFunc[1].trim() : '';
              const retType = mPyFunc[2] ? mPyFunc[2].trim() : '';
              return {
                kind: 'function',
                name: word,
                returnType: retType,
                params: paramStr ? paramStr.split(',').map(s => s.trim()) : [],
                prototype: `def ${word}(${paramStr})${retType ? ' -> ' + retType : ''}`,
                line: l,
                model: m
              };
            }

            const mPyClass = line.match(pyClassRegex);
            if (mPyClass) {
              const baseClass = mPyClass[1] ? mPyClass[1].trim() : '';
              return {
                kind: 'class',
                name: word,
                returnType: '',
                params: [],
                prototype: `class ${word}${baseClass ? '(' + baseClass + ')' : ''}`,
                line: l,
                model: m
              };
            }

            const mPyVar = line.match(pyVarRegex);
            if (mPyVar && !fallbackSym) {
              const typeAnnotation = mPyVar[1] ? mPyVar[1].trim() : '';
              fallbackSym = {
                kind: 'variable',
                name: word,
                returnType: typeAnnotation,
                params: [],
                prototype: typeAnnotation ? `${word}: ${typeAnnotation}` : `${word}`,
                line: l,
                model: m
              };
            }

            const mType = line.match(typeRegex);
            if (mType) {
              return {
                kind: mType[1].toLowerCase(),
                name: word,
                returnType: '',
                params: [],
                prototype: mType[0],
                line: l,
                model: m
              };
            }

            const mMacro = line.match(macroRegex);
            if (mMacro) {
              const macroParams = mMacro[1] ? mMacro[1].split(',').map(s => s.trim()) : [];
              return {
                kind: 'macro',
                name: word,
                returnType: '',
                params: macroParams,
                prototype: `#define ${word}${mMacro[1] ? '(' + mMacro[1] + ')' : ''} ${mMacro[2] || ''}`.trim(),
                line: l,
                model: m
              };
            }

            const mFunc = line.match(funcRegex);
            if (mFunc) {
              const retType = mFunc[1].trim();
              const paramStr = mFunc[2].trim();
              const paramsList = paramStr ? paramStr.split(',').map(s => s.trim()) : [];
              const isImpl = line.includes('{') || (l < count && m.getLineContent(l + 1).trim().startsWith('{'));
              const symObj = {
                kind: 'function',
                name: word,
                returnType: retType,
                params: paramsList,
                prototype: `${retType} ${word}(${paramStr})`,
                line: l,
                model: m
              };
              if (isImpl) {
                return symObj;
              } else if (!fallbackSym) {
                fallbackSym = symObj;
              }
            }

            const mVar = line.match(varRegex);
            if (mVar && !fallbackSym) {
              const retType = mVar[1].trim();
              fallbackSym = {
                kind: 'variable',
                name: word,
                returnType: retType,
                params: [],
                prototype: `${retType} ${word}`,
                line: l,
                model: m
              };
            }
          }
        }

        if (fallbackSym) {
          return fallbackSym;
        }

        // 3. Context check at position in currentModel
        if (currentModel && position) {
          const lineContent = currentModel.getLineContent(position.lineNumber) || '';
          const wordInfo = currentModel.getWordAtPosition(position);
          if (wordInfo) {
            const restOfLine = lineContent.substring(wordInfo.endColumn - 1).trim();
            if (restOfLine.startsWith('(')) {
              const matchCall = restOfLine.match(/^\(([^)]*)\)/);
              const callArgsStr = matchCall ? matchCall[1].trim() : '';
              const callArgsList = callArgsStr ? callArgsStr.split(',').map(s => s.trim()) : [];
              return {
                kind: 'function',
                name: word,
                returnType: '',
                params: callArgsList,
                prototype: `${word}(${callArgsStr})`
              };
            }
          }
        }

        // 4. Default fallback: Variable
        return {
          kind: 'variable',
          name: word,
          returnType: '',
          params: [],
          prototype: word
        };
      }

      function attachNavigationListeners() {
        if (!window.editorInstance) {
          setTimeout(attachNavigationListeners, 300);
          return;
        }

        const editor = window.editorInstance;
        if (editor._nav_listeners_attached) return;
        editor._nav_listeners_attached = true;

        let ctrlHoverDecorations = [];
        let hoverRequestId = 0;

        function clearCtrlHover() {
          hoverRequestId++;
          ctrlHoverDecorations = editor.deltaDecorations(ctrlHoverDecorations, []);
        }

        function disposeControlHover() {
          hideHoverCard();
          clearCtrlHover();
        }

        function updateCtrlHover(position, modifierPressed) {
          hoverRequestId++;
          if (!modifierPressed || !position) {
            clearCtrlHover();
            return;
          }

          const model = editor.getModel();
          const word = model && model.getWordAtPosition(position);
          if (!word || !word.word) {
            clearCtrlHover();
            return;
          }

          ctrlHoverDecorations = editor.deltaDecorations(ctrlHoverDecorations, [{
            range: {
              startLineNumber: position.lineNumber,
              startColumn: word.startColumn,
              endLineNumber: position.lineNumber,
              endColumn: word.endColumn
            },
            options: { inlineClassName: 'monaco-definition-link' }
          }]);
        }

        // Create custom floating hover container widget
        let customHoverCard = document.getElementById('monaco-custom-hover-card');
        if (!customHoverCard) {
          customHoverCard = document.createElement('div');
          customHoverCard.id = 'monaco-custom-hover-card';
          document.body.appendChild(customHoverCard);
        }

        let hoverTimer = null;
        let lastHoverWord = '';

        function hideHoverCard() {
          if (hoverTimer) clearTimeout(hoverTimer);
          customHoverCard.style.display = 'none';
          lastHoverWord = '';
        }

        customHoverCard.addEventListener('mouseleave', hideHoverCard);

        // Global DOM event listeners to dispose hover card immediately when Control key is released or window loses focus
        window.addEventListener('keyup', (e) => {
          if (e.key === 'Control' || e.key === 'Meta' || (!e.ctrlKey && !e.metaKey)) {
            disposeControlHover();
          }
        }, true);

        window.addEventListener('blur', () => {
          disposeControlHover();
        }, true);

        function renderHoverCardAt(pos, clientX, clientY) {
          if (!pos) {
            disposeControlHover();
            return;
          }
          const model = editor.getModel();
          if (!model) {
            disposeControlHover();
            return;
          }
          const wordInfo = model.getWordAtPosition(pos);
          if (!wordInfo || !wordInfo.word) {
            disposeControlHover();
            return;
          }

          const word = wordInfo.word;
          const keywords = new Set([
            'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'default',
            'return', 'break', 'continue', 'struct', 'class', 'enum', 'union',
            'public', 'private', 'protected', 'void', 'int', 'float', 'double',
            'char', 'bool', 'const', 'static', 'unsigned', 'signed', 'true',
            'false', 'null', 'nullptr', 'import', 'from', 'def', 'pass', 'try',
            'except', 'finally', 'with', 'as'
          ]);
          if (keywords.has(word)) {
            disposeControlHover();
            return;
          }

          if (word === lastHoverWord && customHoverCard.style.display === 'block') return;
          lastHoverWord = word;

          const sym = parseSymbolDetails(word, model, pos);
          let html = '';
          if (sym) {
            const isFunc = sym.kind === 'function';
            const kindDisplay = isFunc ? 'function' : (sym.kind || 'variable');

            html = `<div><span class="hover-kind">(${kindDisplay})</span> <span class="hover-title">${sym.name || word}</span></div>`;

            if (sym.returnType) {
              html += `<div style="font-size:11px; color:#abb2bf; margin-top:3px;">Return Type: <span style="color:#e5c07b; font-weight:600;">${sym.returnType}</span></div>`;
            }

            if (isFunc) {
              if (sym.params && sym.params.length > 0) {
                const paramElements = sym.params.map(p => `<code style="background:#161b24; padding:2px 5px; border-radius:3px; color:#98c379; margin-right:3px;">${p}</code>`).join(' ');
                html += `<div style="font-size:11px; color:#abb2bf; margin-top:5px;"><strong>Parameters/Arguments:</strong><div style="margin-top:3px; display:flex; flex-wrap:wrap; gap:4px;">${paramElements}</div></div>`;
              } else {
                html += `<div style="font-size:11px; color:#abb2bf; margin-top:5px;"><strong>Parameters/Arguments:</strong> <em style="color:#7f8c8d;">none</em></div>`;
              }
            }

            if (sym.prototype) {
              html += `<div class="hover-proto">${sym.prototype}</div>`;
            }
          } else {
            html = `<div><span class="hover-kind">(variable)</span> <span class="hover-title">${word}</span></div>`;
            html += `<div class="hover-proto">${word}</div>`;
          }

          html += `<div class="hover-link" onclick="window.jumpToDefinitionWord('${word}')">👉 Go to Definition (Click / Tab)</div>`;
          customHoverCard.innerHTML = html;

          // Position floating hover container near cursor
          const left = Math.min(window.innerWidth - 320, Math.max(10, clientX + 12));
          const top = Math.max(10, clientY - 80);
          customHoverCard.style.left = left + 'px';
          customHoverCard.style.top = top + 'px';
          customHoverCard.style.display = 'block';
        }

        // Replace the older generic hover card with a declaration-aware card.
        async function renderHoverCardAt(pos, clientX, clientY, anchorElement) {
          if (!pos) {
            disposeControlHover();
            return;
          }
          const model = editor.getModel();
          if (!model || isPositionInStringOrComment(model, pos)) {
            disposeControlHover();
            return;
          }
          const wordInfo = model.getWordAtPosition(pos);
          if (!wordInfo || !wordInfo.word) {
            disposeControlHover();
            return;
          }

          const word = wordInfo.word;
          lastHoverWord = word;
          const declaration = getHoveredDeclaration(word, model, pos);
          const symbol = await findProjectSymbol(word, model) || parseSymbolDetails(word, model, pos);
          if (word !== lastHoverWord || !symbol) return;

          const info = declaration || symbol;
          const isFunction = info.kind === 'function';
          const params = Array.isArray(info.params) ? info.params.join(', ') : (info.params || '');
          const label = isFunction
            ? (info.isDefinition ? 'Function definition' : 'Function declaration')
            : info.kind === 'macro'
              ? 'Macro declaration'
              : (declaration || (info && (info.returnType || info.line)))
                ? 'Variable declaration'
                : 'Symbol';
          const signature = isFunction
            ? '<strong>' + escapeHtml(info.returnType || '') + '</strong> ' + escapeHtml(word) +
            '(' + formatTypedName(params) + ')' + (info.isDefinition ? ' {}' : ';')
            : '<strong>' + escapeHtml(info.returnType || '') + '</strong> ' + escapeHtml(word);
          const currentLine = model.getLineContent(pos.lineNumber) || '';
          const callMatch = !declaration && currentLine.match(new RegExp(
            word.replace(/[.*+?^\${}()|[\]\\]/g, '\\$&') + '\\s*\\(([^)]*)\\)'
          ));
          const callValues = callMatch && callMatch[1].trim();
          let html = '<div><span class="hover-kind">' + label + '</span></div>' +
            '<div class="hover-proto">' + signature + '</div>';
          if (isFunction && callValues) {
            html += '<div class="hover-detail"><strong>Parameter/s:</strong> ' + escapeHtml(word) +
              '(' + escapeHtml(callValues) + ') &rarr; ' + escapeHtml(callValues) + '</div>' +
              '<div class="hover-detail"><strong>Argument/s:</strong> ' + escapeHtml(word) +
              '(' + formatTypedName(params) + ') &rarr; ' + formatTypedName(params) + '</div>';
          } else if (isFunction) {
            html += '<div class="hover-detail"><strong>Argument/s:</strong> ' + escapeHtml(word) +
              '(' + formatTypedName(params) + ') &rarr; ' + formatTypedName(params) + '</div>';
          }
          customHoverCard.innerHTML = html;
          // A hidden element reports zero height. Make it measurable before
          // calculating its position so it sits above, rather than over, the
          // hovered symbol.
          customHoverCard.style.visibility = 'hidden';
          customHoverCard.style.display = 'block';
          const anchorRect = anchorElement && anchorElement.getBoundingClientRect
            ? anchorElement.getBoundingClientRect() : null;
          const anchorX = anchorRect && anchorRect.width ? anchorRect.left : clientX;
          const anchorTop = anchorRect && anchorRect.height ? anchorRect.top : clientY;
          const left = Math.min(window.innerWidth - customHoverCard.offsetWidth - 8, Math.max(8, anchorX));
          const top = Math.max(8, anchorTop - customHoverCard.offsetHeight - 6);
          customHoverCard.style.left = left + 'px';
          customHoverCard.style.top = top + 'px';
          customHoverCard.style.visibility = 'visible';
          customHoverCard.style.display = 'block';
        }

        editor.onMouseMove((e) => {
          const event = e.event || e.browserEvent || {};
          const pos = e.target && e.target.position;
          const isCtrl = !!(event.ctrlKey || event.metaKey);

          if (!isCtrl || !pos) {
            disposeControlHover();
            return;
          }

          const model = editor.getModel();
          if (!model || isPositionInStringOrComment(model, pos)) {
            disposeControlHover();
            return;
          }

          const wordInfo = model.getWordAtPosition(pos);
          if (!wordInfo || !wordInfo.word) {
            disposeControlHover();
            return;
          }

          const word = wordInfo.word;
          const keywords = new Set([
            'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'default',
            'return', 'break', 'continue', 'struct', 'class', 'enum', 'union',
            'public', 'private', 'protected', 'void', 'int', 'float', 'double',
            'char', 'bool', 'const', 'static', 'unsigned', 'signed', 'true',
            'false', 'null', 'nullptr', 'import', 'from', 'def', 'pass', 'try',
            'except', 'finally', 'with', 'as'
          ]);
          if (keywords.has(word)) {
            disposeControlHover();
            return;
          }

          updateCtrlHover(pos, true);

          if (hoverTimer) clearTimeout(hoverTimer);
          const cx = event.clientX || (e.browserEvent && e.browserEvent.clientX) || 100;
          const cy = event.clientY || (e.browserEvent && e.browserEvent.clientY) || 100;
          hoverTimer = setTimeout(() => {
            renderHoverCardAt(pos, cx, cy, e.target && e.target.element);
          }, 100);
        });

        editor.onMouseLeave(() => {
          disposeControlHover();
        });
        editor.onKeyUp((e) => {
          const event = e.browserEvent || {};
          if (!event.ctrlKey && !event.metaKey) disposeControlHover();
        });
        editor.onDidChangeModelContent(() => {
          disposeControlHover();
        });
        editor.onDidChangeModel(() => {
          disposeControlHover();
        });

        // Register command for command URI execution inside Markdown hover tooltips
        try {
          if (typeof monaco !== 'undefined' && monaco.editor && monaco.editor.registerCommand) {
            monaco.editor.registerCommand('gotoDefinitionWord', function (accessor, wordArg) {
              let word = wordArg;
              if (Array.isArray(word)) word = word[0];
              if (word) jumpToDefinitionAtPosition(null, word);
            });
          }
          editor.addAction({
            id: 'gotoDefinitionWord',
            label: 'Go to Definition',
            run: function (ed, wordArg) {
              let word = wordArg;
              if (Array.isArray(word)) word = word[0];
              if (word) jumpToDefinitionAtPosition(null, word);
            }
          });
        } catch (e) { }

        // Register Definition Provider & Hover Provider for Monaco
        const SUPPORTED_LANGS = ['cpp', 'c', 'ino', 'h', 'python', 'py', 'javascript', 'js', 'json', 'plaintext'];
        try {
          if (typeof monaco !== 'undefined' && monaco.languages) {
            monaco.languages.registerDefinitionProvider(SUPPORTED_LANGS, {
              provideDefinition: function (model, position) {
                if (isPositionInStringOrComment(model, position)) return null;
                const wordInfo = model.getWordAtPosition(position);
                if (!wordInfo || !wordInfo.word) return null;
                const sym = parseSymbolDetails(wordInfo.word, model, position);
                if (sym && sym.model && sym.line) {
                  return {
                    uri: sym.model.uri,
                    range: new monaco.Range(sym.line, 1, sym.line, 1)
                  };
                }
                return null;
              }
            });
          }
        } catch (e) { }

        // Register Hover Provider matching Arduino IDE 2.x / VS Code styling
        try {
          if (typeof monaco !== 'undefined' && monaco.languages) {
            monaco.languages.registerHoverProvider(SUPPORTED_LANGS, {
              provideHover: function (model, position) {
                if (isPositionInStringOrComment(model, position)) return null;
                const wordInfo = model.getWordAtPosition(position);
                if (!wordInfo || !wordInfo.word) return null;

                const keywords = new Set([
                  'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'default',
                  'return', 'break', 'continue', 'struct', 'class', 'enum', 'union',
                  'public', 'private', 'protected', 'void', 'int', 'float', 'double',
                  'char', 'bool', 'const', 'static', 'unsigned', 'signed', 'true',
                  'false', 'null', 'nullptr', 'import', 'from', 'def', 'pass', 'try',
                  'except', 'finally', 'with', 'as'
                ]);
                if (keywords.has(wordInfo.word)) return null;

                const sym = parseSymbolDetails(wordInfo.word, model, position);

                const lines = [];
                if (sym) {
                  lines.push(`**${sym.kind}** \`${sym.name}\``);
                  if (sym.returnType) {
                    lines.push(`&nbsp;&nbsp;&nbsp;&nbsp;→ \`${sym.returnType}\``);
                  }
                  if (sym.kind === 'function' || (sym.params && sym.params.length > 0)) {
                    if (sym.params && sym.params.length > 0) {
                      lines.push(`\n**Parameters / Arguments:**`);
                      sym.params.forEach(p => lines.push(`&nbsp;&nbsp;\`${p}\``));
                    } else {
                      lines.push(`\n**Parameters:** \`none\``);
                    }
                  }
                  if (sym.prototype) {
                    lines.push(`\n---`);
                    lines.push(`**Symbol Prototype**`);
                    const encodedWord = encodeURIComponent(JSON.stringify([sym.name]));
                    lines.push(`[👉 \`${sym.prototype}\`](command:gotoDefinitionWord?${encodedWord})`);
                  }
                } else {
                  lines.push(`**(variable)** \`${wordInfo.word}\``);
                  const encodedWord = encodeURIComponent(JSON.stringify([wordInfo.word]));
                  lines.push(`[👉 Jump to Definition](command:gotoDefinitionWord?${encodedWord})`);
                }

                return {
                  range: new monaco.Range(position.lineNumber, wordInfo.startColumn, position.lineNumber, wordInfo.endColumn),
                  contents: [
                    {
                      value: lines.join('\n  \n'),
                      isTrusted: true
                    }
                  ]
                };
              }
            });
          }
        } catch (e) {
          console.error("Failed to register Monaco hover provider:", e);
        }

        // Mouse click listener (Ctrl + Click or Cmd + Click)
        editor.onMouseDown((e) => {
          const evt = e.event || e.browserEvent || {};
          const isCtrl = evt.ctrlKey || evt.metaKey || (e.browserEvent && (e.browserEvent.ctrlKey || e.browserEvent.metaKey));
          const isLeft = evt.leftButton === true || evt.button === 0 || (e.browserEvent && (e.browserEvent.leftButton === true || e.browserEvent.button === 0));

          if (isCtrl && isLeft) {
            const pos = (e.target && e.target.position) ? e.target.position : editor.getPosition();
            if (pos) {
              editor.setPosition(pos);
              jumpToDefinitionAtPosition(pos);
            }
          }
        });

        // Keyboard listener (F12)
        editor.onKeyDown((e) => {
          const key = e.browserEvent ? e.browserEvent.key : '';
          const keyCode = e.browserEvent ? e.browserEvent.keyCode : e.keyCode;
          if (key === 'F12' || keyCode === 123 || keyCode === 104) {
            if (e.browserEvent) {
              e.browserEvent.preventDefault();
              e.browserEvent.stopPropagation();
            }
            jumpToDefinitionAtPosition();
          }
        });

        // Global DOM level 3 event listener fallback
        const anchor = document.getElementById('monaco-anchor') || document.body;
        anchor.addEventListener('click', (e) => {
          if (e.ctrlKey || e.metaKey) {
            setTimeout(() => {
              jumpToDefinitionAtPosition();
            }, 20);
          }
        }, true);

        window.addEventListener('keydown', (e) => {
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            jumpToDefinitionAtPosition();
          }
        }, true);
      }

      setTimeout(attachNavigationListeners, 300);
    })();
  </script>

       Multi-Theme Manager (Default, Light, Solarized Dark)
       ══════════════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      let themesRegistered = false;

      function registerCustomMonacoThemes() {
        const monacoObj = window.monaco || (typeof monaco !== 'undefined' ? monaco : null);
        if (!monacoObj || !monacoObj.editor) return;
        if (themesRegistered) return;
        themesRegistered = true;

        try {
          monacoObj.editor.defineTheme('mcu-solarized-dark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
              { token: '', foreground: 'ffffff', background: '002b36' },
              { token: 'comment', foreground: '718c93', fontStyle: 'italic' },
              { token: 'string', foreground: '2aa198' },
              { token: 'keyword', foreground: '859900', fontStyle: 'bold' },
              { token: 'number', foreground: 'd33682' },
              { token: 'type', foreground: 'b58900' },
              { token: 'identifier', foreground: '268bd2' },
              { token: 'delimiter', foreground: 'e0e6ed' }
            ],
            colors: {
              'editor.background': '#002b36',
              'editor.foreground': '#ffffff',
              'editorLineNumber.foreground': '#586e75',
              'editorLineNumber.activeForeground': '#39c5bb',
              'editor.lineHighlightBackground': '#073642',
              'editorCursor.foreground': '#39c5bb',
              'editorWhitespace.foreground': '#073642',
              'editorIndentGuide.background': '#073642',
              'editorIndentGuide.activeBackground': '#586e75',
              'editor.selectionBackground': '#073642',
              'editorGutter.background': '#00212b'
            }
          });

          monacoObj.editor.defineTheme('mcu-light', {
            base: 'vs',
            inherit: true,
            rules: [
              { token: '', foreground: '24292f', background: 'ffffff' },
              { token: 'comment', foreground: '6e7781', fontStyle: 'italic' },
              { token: 'string', foreground: '0a3069' },
              { token: 'keyword', foreground: 'cf222e', fontStyle: 'bold' },
              { token: 'number', foreground: '0550ae' },
              { token: 'type', foreground: '953800' },
              { token: 'identifier', foreground: '116329' },
              { token: 'delimiter', foreground: '24292f' }
            ],
            colors: {
              'editor.background': '#ffffff',
              'editor.foreground': '#24292f',
              'editorLineNumber.foreground': '#8c959f',
              'editorLineNumber.activeForeground': '#0969da',
              'editor.lineHighlightBackground': '#f6f8fa',
              'editorCursor.foreground': '#0969da',
              'editorWhitespace.foreground': '#d0d7de',
              'editorIndentGuide.background': '#d0d7de',
              'editorIndentGuide.activeBackground': '#afb8c1',
              'editor.selectionBackground': '#add6ff',
              'editorGutter.background': '#f6f8fa'
            }
          });

          monacoObj.editor.defineTheme('mcu-default-dark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
              { token: '', foreground: 'e0e6ed', background: '151922' },
              { token: 'comment', foreground: '718294', fontStyle: 'italic' },
              { token: 'keyword', foreground: '00d2ff', fontStyle: 'bold' },
              { token: 'string', foreground: '98c379' },
              { token: 'number', foreground: 'd19a66' }
            ],
            colors: {
              'editor.background': '#151922',
              'editor.foreground': '#ffffff',
              'editorLineNumber.foreground': '#6b7d94',
              'editorLineNumber.activeForeground': '#00d2ff',
              'editor.lineHighlightBackground': '#1e2430',
              'editor.selectionBackground': '#2c3748',
              'editorGutter.background': '#151922'
            }
          });
        } catch (e) {
          console.warn("Could not register custom Monaco themes", e);
        }
      }

      window.setEditorTheme = function (themeName) {
        themeName = (themeName || 'default').toLowerCase().trim();
        document.body.classList.remove('theme-default', 'theme-light', 'theme-solarized-dark');

        registerCustomMonacoThemes();
        const monacoObj = window.monaco || (typeof monaco !== 'undefined' ? monaco : null);

        let targetMonacoTheme = 'mcu-default-dark';
        if (themeName === 'light') {
          document.body.classList.add('theme-light');
          targetMonacoTheme = 'mcu-light';
        } else if (themeName === 'solarized_dark' || themeName === 'solarized' || themeName === 'solarize_dark') {
          document.body.classList.add('theme-solarized-dark');
          targetMonacoTheme = 'mcu-solarized-dark';
        } else {
          document.body.classList.add('theme-default');
          targetMonacoTheme = 'mcu-default-dark';
        }

        if (monacoObj && monacoObj.editor) {
          try {
            monacoObj.editor.setTheme(targetMonacoTheme);
          } catch (e) {
            try {
              monacoObj.editor.setTheme(targetMonacoTheme === 'mcu-light' ? 'vs' : 'vs-dark');
            } catch (e2) {}
          }
        }
        if (window.editorInstance && typeof window.editorInstance.updateOptions === 'function') {
          try {
            window.editorInstance.updateOptions({ theme: targetMonacoTheme });
          } catch (e) {}
        }
      };

      async function autoInitTheme() {
        if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.get_theme_mode === 'function') {
          try {
            const theme = await window.pywebview.api.get_theme_mode();
            window.setEditorTheme(theme);
          } catch (e) {
            window.setEditorTheme('default');
          }
        }
      }

      window.addEventListener('pywebviewready', () => {
        autoInitTheme();
      });
      document.addEventListener('DOMContentLoaded', () => {
        registerCustomMonacoThemes();
        setTimeout(autoInitTheme, 50);
        setTimeout(autoInitTheme, 300);
      });
    })();
  </script>
