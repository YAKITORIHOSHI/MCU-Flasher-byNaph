      async function findProjectSymbol(word, activeModel) {
        const files = window.projectFileList || [];
        const api = window.pywebview && window.pywebview.api;
        if (!word || !files.length) return null;

        const activeTab = document.querySelector('#tab-bar .tab.active');
        const activePath = activeTab && activeTab._filePath;
        const orderedFiles = files.slice().sort((a, b) => {
          return a.path === activePath ? -1 : b.path === activePath ? 1 : 0;
        });
        const esc = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const macroPattern = new RegExp('#\\s*define\\s+' + esc + '(?:\\(([^)]*)\\))?\\s*(.*)', 'i');
        const typePattern = '((?:(?:const|static|volatile|extern|inline|constexpr|unsigned|signed|long|short)\\s+)*[a-zA-Z_]\\w*(?:::[a-zA-Z_]\\w*)?(?:\\s*[*&])*)';
        const functionPattern = new RegExp('(?:^|\\s)' + typePattern + '\\s+' + esc + '\\s*\\(([^)]*)\\)', 'i');
        let fallback = null;

        for (const file of orderedFiles) {
          let content = '';
          if (file.path === activePath && activeModel) {
            content = activeModel.getValue();
          } else if (api) {
            try {
              const result = await api.read_file(file.path);
              content = result && result.content || '';
            } catch (error) {
              continue;
            }
          }

          if (!content) continue;
          const lines = content.split(/\r?\n/);
          for (let index = 0; index < lines.length; index++) {
            const line = lines[index].trim();
            if (!line || line.startsWith('//')) continue;
            const macroMatch = line.match(macroPattern);
            if (macroMatch) {
              const macroVal = (macroMatch[2] || '').trim();
              return {
                path: file.path,
                line: index + 1,
                kind: 'macro',
                subKind: 'Macro definition',
                name: word,
                value: macroVal,
                prototype: `#define ${word}${macroMatch[1] ? '(' + macroMatch[1] + ')' : ''}${macroVal ? ' ' + macroVal : ''}`,
                scopeText: 'Project macro',
                isDefinition: true
              };
            }

            const functionMatch = line.match(functionPattern);
            if (functionMatch) {
              const isDefinition = line.includes('{') ||
                (index + 1 < lines.length && lines[index + 1].trim().startsWith('{'));
              const symbol = {
                path: file.path,
                line: index + 1,
                kind: 'function',
                subKind: isDefinition ? 'Function definition' : 'Function declaration',
                name: word,
                returnType: functionMatch[1].trim(),
                params: functionMatch[2].trim(),
                prototype: `${functionMatch[1].trim()} ${word}(${functionMatch[2].trim()})`,
                scopeText: isDefinition ? 'Function implementation' : 'Function prototype',
                isDefinition
              };
              if (isDefinition) return symbol;
              if (!fallback) fallback = symbol;
            }

            const varDecl = parseVariableDeclaration(line, word);
            if (varDecl && !fallback) {
              fallback = {
                path: file.path,
                line: index + 1,
                ...varDecl,
                subKind: varDecl.isConst ? 'Global constant' : 'Global variable',
                scopeText: 'Global scope',
                isDefinition: true
              };
            }
          }
        }

        return fallback;
      }

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>'"]/g, char => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[char]));
      }

      function formatTypedName(value) {
        const text = escapeHtml(value).trim();
        const match = text.match(/^(.+?)(\s+([A-Za-z_]\w*(?:\s*=.*)?))$/);
        return match ? '<strong>' + match[1] + '</strong>' + match[2] : text;
      }

      function parseVariableDeclaration(line, word) {
        if (!line || !word) return null;
        const trimmed = line.trim();
        if (trimmed.startsWith('//') || trimmed.startsWith('/*') || trimmed.startsWith('*')) return null;

        const esc = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const wordRegex = new RegExp(`\\b${esc}\\b`);
        const matchWord = wordRegex.exec(line);
        if (!matchWord) return null;

        const wordIndex = matchWord.index;
        let beforeText = line.substring(0, wordIndex).trim();
        const afterText = line.substring(wordIndex + word.length).trim();

        // If inside a for-loop: "for (int i = 0; ..."
        if (/^for\s*\([^;]*$/.test(beforeText)) {
          beforeText = beforeText.replace(/^for\s*\(\s*/, '').trim();
        } else if (/^(?:if|while|switch|case)\s*\(/i.test(beforeText)) {
          return null;
        }

        const INVALID_TYPES = new Set(['return', 'goto', 'throw', 'delete', 'new', 'sizeof', 'typeof', 'case', 'default', 'break', 'continue']);

        // Exclude function calls e.g. digitalWrite(word, ...)
        if (/^[a-zA-Z_]\w*\s*\([^)]*$/.test(beforeText)) {
          return null;
        }
        // If followed by '(' with parameters and then '{' or line ends with no assignment -> this is a function definition
        if (/^\s*\(([^)]*)\)\s*(?:\{|;|$)/.test(afterText) && !/^(?:WiFiClient|HardwareSerial|TwoWire|File)\b/.test(beforeText)) {
          if (/^[a-zA-Z_]\w*(?:\s+[*&]*)?\s*$/.test(beforeText)) {
            return null;
          }
        }

        const typeQualifierPattern = '(?:(?:const|constexpr|static|volatile|extern|inline|register|unsigned|signed|short|long)\\s+)*';
        const baseTypePattern = '(?:void|bool|boolean|char|byte|int|word|float|double|uint8_t|uint16_t|uint32_t|uint64_t|int8_t|int16_t|int32_t|int64_t|size_t|ssize_t|auto|String|IPAddress|File|HardwareSerial|TwoWire|SPIClass|WiFiClient|WiFiServer|std::[a-zA-Z_]\\w*|[A-Z][a-zA-Z0-9_]*|[a-zA-Z_]\\w*_t)';
        const fullTypeRegex = new RegExp(`(?:^|[;{}(])\\s*(${typeQualifierPattern}${baseTypePattern}(?:<[^>]+>)?(?:\\s*[*&]+|\\s+)+)`, 'i');

        let typeStr = '';
        let isConst = false;
        let isStatic = false;

        // Case A: Direct declaration: "const int LED_PIN = 13;" or "int i"
        const directMatch = beforeText.match(new RegExp(`(?:^|[;{}(])\\s*(${typeQualifierPattern}${baseTypePattern}(?:<[^>]+>)?(?:\\s*[*&]+|\\s+)*)$`, 'i'));
        if (directMatch && directMatch[1]) {
          typeStr = directMatch[1].trim();
        } else if (beforeText.includes(',')) {
          // Case B: Multi-variable declaration: "int a = 1, b = 2;"
          const stmtStart = beforeText.match(fullTypeRegex);
          if (stmtStart && stmtStart[1]) {
            typeStr = stmtStart[1].trim();
          }
        }

        if (!typeStr || INVALID_TYPES.has(typeStr.toLowerCase())) return null;

        isConst = /\b(const|constexpr)\b/i.test(typeStr);
        isStatic = /\bstatic\b/i.test(typeStr);

        // Extract array dimensions: e.g. "[64]" or "[]" or "[4][4]"
        let arrayDim = '';
        let remainingAfter = afterText;
        const arrMatch = afterText.match(/^(\[[^\]]*\](?:\s*\[[^\]]*\])*)/);
        if (arrMatch) {
          arrayDim = arrMatch[1].replace(/\s+/g, '');
          remainingAfter = afterText.substring(arrMatch[0].length).trim();
        }

        // Extract initial value / constructor arguments
        let initVal = '';
        if (remainingAfter.startsWith('=')) {
          const eqText = remainingAfter.substring(1).trim();
          let endIdx = 0;
          let inQuotes = false;
          let quoteChar = '';
          let braceDepth = 0;
          let parenDepth = 0;
          while (endIdx < eqText.length) {
            const ch = eqText[endIdx];
            if (inQuotes) {
              if (ch === quoteChar && eqText[endIdx - 1] !== '\\') inQuotes = false;
            } else if (ch === '"' || ch === "'") {
              inQuotes = true;
              quoteChar = ch;
            } else if (ch === '{') {
              braceDepth++;
            } else if (ch === '}') {
              braceDepth--;
            } else if (ch === '(') {
              parenDepth++;
            } else if (ch === ')') {
              parenDepth--;
            } else if ((ch === ';' || ch === ',') && braceDepth <= 0 && parenDepth <= 0) {
              break;
            }
            endIdx++;
          }
          initVal = eqText.substring(0, endIdx).trim();
        } else if (remainingAfter.startsWith('(')) {
          const ctorMatch = remainingAfter.match(/^\(([^)]*)\)/);
          if (ctorMatch) {
            initVal = `(${ctorMatch[1].trim()})`;
          }
        }

        return {
          kind: isConst ? 'constant' : 'variable',
          subKind: isConst ? 'Constant' : 'Variable',
          name: word,
          returnType: typeStr,
          isConst,
          isStatic,
          arrayDim,
          value: initVal,
          prototype: `${typeStr} ${word}${arrayDim}${initVal ? ' = ' + initVal : ''}`
        };
      }

      function parseFunctionParameters(funcLine, word) {
        if (!funcLine || !word) return null;
        const esc = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const fnMatch = funcLine.match(/(?:^|\s)(?:(?:const|static|inline|virtual|unsigned|signed|void|int|float|double|bool|auto|String|[a-zA-Z_]\w*)\s+)+([a-zA-Z_]\w*)\s*\(([^)]*)\)/);
        if (!fnMatch) return null;

        const funcName = fnMatch[1];
        const paramsStr = fnMatch[2].trim();
        if (!paramsStr) return null;

        const params = paramsStr.split(',').map(p => p.trim());
        for (const p of params) {
          const pMatch = p.match(new RegExp(`^(.*?)\\b${esc}\\b(?:\\s*=\\s*(.*))?$`));
          if (pMatch) {
            const typeStr = pMatch[1].trim();
            const defaultVal = pMatch[2] ? pMatch[2].trim() : '';
            return {
              kind: 'parameter',
              subKind: 'Function parameter',
              name: word,
              returnType: typeStr || 'auto',
              parentFunction: funcName,
              value: defaultVal,
              prototype: `${typeStr || 'auto'} ${word}${defaultVal ? ' = ' + defaultVal : ''}`,
              scopeText: `Parameter of ${funcName}()`
            };
          }
        }
        return null;
      }

      function parsePythonVariable(line, word) {
        if (!line || !word) return null;
        const esc = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const pyVarMatch = line.match(new RegExp(`(?:^|\\s)(?:self\\.)?${esc}\\s*(?::\\s*([^=]+))?\\s*=\\s*(.+)`));
        if (!pyVarMatch) return null;
        const typeStr = pyVarMatch[1] ? pyVarMatch[1].trim() : '';
        const valStr = pyVarMatch[2] ? pyVarMatch[2].trim().replace(/#.*$/, '').trim() : '';
        return {
          kind: 'variable',
          subKind: 'Variable',
          name: word,
          returnType: typeStr,
          value: valStr,
          prototype: `${word}${typeStr ? ': ' + typeStr : ''} = ${valStr}`
        };
      }

      function formatHighlightedPrototype(info) {
        if (!info) return '';
        if (info.kind === 'function') {
          const retHtml = `<span style="color:var(--hover-type); font-weight:600;">${escapeHtml(info.returnType || 'void')}</span>`;
          const fnHtml = `<span style="color:#d2a8ff; font-weight:bold;">${escapeHtml(info.name)}</span>`;
          const paramsList = Array.isArray(info.params) ? info.params : (info.params ? String(info.params).split(',').map(s => s.trim()).filter(Boolean) : []);
          const paramsHtml = paramsList.map(p => escapeHtml(p)).join(', ');
          return `${retHtml} ${fnHtml}(<span style="color:var(--hover-param);">${paramsHtml}</span>)${info.isDefinition ? ' {}' : ';'}`;
        }
        if (info.kind === 'macro') {
          return `<span style="color:#ff7b72; font-weight:bold;">#define</span> <span style="color:#ffffff; font-weight:bold;">${escapeHtml(info.name)}</span>${info.value ? ` <span style="color:#7ee787;">${escapeHtml(info.value)}</span>` : ''}`;
        }
        if (info.kind === 'class' || info.kind === 'struct') {
          return `<span style="color:#ff7b72; font-weight:bold;">${escapeHtml(info.kind)}</span> <span style="color:#ffffff; font-weight:bold;">${escapeHtml(info.name)}</span>`;
        }

        // Variable / Constant / Parameter
        const typeStr = info.returnType || 'auto';
        const typeParts = escapeHtml(typeStr).split(/\s+/);
        const typeHtml = typeParts.map(part => {
          if (['const', 'constexpr', 'static', 'volatile', 'extern', 'inline', 'register', 'unsigned', 'signed', 'short', 'long', 'auto'].includes(part.toLowerCase())) {
            return `<span style="color:#ff7b72; font-weight:600;">${part}</span>`;
          }
          return `<span style="color:var(--hover-type); font-weight:600;">${part}</span>`;
        }).join(' ');

        const nameHtml = `<span style="color:#ffffff; font-weight:bold;">${escapeHtml(info.name)}</span>`;
        const dimHtml = info.arrayDim ? `<span style="color:#d2a8ff; font-weight:600;">${escapeHtml(info.arrayDim)}</span>` : '';
        const valHtml = info.value ? ` <span style="color:#8b949e;">=</span> <span style="color:#7ee787;">${escapeHtml(info.value)}</span>` : '';
        return `${typeHtml} ${nameHtml}${dimHtml}${valHtml}<span style="color:#8b949e;">;</span>`;
      }

      function getHoveredDeclaration(word, model, position) {
        return parseSymbolDetails(word, model, position);
      }

      function parseSymbolDetails(word, currentModel, position) {
        if (!word || typeof word !== 'string') return null;

        const keywords = new Set([
          'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'default',
          'return', 'break', 'continue', 'struct', 'class', 'enum', 'union',
          'public', 'private', 'protected', 'void', 'int', 'float', 'double',
          'char', 'bool', 'const', 'static', 'unsigned', 'signed', 'true',
          'false', 'null', 'nullptr', 'include', 'define', 'ifdef', 'ifndef',
          'endif', 'import', 'from', 'def', 'pass', 'try', 'except', 'finally',
          'with', 'as', 'lambda', 'global', 'nonlocal', 'yield', 'raise'
        ]);
        if (keywords.has(word)) return null;

        // 1. Check BUILTIN_ARDUINO registry first
        if (BUILTIN_ARDUINO[word]) {
          const b = BUILTIN_ARDUINO[word];
          return {
            kind: b.kind || 'function',
            subKind: b.subKind || (b.kind === 'constant' ? 'Built-in constant' : 'Built-in function'),
            name: word,
            returnType: b.returnType || '',
            value: b.value || '',
            params: b.params || [],
            prototype: b.prototype || `${word}()`,
            scopeText: 'Arduino built-in'
          };
        }

        const esc = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        // 2. Scope-aware lookup within currentModel using position context
        if (currentModel && position && position.lineNumber) {
          const targetLineNum = position.lineNumber;
          const curLine = currentModel.getLineContent(targetLineNum) || '';

          // 2a. Check if word is declared right on the current line
          const curDecl = parseVariableDeclaration(curLine, word);
          if (curDecl) {
            return {
              ...curDecl,
              line: targetLineNum,
              model: currentModel,
              scopeText: `Declared on line ${targetLineNum}`
            };
          }

          // 2b. Check enclosing function parameters and local variables scanning backwards
          let braceDepth = 0;
          let enclosingFunction = null;

          for (let l = targetLineNum - 1; l >= 1; l--) {
            const lineText = currentModel.getLineContent(l);
            if (!lineText) continue;

            const openBraces = (lineText.match(/\{/g) || []).length;
            const closeBraces = (lineText.match(/\}/g) || []).length;
            braceDepth += (openBraces - closeBraces);

            // Check if this line defines a function
            if (!enclosingFunction && /\{/.test(lineText)) {
              const paramMatch = parseFunctionParameters(lineText, word);
              if (paramMatch) {
                return {
                  ...paramMatch,
                  line: l,
                  model: currentModel
                };
              }
              const fnHeaderMatch = lineText.match(/(?:^|\s)(?:(?:const|static|inline|virtual|unsigned|signed|void|int|float|double|bool|auto|String|[a-zA-Z_]\w*)\s+)+([a-zA-Z_]\w*)\s*\(([^)]*)\)/);
              if (fnHeaderMatch) {
                enclosingFunction = fnHeaderMatch[1];
              }
            }

            // Check local variable declaration
            const varMatch = parseVariableDeclaration(lineText, word);
            if (varMatch) {
              return {
                ...varMatch,
                subKind: varMatch.isConst ? 'Local constant' : 'Local variable',
                scopeText: enclosingFunction ? `Local in ${enclosingFunction}()` : `Local scope (line ${l})`,
                line: l,
                model: currentModel
              };
            }

            // If we walked past the enclosing function opening brace, exit local scope check
            if (braceDepth > 0 && enclosingFunction) {
              break;
            }
          }
        }

        // 3. Scan open models for definitions
        const models = (typeof monaco !== 'undefined' && monaco.editor) ? monaco.editor.getModels() : (currentModel ? [currentModel] : []);
        if (currentModel) {
          models.sort((a, b) => (a === currentModel ? -1 : b === currentModel ? 1 : 0));
        }

        const typePattern = '((?:(?:const|static|volatile|extern|inline|constexpr|virtual|unsigned|signed|long|short|void|int|float|double|char|bool|uint8_t|uint16_t|uint32_t|int8_t|int16_t|int32_t|size_t|auto|String|[a-zA-Z_]\\w*)\\s+)+[*&]*)';
        const funcRegex = new RegExp('(?:^|\\s)' + typePattern + '\\s+(?:[a-zA-Z_]\\w*::)?' + esc + '\\s*\\(([^)]*)\\)', 'i');
        const macroRegex = new RegExp('#\\s*define\\s+' + esc + '(?:\\(([^)]*)\\))?\\s*(.*)', 'i');
        const typeRegex = new RegExp('(class|struct|enum|union)\\s+' + esc, 'i');

        let fallbackSym = null;

        for (const m of models) {
          const count = m.getLineCount();
          for (let l = 1; l <= count; l++) {
            const line = m.getLineContent(l);
            if (!line || line.trim().startsWith('//')) continue;

            const pyVar = parsePythonVariable(line, word);
            if (pyVar) {
              return {
                ...pyVar,
                line: l,
                model: m,
                scopeText: `Line ${l}`
              };
            }

            const mType = line.match(typeRegex);
            if (mType) {
              return {
                kind: mType[1].toLowerCase(),
                subKind: mType[1] + ' declaration',
                name: word,
                returnType: '',
                value: '',
                prototype: line.trim(),
                scopeText: `Global ${mType[1]}`,
                line: l,
                model: m
              };
            }

            const mMacro = line.match(macroRegex);
            if (mMacro) {
              const macroParams = mMacro[1] ? mMacro[1].split(',').map(s => s.trim()) : [];
              const macroVal = (mMacro[2] || '').trim();
              return {
                kind: 'macro',
                subKind: 'Macro definition',
                name: word,
                returnType: '',
                value: macroVal,
                params: macroParams,
                prototype: `#define ${word}${mMacro[1] ? '(' + mMacro[1] + ')' : ''}${macroVal ? ' ' + macroVal : ''}`,
                scopeText: 'Global macro',
                line: l,
                model: m
              };
            }

            const mFunc = line.match(funcRegex);
            if (mFunc) {
              const retType = mFunc[1].trim();
              const paramStr = mFunc[2].trim();
              const paramsList = paramStr ? paramStr.split(',').map(s => s.trim()) : [];
              const isImpl = line.includes('{') || (l < count && m.getLineContent(l + 1).trim().startsWith('{'));
              const fnSym = {
                kind: 'function',
                subKind: isImpl ? 'Function definition' : 'Function declaration',
                name: word,
                returnType: retType,
                params: paramsList,
                prototype: `${retType} ${word}(${paramStr})`,
                scopeText: isImpl ? 'Function implementation' : 'Function prototype',
                line: l,
                model: m
              };
              if (isImpl) return fnSym;
              if (!fallbackSym) fallbackSym = fnSym;
            }

            const varDecl = parseVariableDeclaration(line, word);
            if (varDecl) {
              const sym = {
                ...varDecl,
                subKind: varDecl.isConst ? 'Global constant' : 'Global variable',
                scopeText: 'Global scope',
                line: l,
                model: m
              };
              if (sym.isConst || sym.value) return sym;
              if (!fallbackSym) fallbackSym = sym;
            }
          }
        }

        if (fallbackSym) return fallbackSym;

        // 4. Context check at position in currentModel
        if (currentModel && position) {
          const lineContent = currentModel.getLineContent(position.lineNumber) || '';
          const wordInfo = currentModel.getWordAtPosition(position);
          if (wordInfo) {
            const restOfLine = lineContent.substring(wordInfo.endColumn - 1).trim();
            if (restOfLine.startsWith('(')) {
              const matchCall = restOfLine.match(/^\(([^)]*)\)/);
              const callArgsStr = matchCall ? matchCall[1].trim() : '';
              const callArgsList = callArgsStr ? callArgsStr.split(',').map(s => s.trim()) : [];
              return {
                kind: 'function',
                subKind: 'Function call',
                name: word,
                returnType: '',
                params: callArgsList,
                prototype: `${word}(${callArgsStr})`,
                scopeText: 'Function call'
              };
            }
          }
        }

        // 5. Default fallback
        return {
          kind: 'variable',
          subKind: 'Variable',
          name: word,
          returnType: 'auto',
          value: '',
          prototype: `${word}`,
          scopeText: 'Symbol'
        };
      }

      function attachNavigationListeners() {
        if (!window.editorInstance) {
          setTimeout(attachNavigationListeners, 300);
          return;
        }

        const editor = window.editorInstance;
        if (editor._nav_listeners_attached) return;
        editor._nav_listeners_attached = true;

        let ctrlHoverDecorations = [];
        let hoverRequestId = 0;

        function clearCtrlHover() {
          hoverRequestId++;
          ctrlHoverDecorations = editor.deltaDecorations(ctrlHoverDecorations, []);
        }

        function disposeControlHover() {
          hideHoverCard();
          clearCtrlHover();
        }

        function updateCtrlHover(position, modifierPressed) {
          hoverRequestId++;
          if (!modifierPressed || !position) {
            clearCtrlHover();
            return;
          }

          const model = editor.getModel();
          const word = model && model.getWordAtPosition(position);
          if (!word || !word.word) {
            clearCtrlHover();
            return;
          }

          ctrlHoverDecorations = editor.deltaDecorations(ctrlHoverDecorations, [{
            range: {
              startLineNumber: position.lineNumber,
              startColumn: word.startColumn,
              endLineNumber: position.lineNumber,
              endColumn: word.endColumn
            },
            options: { inlineClassName: 'monaco-definition-link' }
          }]);
        }

        // Create custom floating hover container widget
        let customHoverCard = document.getElementById('monaco-custom-hover-card');
        if (!customHoverCard) {
          customHoverCard = document.createElement('div');
          customHoverCard.id = 'monaco-custom-hover-card';
          document.body.appendChild(customHoverCard);
        }

        let hoverTimer = null;
        let hideHoverTimer = null;
        let lastHoverWord = '';
        let isMouseOverCard = false;

        function hideHoverCard(immediate = false) {
          if (hoverTimer) clearTimeout(hoverTimer);
          if (hideHoverTimer) clearTimeout(hideHoverTimer);
          if (immediate) {
            customHoverCard.style.display = 'none';
            lastHoverWord = '';
            return;
          }
          hideHoverTimer = setTimeout(() => {
            if (!isMouseOverCard) {
              customHoverCard.style.display = 'none';
              lastHoverWord = '';
            }
          }, 200);
        }

        customHoverCard.addEventListener('mouseenter', () => {
          isMouseOverCard = true;
          if (hideHoverTimer) clearTimeout(hideHoverTimer);
        });

        customHoverCard.addEventListener('mouseleave', () => {
          isMouseOverCard = false;
          hideHoverCard(false);
        });

        // Global DOM event listeners to dispose hover card immediately when Control key is released or window loses focus
        window.addEventListener('keyup', (e) => {
          if (e.key === 'Control' || e.key === 'Meta' || e.key === 'Escape' || (!e.ctrlKey && !e.metaKey && !isMouseOverCard)) {
            disposeControlHover();
          }
        }, true);

        window.addEventListener('blur', () => {
          disposeControlHover();
        }, true);

        async function renderHoverCardAt(pos, clientX, clientY, anchorElement) {
          if (!pos) {
            disposeControlHover();
            return;
          }
          const model = editor.getModel();
          if (!model || isPositionInStringOrComment(model, pos)) {
            disposeControlHover();
            return;
          }
          const wordInfo = model.getWordAtPosition(pos);
          if (!wordInfo || !wordInfo.word) {
            disposeControlHover();
            return;
          }

          const word = wordInfo.word;
          const keywords = new Set([
            'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'default',
            'return', 'break', 'continue', 'struct', 'class', 'enum', 'union',
            'public', 'private', 'protected', 'void', 'int', 'float', 'double',
            'char', 'bool', 'const', 'static', 'unsigned', 'signed', 'true',
            'false', 'null', 'nullptr', 'import', 'from', 'def', 'pass', 'try',
            'except', 'finally', 'with', 'as'
          ]);
          if (keywords.has(word)) {
            disposeControlHover();
            return;
          }

          lastHoverWord = word;
          const symbol = (model && pos ? parseSymbolDetails(word, model, pos) : null)
            || await findProjectSymbol(word, model)
            || parseSymbolDetails(word, model, null);
          if (word !== lastHoverWord || !symbol) return;

          const info = symbol;
          const isFunction = info.kind === 'function';
          const paramsList = Array.isArray(info.params) ? info.params : (info.params ? String(info.params).split(',').map(s => s.trim()).filter(Boolean) : []);
          const kindBadgeClass = 'hover-kind-' + (info.kind || 'variable');
          const kindTitle = info.subKind || (isFunction ? (info.isDefinition ? 'Function definition' : 'Function declaration') : (info.kind ? info.kind.toUpperCase() : 'SYMBOL'));

          // Location badge text
          let locText = '';
          if (symbol.path) {
            const fileName = symbol.path.split(/[\\/]/).pop();
            locText = fileName + (symbol.line ? `:${symbol.line}` : '');
          } else if (symbol.line) {
            locText = `line ${symbol.line}`;
          }

          const currentLine = model.getLineContent(pos.lineNumber) || '';
          const callMatch = currentLine.match(new RegExp(
            word.replace(/[.*+?^\${}()|[\]\\]/g, '\\$&') + '\\s*\\(([^)]*)\\)'
          ));
          const callValues = callMatch && callMatch[1].trim();

          let html = `
            <div class="hover-header">
              <span class="hover-kind-badge ${kindBadgeClass}">${escapeHtml(kindTitle)}</span>
              <div class="hover-meta-group">
                ${info.scopeText ? `<span class="hover-scope-pill">${escapeHtml(info.scopeText)}</span>` : ''}
                ${locText ? `<span class="hover-loc">${escapeHtml(locText)}</span>` : ''}
              </div>
            </div>
            <div class="hover-proto">${formatHighlightedPrototype(info)}</div>
          `;

          let detailsHtml = '<div class="hover-details-box">';
          let hasDetails = false;

          if (info.value && (info.kind === 'variable' || info.kind === 'constant' || info.kind === 'parameter')) {
            detailsHtml += `<div class="hover-prop-row"><span class="hover-prop-key">Initial value:</span><code class="hover-prop-val">${escapeHtml(info.value)}</code></div>`;
            hasDetails = true;
          }
          if (info.returnType && info.returnType !== 'auto') {
            detailsHtml += `<div class="hover-prop-row"><span class="hover-prop-key">Data type:</span><span class="hover-type-tag">${escapeHtml(info.returnType)}</span></div>`;
            hasDetails = true;
          }
          if (info.arrayDim) {
            detailsHtml += `<div class="hover-prop-row"><span class="hover-prop-key">Dimensions:</span><span class="hover-type-tag">${escapeHtml(info.arrayDim)}</span></div>`;
            hasDetails = true;
          }
          if (info.parentFunction) {
            detailsHtml += `<div class="hover-prop-row"><span class="hover-prop-key">Function:</span><span class="hover-type-tag">${escapeHtml(info.parentFunction)}()</span></div>`;
            hasDetails = true;
          }
          if (isFunction && paramsList.length > 0) {
            const paramTags = paramsList.map(p => `<span class="hover-param-tag">${escapeHtml(p)}</span>`).join('');
            detailsHtml += `<div class="hover-prop-row" style="align-items:flex-start;"><span class="hover-prop-key">Parameters:</span><div style="display:flex; flex-wrap:wrap; gap:4px;">${paramTags}</div></div>`;
            hasDetails = true;
          }
          if (isFunction && callValues) {
            detailsHtml += `<div class="hover-prop-row"><span class="hover-prop-key">Caller args:</span><code class="hover-prop-val">${escapeHtml(callValues)}</code></div>`;
            hasDetails = true;
          }

          detailsHtml += '</div>';
          if (hasDetails) html += detailsHtml;

          html += `
            <div class="hover-footer">
              <button class="hover-goto-btn" onclick="window.jumpToDefinitionWord('${escapeHtml(word)}')">
                <span>👉 Go to Definition</span>
                <kbd style="font-size:10px; opacity:0.85; margin-left:4px; background:var(--hover-code-bg); padding:1px 5px; border-radius:3px; border:1px solid var(--hover-border);">F12</kbd>
              </button>
              <span style="font-size:10px; color:var(--text-dim);">Ctrl+Click / F12 to jump</span>
            </div>
          `;

          customHoverCard.innerHTML = html;
          customHoverCard.style.visibility = 'hidden';
          customHoverCard.style.display = 'block';

          const anchorRect = anchorElement && anchorElement.getBoundingClientRect
            ? anchorElement.getBoundingClientRect() : null;
          const anchorX = anchorRect && anchorRect.width ? anchorRect.left : clientX;
          const anchorTop = anchorRect && anchorRect.height ? anchorRect.top : clientY;
          const cardWidth = customHoverCard.offsetWidth || 380;
          const cardHeight = customHoverCard.offsetHeight || 140;

          let left = Math.min(window.innerWidth - cardWidth - 12, Math.max(12, anchorX));
          let top = anchorTop - cardHeight - 8;
          if (top < 10) {
            top = (anchorRect && anchorRect.bottom ? anchorRect.bottom : clientY) + 16;
          }
          top = Math.max(10, Math.min(window.innerHeight - cardHeight - 12, top));

          customHoverCard.style.left = left + 'px';
          customHoverCard.style.top = top + 'px';
          customHoverCard.style.visibility = 'visible';
          customHoverCard.style.display = 'block';
        }

        editor.onMouseMove((e) => {
          const event = e.event || e.browserEvent || {};
          const pos = e.target && e.target.position;
          const isCtrl = !!(event.ctrlKey || event.metaKey);

          if (!isCtrl || !pos) {
            disposeControlHover();
            return;
          }

          const model = editor.getModel();
          if (!model || isPositionInStringOrComment(model, pos)) {
            disposeControlHover();
            return;
          }

          const wordInfo = model.getWordAtPosition(pos);
          if (!wordInfo || !wordInfo.word) {
            disposeControlHover();
            return;
          }

          const word = wordInfo.word;
          const keywords = new Set([
            'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'default',
            'return', 'break', 'continue', 'struct', 'class', 'enum', 'union',
            'public', 'private', 'protected', 'void', 'int', 'float', 'double',
            'char', 'bool', 'const', 'static', 'unsigned', 'signed', 'true',
            'false', 'null', 'nullptr', 'import', 'from', 'def', 'pass', 'try',
            'except', 'finally', 'with', 'as'
          ]);
          if (keywords.has(word)) {
            disposeControlHover();
            return;
          }

          updateCtrlHover(pos, true);

          if (hoverTimer) clearTimeout(hoverTimer);
          const cx = event.clientX || (e.browserEvent && e.browserEvent.clientX) || 100;
          const cy = event.clientY || (e.browserEvent && e.browserEvent.clientY) || 100;
          hoverTimer = setTimeout(() => {
            renderHoverCardAt(pos, cx, cy, e.target && e.target.element);
          }, 80);
        });

        editor.onMouseLeave(() => {
          if (!isMouseOverCard) disposeControlHover();
        });
        editor.onKeyUp((e) => {
          const event = e.browserEvent || {};
          if (!event.ctrlKey && !event.metaKey && !isMouseOverCard) disposeControlHover();
        });
        editor.onDidChangeModelContent(() => {
          disposeControlHover();
        });
        editor.onDidChangeModel(() => {
          disposeControlHover();
        });

        // Register command for command URI execution inside Markdown hover tooltips
        try {
          if (typeof monaco !== 'undefined' && monaco.editor && monaco.editor.registerCommand) {
            monaco.editor.registerCommand('gotoDefinitionWord', function (accessor, wordArg) {
              let word = wordArg;
              if (Array.isArray(word)) word = word[0];
              if (word) jumpToDefinitionAtPosition(null, word);
            });
          }
          editor.addAction({
            id: 'gotoDefinitionWord',
            label: 'Go to Definition',
            run: function (ed, wordArg) {
              let word = wordArg;
              if (Array.isArray(word)) word = word[0];
              if (word) jumpToDefinitionAtPosition(null, word);
            }
          });
        } catch (e) { }

        // Register Definition Provider & Hover Provider for Monaco
        const SUPPORTED_LANGS = ['cpp', 'c', 'ino', 'h', 'python', 'py', 'javascript', 'js', 'json', 'plaintext'];
        try {
          if (typeof monaco !== 'undefined' && monaco.languages) {
            monaco.languages.registerDefinitionProvider(SUPPORTED_LANGS, {
              provideDefinition: function (model, position) {
                if (isPositionInStringOrComment(model, position)) return null;
                const wordInfo = model.getWordAtPosition(position);
                if (!wordInfo || !wordInfo.word) return null;
                const sym = parseSymbolDetails(wordInfo.word, model, position);
                if (sym && sym.model && sym.line) {
                  return {
                    uri: sym.model.uri,
                    range: new monaco.Range(sym.line, 1, sym.line, 1)
                  };
                }
                return null;
              }
            });
          }
        } catch (e) { }

        // Register Hover Provider matching Arduino IDE 2.x / VS Code styling
        try {
          if (typeof monaco !== 'undefined' && monaco.languages) {
            monaco.languages.registerHoverProvider(SUPPORTED_LANGS, {
              provideHover: function (model, position) {
                if (isPositionInStringOrComment(model, position)) return null;
                const wordInfo = model.getWordAtPosition(position);
                if (!wordInfo || !wordInfo.word) return null;

                const keywords = new Set([
                  'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'default',
                  'return', 'break', 'continue', 'struct', 'class', 'enum', 'union',
                  'public', 'private', 'protected', 'void', 'int', 'float', 'double',
                  'char', 'bool', 'const', 'static', 'unsigned', 'signed', 'true',
                  'false', 'null', 'nullptr', 'import', 'from', 'def', 'pass', 'try',
                  'except', 'finally', 'with', 'as'
                ]);
                if (keywords.has(wordInfo.word)) return null;

                const sym = parseSymbolDetails(wordInfo.word, model, position);
                if (!sym) return null;

                const lines = [];
                const kindTitle = sym.subKind || (sym.kind ? sym.kind.toUpperCase() : 'SYMBOL');
                const scopeStr = sym.scopeText ? ` (${sym.scopeText})` : '';

                lines.push(`**${kindTitle}**${scopeStr} \`${sym.name}\``);

                if (sym.prototype) {
                  lines.push('```cpp\n' + sym.prototype + '\n```');
                }

                if (sym.value && (sym.kind === 'variable' || sym.kind === 'constant' || sym.kind === 'parameter')) {
                  lines.push(`**Initial value:** \`${sym.value}\``);
                }
                if (sym.returnType && sym.returnType !== 'auto') {
                  lines.push(`**Type:** \`${sym.returnType}\``);
                }
                if (sym.arrayDim) {
                  lines.push(`**Dimensions:** \`${sym.arrayDim}\``);
                }
                if (sym.parentFunction) {
                  lines.push(`**Function:** \`${sym.parentFunction}()\``);
                }
                if (sym.kind === 'function' && sym.params && sym.params.length > 0) {
                  lines.push(`**Parameters:** ` + sym.params.map(p => `\`${p}\``).join(', '));
                }

                const encodedWord = encodeURIComponent(JSON.stringify([sym.name]));
                lines.push(`[👉 Go to Definition (F12)](command:gotoDefinitionWord?${encodedWord})`);

                return {
                  range: new monaco.Range(position.lineNumber, wordInfo.startColumn, position.lineNumber, wordInfo.endColumn),
                  contents: [
                    {
                      value: lines.join('\n\n'),
                      isTrusted: true
                    }
                  ]
                };
              }
            });
          }
        } catch (e) {
          console.error("Failed to register Monaco hover provider:", e);
        }

        // Mouse click listener (Ctrl + Click or Cmd + Click)
        editor.onMouseDown((e) => {
          const evt = e.event || e.browserEvent || {};
          const isCtrl = evt.ctrlKey || evt.metaKey || (e.browserEvent && (e.browserEvent.ctrlKey || e.browserEvent.metaKey));
          const isLeft = evt.leftButton === true || evt.button === 0 || (e.browserEvent && (e.browserEvent.leftButton === true || e.browserEvent.button === 0));

          if (isCtrl && isLeft) {
            const pos = (e.target && e.target.position) ? e.target.position : editor.getPosition();
            if (pos) {
              editor.setPosition(pos);
              jumpToDefinitionAtPosition(pos);
            }
          }
        });

        // Keyboard listener (F12)
        editor.onKeyDown((e) => {
          const key = e.browserEvent ? e.browserEvent.key : '';
          const keyCode = e.browserEvent ? e.browserEvent.keyCode : e.keyCode;
          if (key === 'F12' || keyCode === 123 || keyCode === 104) {
            if (e.browserEvent) {
              e.browserEvent.preventDefault();
              e.browserEvent.stopPropagation();
            }
            jumpToDefinitionAtPosition();
          }
        });

        // Global DOM level 3 event listener fallback
        const anchor = document.getElementById('monaco-anchor') || document.body;
        anchor.addEventListener('click', (e) => {
          if (e.ctrlKey || e.metaKey) {
            setTimeout(() => {
              jumpToDefinitionAtPosition();
            }, 20);
          }
        }, true);

        window.addEventListener('keydown', (e) => {
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            jumpToDefinitionAtPosition();
          }
        }, true);
      }

      setTimeout(attachNavigationListeners, 300);
    })();

  <script>
    (function () {
      let themesRegistered = false;

      function registerCustomMonacoThemes() {
        const monacoObj = window.monaco || (typeof monaco !== 'undefined' ? monaco : null);
        if (!monacoObj || !monacoObj.editor) return;
        if (themesRegistered) return;
        themesRegistered = true;

        try {
          monacoObj.editor.defineTheme('mcu-solarized-dark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
              { token: '', foreground: 'ffffff', background: '002b36' },
              { token: 'comment', foreground: '718c93', fontStyle: 'italic' },
              { token: 'string', foreground: '2aa198' },
              { token: 'keyword', foreground: '859900', fontStyle: 'bold' },
              { token: 'number', foreground: 'd33682' },
              { token: 'type', foreground: 'b58900' },

              { token: 'delimiter', foreground: 'e0e6ed' }

            colors: {
              'editor.background': '#002b36',
              'editor.foreground': '#ffffff',

            }
          });

          monacoObj.editor.defineTheme('mcu-light', {
            base: 'vs',
            inherit: true,
            rules: [
              { token: '', foreground: '24292f', background: 'ffffff' },
              { token: 'comment', foreground: '6e7781', fontStyle: 'italic' },
              { token: 'string', foreground: '0a3069' },
              { token: 'keyword', foreground: 'cf222e', fontStyle: 'bold' },
              { token: 'number', foreground: '0550ae' },
              { token: 'type', foreground: '953800' },
              { token: 'identifier', foreground: '116329' },
              { token: 'delimiter', foreground: '24292f' }
            ],
            colors: {
              'editor.background': '#ffffff',
              'editor.foreground': '#24292f',
              'editorLineNumber.foreground': '#8c959f',
              'editorLineNumber.activeForeground': '#0969da',
              'editor.lineHighlightBackground': '#f6f8fa',
              'editorCursor.foreground': '#0969da',
              'editorWhitespace.foreground': '#d0d7de',
              'editorIndentGuide.background': '#d0d7de',
              'editorIndentGuide.activeBackground': '#afb8c1',
              'editor.selectionBackground': '#add6ff',
              'editorGutter.background': '#f6f8fa'
            }
          });

          monacoObj.editor.defineTheme('mcu-default-dark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
              { token: '', foreground: 'e0e6ed', background: '151922' },
              { token: 'comment', foreground: '718294', fontStyle: 'italic' },
              { token: 'keyword', foreground: '00d2ff', fontStyle: 'bold' },
              { token: 'string', foreground: '98c379' },
              { token: 'number', foreground: 'd19a66' }
            ],
            colors: {
              'editor.background': '#151922',
              'editor.foreground': '#ffffff',
              'editorLineNumber.foreground': '#6b7d94',
              'editorLineNumber.activeForeground': '#00d2ff',
              'editor.lineHighlightBackground': '#1e2430',
              'editor.selectionBackground': '#2c3748',
              'editorGutter.background': '#151922'
            }
          });
        } catch (e) {
          console.warn("Could not register custom Monaco themes", e);
        }
      }

      window.setEditorTheme = function (themeName) {
        themeName = (themeName || 'default').toLowerCase().trim();
        document.body.classList.remove('theme-default', 'theme-light', 'theme-solarized-dark');

        registerCustomMonacoThemes();
        const monacoObj = window.monaco || (typeof monaco !== 'undefined' ? monaco : null);

        let targetMonacoTheme = 'mcu-default-dark';
        if (themeName === 'light') {
          document.body.classList.add('theme-light');
          targetMonacoTheme = 'mcu-light';
        } else if (themeName === 'solarized_dark' || themeName === 'solarized' || themeName === 'solarize_dark' || themeName === 'solarized-dark') {
          document.body.classList.add('theme-solarized-dark');
          targetMonacoTheme = 'mcu-solarized-dark';
        } else {
          document.body.classList.add('theme-default');
          targetMonacoTheme = 'mcu-default-dark';
        }

        if (monacoObj && monacoObj.editor) {
          try {
            monacoObj.editor.setTheme(targetMonacoTheme);
          } catch (e) {
            try {
              monacoObj.editor.setTheme(targetMonacoTheme === 'mcu-light' ? 'vs' : 'vs-dark');
            } catch (e2) {}
          }
        }
        if (window.editorInstance && typeof window.editorInstance.updateOptions === 'function') {
          try {
            window.editorInstance.updateOptions({ theme: targetMonacoTheme });
          } catch (e) {}
        }
      };

      window.setEditorFontSize = function (sz) {
        if (sz && window.editorInstance && typeof window.editorInstance.updateOptions === 'function') {
          try {
            window.editorInstance.updateOptions({ fontSize: Number(sz) });
          } catch (e) {}
        }
      };

      async function autoInitTheme() {
        if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.get_theme_mode === 'function') {
          try {
            const theme = await window.pywebview.api.get_theme_mode();
            window.setEditorTheme(theme);
          } catch (e) {
            window.setEditorTheme('default');
          }
        }
      }

      async function autoInitFontSize() {
        if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.get_font_size === 'function') {
          try {
            const sz = await window.pywebview.api.get_font_size();
            if (sz && window.editorInstance && typeof window.editorInstance.updateOptions === 'function') {
              window.editorInstance.updateOptions({ fontSize: Number(sz) });
            }
          } catch (e) {}
        }
      }

      window.addEventListener('pywebviewready', () => {
        autoInitTheme();
        autoInitFontSize();
      });
      document.addEventListener('DOMContentLoaded', () => {
        registerCustomMonacoThemes();
        setTimeout(() => { autoInitTheme(); autoInitFontSize(); }, 50);
        setTimeout(() => { autoInitTheme(); autoInitFontSize(); }, 300);
      });
    })();
  </script>
