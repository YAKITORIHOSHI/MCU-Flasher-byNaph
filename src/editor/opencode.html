<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCode AI Assistant</title>
  <link rel="stylesheet" href="../assets/xterm/xterm.css">
  <style>
    :root {
      --terminal-fg: #e3edf6;
      --frost: none; --fallback: #18283b; --sheet: rgba(255, 255, 255, 0.05);
      --reading: rgba(16, 27, 42, 0.667); --reading-rim: rgba(255, 255, 255, 0.133);
      --scene-width: 100vw; --scene-height: 62.5vw; --scene-x: 0px; --scene-y: 0px;
    }
    html, body, #assistant { height: 100%; margin: 0; overflow: hidden; color: var(--terminal-fg); }
    /* The glass under this view, then a smoked well for the text inside it. */
    html {
      background:
        linear-gradient(var(--sheet), var(--sheet)),
        var(--frost) var(--scene-x) var(--scene-y) / var(--scene-width) var(--scene-height) no-repeat,
        var(--fallback);
    }
    #assistant { box-sizing: border-box; background: var(--reading); border: 1px solid var(--reading-rim); border-radius: 10px; }
    /* FitAddon subtracts xterm padding; padding on its parent is grid space. */
    #assistant .xterm { height: 100%; padding: 8px; box-sizing: border-box; }
    #error { padding: 16px; color: var(--terminal-fg); font: 14px sans-serif; }
  </style>
  <script src="../assets/xterm/xterm.js"></script>
  <script src="../assets/xterm/xterm-addon-fit.js"></script>
  <script src="qwebchannel.js"></script>
  <script src="glass_page.js"></script>
  <script src="assistant_readiness.js"></script>
</head>
<body>
  <div id="assistant" aria-label="Dedicated OpenCode AI Assistant"></div>
  <script>
    (() => {
      if (!window.Terminal || !window.FitAddon || !window.QWebChannel || !window.AssistantReadiness) {
        document.body.innerHTML = '<p id="error">OpenCode assets are missing. Restore the application assets and retry.</p>';
        return;
      }
      const term = new Terminal({scrollback: 5000, fontFamily: 'Ubuntu Mono, DejaVu Sans Mono, monospace', fontSize: 14,
        minimumContrastRatio: 4.5, allowTransparency: true,
        theme: {background: 'rgba(35, 51, 69, 0)', foreground: '#e3edf6', cursor: '#80d9ce'}});
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById('assistant'));
      let bridge = null, generation = 0, lastSize = '', fitPending = false;
      const readiness = AssistantReadiness.create(term, reason => {
        if (bridge) bridge.report_interface_ready(generation, reason);
      });
      window.focusOpenCode = () => term.focus();
      window.fitOpenCode = () => {
        const host = document.getElementById('assistant');
        if (host.offsetWidth < 50 || host.offsetHeight < 50) return;
        fit.fit();
        const size = term.rows + 'x' + term.cols;
        if (bridge && size !== lastSize) { lastSize = size; bridge.resize(term.rows, term.cols); }
      };
      window.configureOpenCode = (theme, size, scrollback = 5000) => {
        term.options.theme = theme; term.options.fontSize = size; term.options.scrollback = scrollback;
        document.documentElement.style.setProperty('--terminal-fg', theme.foreground);
        window.fitOpenCode();
      };
      new QWebChannel(qt.webChannelTransport, channel => {
        bridge = channel.objects.assistantBridge;
        bridge.reset_view.connect(epoch => {
          generation = epoch; term.reset(); lastSize = ''; readiness.reset(); window.fitOpenCode();
        });
        bridge.output.connect((epoch, data) => {
          if (epoch !== generation) return;
          term.write(data, () => {
            bridge.consumed(epoch, data.length);
            if (epoch === generation) readiness.observe();
          });
        });
        term.onData(data => bridge.write(generation, data));
        window.fitOpenCode();
        bridge.start();
      });
      new ResizeObserver(() => {
        if (fitPending) return;
        fitPending = true;
        requestAnimationFrame(() => { fitPending = false; window.fitOpenCode(); });
      }).observe(document.getElementById('assistant'));
    })();
  </script>
</body>
</html>
