<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#14141e" />
    </linearGradient>
    
    <!-- Chip Body Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d35" />
      <stop offset="100%" stop-color="#18181f" />
    </linearGradient>

    <!-- Glowing Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glowing Pink Gradient -->
    <linearGradient id="magentaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>

    <!-- Soft Drop Shadows and Neon Glows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Futuristic Grid Overlay -->
  <g opacity="0.15">
    <!-- Horizontal Grid Lines -->
    <path d="M0,50 L800,50 M0,100 L800,100 M0,150 L800,150 M0,200 L800,200 M0,250 L800,250 M0,300 L800,300 M0,350 L800,350 M0,400 L800,400 M0,450 L800,450 M0,500 L800,500 M0,550 L800,550" stroke="#4facfe" stroke-width="0.5" />
    <!-- Vertical Grid Lines -->
    <path d="M100,0 L100,600 M200,0 L200,600 M300,0 L300,600 M400,0 L400,600 M500,0 L500,600 M600,0 L600,600 M700,0 L700,600" stroke="#4facfe" stroke-width="0.5" />
  </g>

  <!-- Circular Radar/Tech Rings in background -->
  <circle cx="400" cy="300" r="220" fill="none" stroke="#ff007f" stroke-width="1" opacity="0.1" stroke-dasharray="10 15" />
  <circle cx="400" cy="300" r="260" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.15" stroke-dasharray="5 5" />
  <circle cx="400" cy="300" r="180" fill="none" stroke="#00f2fe" stroke-width="0.5" opacity="0.1" />

  <!-- Connecting copper/glowing traces -->
  <g opacity="0.6">
    <!-- Left to Chip -->
    <path d="M150,180 L230,180 L250,220 L300,220" fill="none" stroke="url(#cyanGlow)" stroke-width="2" filter="url(#glowCyan)" />
    <path d="M100,300 L250,300 L270,270 L300,270" fill="none" stroke="url(#cyanGlow)" stroke-width="2" filter="url(#glowCyan)" />
    <path d="M150,420 L230,420 L250,380 L300,380" fill="none" stroke="url(#cyanGlow)" stroke-width="1.5" opacity="0.7" />

    <!-- Right to Chip -->
    <path d="M650,180 L570,180 L550,220 L500,220" fill="none" stroke="url(#magentaGlow)" stroke-width="2" filter="url(#glowMagenta)" />
    <path d="M700,300 L550,300 L530,330 L500,330" fill="none" stroke="url(#magentaGlow)" stroke-width="2" filter="url(#glowMagenta)" />
    <path d="M650,420 L570,420 L550,380 L500,380" fill="none" stroke="url(#magentaGlow)" stroke-width="1.5" opacity="0.7" />

    <!-- Technical Labels along traces -->
    <text x="160" y="172" fill="#00f2fe" font-family="Consolas, monospace" font-size="10" opacity="0.7" letter-spacing="1">TXD0</text>
    <text x="110" y="292" fill="#00f2fe" font-family="Consolas, monospace" font-size="10" opacity="0.7" letter-spacing="1">RXD0</text>
    <text x="160" y="435" fill="#00f2fe" font-family="Consolas, monospace" font-size="10" opacity="0.7" letter-spacing="1">GND</text>

    <text x="610" y="172" fill="#ff007f" font-family="Consolas, monospace" font-size="10" opacity="0.7" letter-spacing="1">DTR_RESET</text>
    <text x="630" y="292" fill="#ff007f" font-family="Consolas, monospace" font-size="10" opacity="0.7" letter-spacing="1">RTS_BOOT</text>
    <text x="610" y="435" fill="#ff007f" font-family="Consolas, monospace" font-size="10" opacity="0.7" letter-spacing="1">3V3_PWR</text>
  </g>

  <!-- Glowing dots on trace corners -->
  <circle cx="230" cy="180" r="3" fill="#00f2fe" filter="url(#glowCyan)" />
  <circle cx="250" cy="220" r="3" fill="#00f2fe" filter="url(#glowCyan)" />
  <circle cx="250" cy="300" r="3" fill="#00f2fe" filter="url(#glowCyan)" />
  <circle cx="270" cy="270" r="3" fill="#00f2fe" filter="url(#glowCyan)" />

  <circle cx="570" cy="180" r="3" fill="#ff007f" filter="url(#glowMagenta)" />
  <circle cx="550" cy="220" r="3" fill="#ff007f" filter="url(#glowMagenta)" />
  <circle cx="550" cy="300" r="3" fill="#ff007f" filter="url(#glowMagenta)" />
  <circle cx="530" cy="330" r="3" fill="#ff007f" filter="url(#glowMagenta)" />

  <!-- Microcontroller Chip Model (ESP32) Centerpiece -->
  <g transform="translate(300, 160)">
    <!-- Metallic Pins (Left Side) -->
    <g fill="#a0a0a5">
      <rect x="-12" y="20" width="15" height="6" rx="1" />
      <rect x="-12" y="40" width="15" height="6" rx="1" />
      <rect x="-12" y="60" width="15" height="6" rx="1" />
      <rect x="-12" y="80" width="15" height="6" rx="1" />
      <rect x="-12" y="100" width="15" height="6" rx="1" />
      <rect x="-12" y="120" width="15" height="6" rx="1" />
      <rect x="-12" y="140" width="15" height="6" rx="1" />
      <rect x="-12" y="160" width="15" height="6" rx="1" />
      <rect x="-12" y="180" width="15" height="6" rx="1" />
      <rect x="-12" y="200" width="15" height="6" rx="1" />
      <rect x="-12" y="220" width="15" height="6" rx="1" />
      <rect x="-12" y="240" width="15" height="6" rx="1" />
    </g>

    <!-- Metallic Pins (Right Side) -->
    <g fill="#a0a0a5">
      <rect x="197" y="20" width="15" height="6" rx="1" />
      <rect x="197" y="40" width="15" height="6" rx="1" />
      <rect x="197" y="60" width="15" height="6" rx="1" />
      <rect x="197" y="80" width="15" height="6" rx="1" />
      <rect x="197" y="100" width="15" height="6" rx="1" />
      <rect x="197" y="120" width="15" height="6" rx="1" />
      <rect x="197" y="140" width="15" height="6" rx="1" />
      <rect x="197" y="160" width="15" height="6" rx="1" />
      <rect x="197" y="180" width="15" height="6" rx="1" />
      <rect x="197" y="200" width="15" height="6" rx="1" />
      <rect x="197" y="220" width="15" height="6" rx="1" />
      <rect x="197" y="240" width="15" height="6" rx="1" />
    </g>

    <!-- Chip Base Body -->
    <rect x="0" y="0" width="200" height="280" rx="12" fill="url(#chipGrad)" stroke="#2b2d35" stroke-width="3" filter="drop-shadow(0px 15px 25px rgba(0,0,0,0.75))" />

    <!-- ESP32 Metal Shield Plate Inside -->
    <rect x="15" y="15" width="170" height="250" rx="8" fill="#1f1f26" stroke="#3c3f4a" stroke-width="1.5" />

    <!-- ESP32 Espressif Logo Details -->
    <path d="M85,50 C85,40 115,40 115,50 C115,60 85,60 85,50 Z" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#glowCyan)" opacity="0.8" />
    <circle cx="100" cy="50" r="3" fill="#ff007f" filter="url(#glowMagenta)" />

    <!-- Text on the Microcontroller Chip -->
    <text x="100" y="100" fill="#ffffff" font-family="'Segoe UI', Helvetica, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="4">ESP32-S3</text>
    <text x="100" y="125" fill="#8a8a9f" font-family="'Segoe UI', Helvetica, sans-serif" font-weight="600" font-size="11" text-anchor="middle" letter-spacing="1">FLASH COMPILER</text>
    <text x="100" y="142" fill="#8a8a9f" font-family="Consolas, monospace" font-size="9" text-anchor="middle">MAC: 24:A7:2F:B3:C1:0A</text>

    <!-- Center Upload Neon Icon -->
    <g transform="translate(100, 205)" filter="url(#glowCyan)">
      <!-- Circle behind upload arrow -->
      <circle cx="0" cy="0" r="30" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 4" />
      <!-- Upload arrow / Rocket icon -->
      <path d="M-10,-5 L0,-18 L10,-5 M0,-18 L0,12 M-15,12 L15,12" fill="none" stroke="url(#cyanGlow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Futuristic Corner Borders (HUD Style) -->
  <path d="M40,50 L40,40 L50,40" fill="none" stroke="#00f2fe" stroke-width="2" />
  <path d="M760,50 L700,50" fill="none" stroke="#ff007f" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
  <path d="M760,50 L760,40 L750,40" fill="none" stroke="#ff007f" stroke-width="2" />
  <path d="M40,550 L40,560 L50,560" fill="none" stroke="#00f2fe" stroke-width="2" />
  <path d="M760,550 L760,560 L750,560" fill="none" stroke="#ff007f" stroke-width="2" />

  <!-- Outer Overlay Frame Text -->
  <text x="60" y="48" fill="#00f2fe" font-family="Consolas, monospace" font-size="12" font-weight="bold" letter-spacing="2" filter="url(#glowCyan)">MCU FLASH GUI</text>
  <text x="738" y="575" fill="#ff007f" font-family="Consolas, monospace" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="end" filter="url(#glowMagenta)">v3.2.5 BY NAPH</text>
  <text x="60" y="575" fill="#4facfe" font-family="Consolas, monospace" font-size="10" opacity="0.6">SYSTEM STATUS: READY // MONITOR: REALTIME_ONLINE</text>
</svg>