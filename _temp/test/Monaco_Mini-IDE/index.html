<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Monaco Mini-IDE</title>
<style>
  html, body { height: 100%; margin: 0; background: #1e1e1e; font-family: Segoe UI, sans-serif; }
  #toolbar {
    display: flex; align-items: center; gap: 6px;
    height: 40px; padding: 0 10px; background: #2d2d2d;
    border-bottom: 1px solid #3c3c3c; box-sizing: border-box;
  }
  #toolbar button {
    background: #3c3c3c; color: #ddd; border: 1px solid #4a4a4a;
    padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 13px;
  }
  #toolbar button:hover { background: #4a4a4a; }
  #toolbar select {
    background: #3c3c3c; color: #ddd; border: 1px solid #4a4a4a;
    padding: 5px; border-radius: 3px; font-size: 13px;
  }
  #filename { color: #999; font-size: 13px; margin-left: auto; }
  #editor-container { position: absolute; top: 40px; left: 0; right: 0; bottom: 22px; }
  #statusbar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 22px;
    background: #007acc; color: white; font-size: 12px;
    display: flex; align-items: center; padding: 0 10px; box-sizing: border-box;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button onclick="newFile()">New</button>
  <button onclick="openFile()">Open</button>
  <button onclick="saveFile()">Save</button>
  <button onclick="saveFileAs()">Save As</button>
  <select id="languageSelect" onchange="changeLanguage()"></select>
  <span id="filename">untitled</span>
</div>

<div id="editor-container"></div>
<div id="statusbar"><span id="status">Ready</span></div>

<!-- Monaco loaded from CDN. If you later want this fully offline, download
     the monaco-editor npm package and point these paths at the local copy. -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs/loader.js"></script>
<script>
let editor;
let currentLanguage = "plaintext";

// Extension -> Monaco language id, used to auto-switch highlighting on open.
const EXT_TO_LANG = {
  py: "python", js: "javascript", ts: "typescript", jsx: "javascript", tsx: "typescript",
  html: "html", css: "css", json: "json", md: "markdown", cpp: "cpp", c: "c",
  h: "cpp", java: "java", cs: "csharp", go: "go", rs: "rust", php: "php",
  sh: "shell", yml: "yaml", yaml: "yaml", xml: "xml", sql: "sql", txt: "plaintext",
};

require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs" } });
require(["vs/editor/editor.main"], function () {
  editor = monaco.editor.create(document.getElementById("editor-container"), {
    value: "# Start typing...\n",
    language: "python",
    theme: "vs-dark",
    automaticLayout: true, // re-flows the editor when the window resizes
    fontSize: 14,
    minimap: { enabled: true },
  });

  // Populate the language dropdown from every language Monaco knows about.
  const select = document.getElementById("languageSelect");
  monaco.languages.getLanguages()
    .map(l => l.id)
    .sort()
    .forEach(id => {
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = id;
      select.appendChild(opt);
    });
  select.value = "python";

  editor.onDidChangeCursorPosition(updateStatus);
  updateStatus();

  // Ctrl+S / Cmd+S to save, intercepted at the browser level.
  window.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") {
      e.preventDefault();
      saveFile();
    }
  });
});

function updateStatus() {
  if (!editor) return;
  const pos = editor.getPosition();
  document.getElementById("status").textContent =
    `Line ${pos.lineNumber}, Column ${pos.column}  —  ${currentLanguage}`;
}

function setLanguageFromFilename(name) {
  const ext = name.split(".").pop().toLowerCase();
  const lang = EXT_TO_LANG[ext] || "plaintext";
  monaco.editor.setModelLanguage(editor.getModel(), lang);
  currentLanguage = lang;
  document.getElementById("languageSelect").value = lang;
  updateStatus();
}

function changeLanguage() {
  const lang = document.getElementById("languageSelect").value;
  monaco.editor.setModelLanguage(editor.getModel(), lang);
  currentLanguage = lang;
  updateStatus();
}

// ---- Bridge calls into Python (main.py Api class) ------------------------

async function newFile() {
  await pywebview.api.new_file();
  editor.setValue("");
  document.getElementById("filename").textContent = "untitled";
}

async function openFile() {
  const result = await pywebview.api.open_file_dialog();
  if (!result) return; // user cancelled
  if (result.error) {
    alert(result.error);
    return;
  }
  editor.setValue(result.content);
  document.getElementById("filename").textContent = result.name;
  setLanguageFromFilename(result.name);
}

async function saveFile() {
  const content = editor.getValue();
  const result = await pywebview.api.save_file(content);
  if (result) {
    document.getElementById("filename").textContent = result.name;
  }
}

async function saveFileAs() {
  const content = editor.getValue();
  const result = await pywebview.api.save_file_dialog(content);
  if (result) {
    document.getElementById("filename").textContent = result.name;
    setLanguageFromFilename(result.name);
  }
}
</script>
</body>
</html>
