[package]
name = "mcu-desktop-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Reparenting a live webview is a prototype feasibility gate. Tauri currently
# exposes this through unstable; no production release depends on it yet.
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mcu-contracts = { path = "../crates/contracts" }
mcu-core = { path = "../crates/core" }
mcu-host = { path = "../crates/host" }
