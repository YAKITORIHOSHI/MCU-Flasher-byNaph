[package]
name = "mcu-native-ui-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mcu-core = { path = "../crates/core" }
mcu-contracts = { path = "../crates/contracts" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
wry = "=0.57.0"

[target.'cfg(target_os = "windows")'.dependencies]
wry = "=0.57.0"
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
